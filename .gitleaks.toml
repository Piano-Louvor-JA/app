title = "LouvorJA"

[extend]
useDefault = true

# Chaves de catálogo (pt_hymnal_1996, catalogKey) batem em generic-api-key.
# Não são credenciais. O histórico do git também entra no scan.
[allowlist]
paths = [
  '''src/modules/sync/services/__tests__/library-catalog\.test\.ts''',
  '''src/modules/albums/services/album-catalog\.ts''',
  # localStorage keys tipo 'stage.bg-migrated-0510' (não são credenciais;
  # gitleaks v8 generic-api-key bate pela entropia do sufixo de data).
  '''src/modules/settings/services/stage-settings-preferences\.ts''',
  '''src/modules/settings/services/stage-settings-runtime\.ts''',
]
