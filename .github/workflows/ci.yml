# CI Pipeline - PIANO
# Roda em todo PR e push para staging/main.
name: CI

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx biome ci

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run type-check

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  regression-gate:
    name: Regression Gate (suite completa + type-check + build)
    runs-on: ubuntu-latest
    needs: [lint, typecheck, build]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Baseline: código da base (staging/main). O script test:regression
      # ainda não existe lá — preservamos a cópia deste PR e chamamos via node.
      - name: Fetch baseline branch (main ou staging)
        run: |
          set -euo pipefail
          BASE_BRANCH="${{ github.base_ref || 'staging' }}"
          test -f scripts/test-regression.mjs
          cp scripts/test-regression.mjs /tmp/test-regression.mjs
          git fetch origin "$BASE_BRANCH" --depth=1
          git read-tree -u --reset "origin/$BASE_BRANCH"
          mkdir -p scripts
          cp /tmp/test-regression.mjs scripts/test-regression.mjs
      - name: Rodar baseline
        run: node scripts/test-regression.mjs --baseline
      - name: Restaurar código do PR
        run: git read-tree -u --reset HEAD
      - name: Comparar com baseline (falha se regressão)
        run: node scripts/test-regression.mjs --compare

  electron-support-matrix:
    name: Resolve supported Electron versions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - id: matrix
        name: Resolve the latest three stable Electron majors
        run: |
          MATRIX="$(node -e "const {execFileSync}=require('node:child_process'); const versions=JSON.parse(execFileSync('npm',['view','electron','versions','--json'],{encoding:'utf8'})); const stable=versions.filter(v=>/^\\d+\\.\\d+\\.\\d+$/.test(v)); const majors=[...new Set(stable.map(v=>Number(v.split('.')[0])))].sort((a,b)=>b-a).slice(0,3).sort((a,b)=>a-b); if(majors.length!==3) throw new Error('Não foi possível resolver as três majors estáveis do Electron'); const include=majors.flatMap(major=>{const version=stable.filter(item=>item.startsWith(major+'.')).at(-1); return [{os:'windows-latest',platform:'win',target:'--win',version},{os:'ubuntu-latest',platform:'linux',target:'--linux AppImage',version},{os:'macos-latest',platform:'mac',target:'--mac',version}]}); process.stdout.write(JSON.stringify({include}))")"
          echo "value=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "$MATRIX"

  release-validation:
    name: Release Validation (${{ matrix.platform }} / Electron ${{ matrix.version }})
    needs: electron-support-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.electron-support-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Use supported Electron ${{ matrix.version }}
        run: npm install --no-save --ignore-scripts electron@${{ matrix.version }}
      - name: Package without publishing
        run: |
          node -e "require('node:fs').rmSync('dist-electron', { recursive: true, force: true })"
          npm run electron:build -- ${{ matrix.target }} --publish never
      - name: Validate updater artifacts and metadata
        run: node scripts/validate-release-artifacts.mjs ${{ matrix.platform }} "$(node -p "require('./package.json').version")"
      - name: Preserve artifacts for inspection
        uses: actions/upload-artifact@v4
        with:
          name: release-validation-${{ matrix.platform }}-electron-${{ matrix.version }}
          path: dist-electron/
          if-no-files-found: error
          retention-days: 14

  unit-tests:
    name: Unit Tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Excludes consagrados: worktrees do Stryker e dirs temporárias locais.
      - run: npx vitest run --exclude='.stryker-tmp/**' --exclude='.worktrees/**'

  e2e-tests:
    name: E2E Tests (playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # webServer do playwright.config.ts auto-starta o dev server (timeout 60s).
      - run: npx playwright test
      - name: Preserve trace/report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [lint, typecheck, build, regression-gate, release-validation, unit-tests, e2e-tests]
    if: always()
    steps:
      - name: Verifica se todos os gates passaram
        run: |
          echo "lint: ${{ needs.lint.result }}"
          echo "typecheck: ${{ needs.typecheck.result }}"
          echo "build: ${{ needs.build.result }}"
          echo "regression-gate: ${{ needs.regression-gate.result }}"
          echo "release-validation: ${{ needs.release-validation.result }}"
          echo "unit-tests: ${{ needs.unit-tests.result }}"
          echo "e2e-tests: ${{ needs.e2e-tests.result }}"
          echo "e2e-tests conclusion: ${{ needs.e2e-tests.conclusion }}"
          # regression-gate só roda em pull_request; em push fica "skipped".
          REG="${{ needs.regression-gate.result }}"
          # e2e-tests usa continue-on-error: true, então verificamos 'conclusion' não 'result'
          E2E_CONCLUSION="${{ needs.e2e-tests.conclusion }}"
          if [[ "${{ needs.lint.result }}" != "success" || "${{ needs.typecheck.result }}" != "success" || "${{ needs.build.result }}" != "success" || "${{ needs.release-validation.result }}" != "success" || "${{ needs.unit-tests.result }}" != "success" || ( "$E2E_CONCLUSION" != "success" && "$E2E_CONCLUSION" != "skipped" ) || ( "$REG" != "success" && "$REG" != "skipped" ) ]]; then
            echo "::error::Quality Gate FALHOU — corrija os erros antes do merge"
            exit 1
          fi
          echo "Quality Gate PASSOU"