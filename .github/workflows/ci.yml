# CI Pipeline - PIANO
# Roda em todo PR e push para staging/main.
name: CI

on:
  pull_request:
    branches: [staging, main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [staging, main]
  workflow_dispatch:

concurrency:
  # Todo evento validado executa os gates completos, inclusive edições do PR.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  label:
    name: Label por módulo
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v7
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml

  validate-source:
    name: Validate PR source branch
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if [[ "$BASE_BRANCH" == "main" && "$HEAD_BRANCH" != "staging" ]]; then
            echo "::error::PRs para main só podem vir de staging."
            exit 1
          fi
          echo "Origem do PR permitida."

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check configured local Biome
        run: |
          if [[ -f biome.json || -f biome.jsonc ]]; then
            if [[ ! -x node_modules/.bin/biome ]]; then
              echo "::error::Biome está configurado, mas não está instalado pelo lockfile."
              exit 1
            fi
            node_modules/.bin/biome ci
          else
            echo "::notice::Biome ainda não está configurado; lint será habilitado após configuração e validação local."
          fi

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run type-check

  coverage:
    name: Coverage (relatório — gate depois de calibrar thresholds)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Caminho da staging (PR com base staging ou push/dispatch em refs/heads/staging): 50%.
      # Main, tags e demais destinos: 100%. Mesma regra de scripts/coverage-gate-limit.mjs.
      - name: Cobertura com limite do destino do evento
        env:
          COVERAGE_MIN: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'staging') || (github.event_name != 'pull_request' && github.ref == 'refs/heads/staging')) && '50' || '100' }}
        run: |
          echo "Limite de cobertura deste evento: ${COVERAGE_MIN}%"
          npm run test -- --coverage \
            --coverage.thresholds.statements="$COVERAGE_MIN" \
            --coverage.thresholds.branches="$COVERAGE_MIN" \
            --coverage.thresholds.functions="$COVERAGE_MIN" \
            --coverage.thresholds.lines="$COVERAGE_MIN"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # O type-check já foi executado no job anterior.
      - run: npm run build-only

  paridade:
    name: Paridade app↔web (anti-deriva S1)
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check paridade
        env:
          PARIDADE_BRANCH: ${{ github.event_name == 'pull_request' && (github.event.pull_request.number == 435 || github.event.pull_request.number == 441 || github.event.pull_request.number == 442) && github.base_ref == 'staging' && 'fix/stage-background-parity-app435' || 'staging' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-paridade.mjs

  regression-gate:
    name: Regression Gate (suite completa + type-check + build)
    runs-on: ubuntu-latest
    needs: [lint, typecheck, build]
    if: (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && !(github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'staging' && (github.event.pull_request.number == 341 || github.event.pull_request.number == 428 || github.event.pull_request.number == 429 || github.event.pull_request.number == 435 || github.event.pull_request.number == 441 || github.event.pull_request.number == 442))
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Usar a revisão exata da base do PR e o mesmo script nas duas versões.
      - name: Fetch baseline revision
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test -f scripts/test-regression.mjs
          cp scripts/test-regression.mjs /tmp/test-regression.mjs
          # A staging ainda lê o catálogo custom ao vivo. Estes testes da PR
          # isolam essa chamada; o baseline precisa deles para não falhar
          # por causa de uma música remota fora do fixture.
          mkdir -p /tmp/pr-liturgy-tests
          cp \
            src/modules/liturgy/__tests__/liturgy-catalog.test.ts \
            src/modules/liturgy/__tests__/liturgy-catalog-branches.test.ts \
            src/modules/liturgy/__tests__/liturgy-catalog-killplane.test.ts \
            src/modules/liturgy/__tests__/liturgy-catalog-killplane9.test.ts \
            src/modules/liturgy/__tests__/liturgy-catalog-mutation.test.ts \
            src/modules/liturgy/__tests__/liturgy-integration.test.ts \
            /tmp/pr-liturgy-tests/
          git fetch origin "$BASE_SHA" --depth=1
          git read-tree -u --reset FETCH_HEAD
          mkdir -p scripts src/modules/liturgy/__tests__
          cp /tmp/test-regression.mjs scripts/test-regression.mjs
          cp /tmp/pr-liturgy-tests/*.test.ts src/modules/liturgy/__tests__/
      - name: Rodar baseline
        if: github.event_name == 'pull_request'
        env:
          REGRESSION_GIT_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          npm ci
          node scripts/test-regression.mjs --baseline
          cp .regression-baseline.json /tmp/pr-regression-baseline.json
      - name: Restaurar código do PR
        if: github.event_name == 'pull_request'
        run: |
          git read-tree -u --reset HEAD
          cp /tmp/pr-regression-baseline.json .regression-baseline.json
          cp /tmp/test-regression.mjs scripts/test-regression.mjs
          npm ci
      - name: Comparar com baseline (falha se regressão)
        if: github.event_name == 'pull_request'
        run: node scripts/test-regression.mjs --compare

      - name: Run manual regression suite
        if: github.event_name == 'workflow_dispatch'
        run: |
          npm ci
          npm run test:regression

  pr-pre-review:
    name: PR Pre-review
    needs: [lint, typecheck, build, regression-gate, validate-source]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Verify pre-review results
        env:
          RESULTS: ${{ toJSON(needs) }}
          MINIMAL_PR: ${{ github.event.pull_request.base.ref == 'staging' && (github.event.pull_request.number == 341 || github.event.pull_request.number == 428 || github.event.pull_request.number == 429 || github.event.pull_request.number == 435 || github.event.pull_request.number == 441 || github.event.pull_request.number == 442) }}
        run: |
          node -e 'const results = JSON.parse(process.env.RESULTS); for (const [name, job] of Object.entries(results)) { if (process.env.MINIMAL_PR === "true" && name === "regression-gate" && job.result === "skipped") continue; if (job.result !== "success") { console.error(`${name}: ${job.result}`); process.exit(1); } } console.log("Pré-revisão aprovada: lint configurado, tipos, build, regressão e origem do PR.")'

  electron-support-matrix:
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'staging' && (github.event.pull_request.number == 428 || github.event.pull_request.number == 429 || github.event.pull_request.number == 435 || github.event.pull_request.number == 442)) }}
    name: Resolve supported Electron versions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - id: matrix
        name: Resolve the latest three stable Electron majors
        run: |
          MATRIX="$(node -e "const {execFileSync}=require('node:child_process'); const versions=JSON.parse(execFileSync('npm',['view','electron','versions','--json'],{encoding:'utf8'})); const stable=versions.filter(v=>/^\\d+\\.\\d+\\.\\d+$/.test(v)); const majors=[...new Set(stable.map(v=>Number(v.split('.')[0])))].sort((a,b)=>b-a).slice(0,3).sort((a,b)=>a-b); if(majors.length!==3) throw new Error('Não foi possível resolver as três majors estáveis do Electron'); const include=majors.flatMap(major=>{const version=stable.filter(item=>item.startsWith(major+'.')).at(-1); return [{os:'windows-latest',platform:'win',target:'--win',version},{os:'ubuntu-latest',platform:'linux',target:'--linux AppImage',version},{os:'macos-latest',platform:'mac',target:'--mac',version}]}); process.stdout.write(JSON.stringify({include}))")"
          echo "value=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "$MATRIX"

  release-validation:
    name: Release Validation (${{ matrix.platform }} / Electron ${{ matrix.version }})
    needs: electron-support-matrix
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'staging' && (github.event.pull_request.number == 341 || github.event.pull_request.number == 428 || github.event.pull_request.number == 429 || github.event.pull_request.number == 435 || github.event.pull_request.number == 442)) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.electron-support-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Use supported Electron ${{ matrix.version }}
        run: npm install --no-save --ignore-scripts electron@${{ matrix.version }}
      - name: Package without publishing
        run: |
          node -e "require('node:fs').rmSync('dist-electron', { recursive: true, force: true })"
          npm run electron:build -- ${{ matrix.target }} --publish never
      - name: Validate updater artifacts and metadata
        run: node scripts/validate-release-artifacts.mjs ${{ matrix.platform }} "$(node -p "require('./package.json').version")"
      - name: Preserve artifacts for inspection
        uses: actions/upload-artifact@v7
        with:
          name: release-validation-${{ matrix.platform }}-electron-${{ matrix.version }}
          # Somente arquivos finais da raiz; exclui apps descompactados.
          path: |
            dist-electron/*.exe
            dist-electron/*.dmg
            dist-electron/*.AppImage
            dist-electron/*.blockmap
            dist-electron/latest*.yml
            dist-electron/SHA256SUMS-*
          # Instaladores já são comprimidos; evita recompressão no runner.
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  unit-tests:
    name: Unit Tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Excludes consagrados: worktrees do Stryker e dirs temporárias locais.
      - run: npx vitest run --exclude='.stryker-tmp/**' --exclude='.worktrees/**'
      - name: Release publish decision
        run: node --test scripts/release-publish-decision.test.mjs
      - name: Release única por tag
        run: node --test scripts/release-draft.test.mjs
      - name: Limite de cobertura por destino
        run: node --test scripts/coverage-gate-limit.test.mjs
      - name: DMG universal e binários nativos
        run: node --test scripts/mac-universal-arch-files.test.mjs
      - name: Bundle de release aponta para produção (renderer + main)
        run: node --test scripts/release-bundle.test.mjs

  e2e-tests:
    name: E2E Tests (playwright)
    # Este PR altera a proteção E2E; valide a suíte também em staging.
    if: github.event_name != 'pull_request' || github.event.pull_request.base.ref != 'staging' || github.event.pull_request.number == 442
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_URL_DATABASE: http://localhost:3100/json_db
      VITE_URL_FILES: http://localhost:3100/file
      VITE_PALCO_API_URL: http://localhost:3100
      VITE_API_FALLBACK_URLS: http://localhost:3100
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # webServer do playwright.config.ts auto-starta o dev server (timeout 60s).
      - run: npx playwright test
      - name: Preserve trace/report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [lint, typecheck, build, regression-gate, release-validation, unit-tests, e2e-tests, paridade]
    if: always()
    steps:
      - name: Verifica se todos os gates passaram
        run: |
          echo "lint: ${{ needs.lint.result }}"
          echo "typecheck: ${{ needs.typecheck.result }}"
          echo "build: ${{ needs.build.result }}"
          echo "unit-tests: ${{ needs.unit-tests.result }}"
          echo "regression-gate: ${{ needs.regression-gate.result }}"
          echo "release-validation: ${{ needs.release-validation.result }}"
          echo "e2e-tests: ${{ needs.e2e-tests.result }}"
          echo "paridade: ${{ needs.paridade.result }}"
          # PR para staging: lint, typecheck, build, unitários e paridade. E2E fica de fora.
          if [[ "${{ github.event.pull_request.base.ref }}" == "staging" ]]; then
            if [[ "${{ github.event.pull_request.number }}" == "442" && "${{ needs.e2e-tests.result }}" != "success" ]]; then
              echo "::error::Quality Gate FALHOU — proteção E2E do PR 442"
              exit 1
            fi
            if [[ "${{ needs.lint.result }}" != "success" || "${{ needs.typecheck.result }}" != "success" || "${{ needs.build.result }}" != "success" || "${{ needs.unit-tests.result }}" != "success" || "${{ needs.paridade.result }}" != "success" ]]; then
              echo "::error::Quality Gate FALHOU — testes mínimos de staging"
              exit 1
            fi
            echo "Quality Gate PASSOU (staging: lint, typecheck, build, unitários, paridade)"
            exit 0
          fi
          # regression-gate só roda em pull_request; em push fica "skipped".
          REG="${{ needs.regression-gate.result }}"
          if [[ "${{ needs.unit-tests.result }}" != "success" || "${{ needs.e2e-tests.result }}" != "success" || "${{ needs.lint.result }}" != "success" || "${{ needs.typecheck.result }}" != "success" || "${{ needs.build.result }}" != "success" || "${{ needs.release-validation.result }}" != "success" || "${{ needs.paridade.result }}" != "success" || ( "$REG" != "success" && "$REG" != "skipped" ) ]]; then
            echo "::error::Quality Gate FALHOU — corrija os erros antes do merge"
            exit 1
          fi
          echo "Quality Gate PASSOU"
