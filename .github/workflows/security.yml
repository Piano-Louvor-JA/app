# Security jobs
# Bloqueia PR com segredo (gitleaks).
# npm audit e semgrep ficam em relatório até haver baseline: o lockfile já tem
# high e o config auto do semgrep marca o código atual.
name: security
on:
  pull_request:
  push:
    branches: [staging, main]

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: gitleaks (segredos no diff/histórico)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # CLI aberto. A action gitleaks-action@v2 exige licença paga (GITLEAKS_LICENSE).
      - name: Run gitleaks
        run: |
          set -euo pipefail
          VERSION=8.28.0
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          # Sem --log-opts o gitleaks 8.28 usa `git log --all`. Com fetch-depth 0
          # isso inclui outros branches e faz o PR falhar por histórico que não
          # será integrado. HEAD cobre o histórico do ref em teste.
          /tmp/gitleaks detect --source . --config .gitleaks.toml --verbose --redact --log-opts=HEAD

  dependencies:
    name: npm audit (relatório)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - run: npm ci || npm install --no-save
      - run: npm audit --audit-level=high
        continue-on-error: true

  sast:
    name: semgrep SAST (relatório)
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config auto --exclude-rule generic.secrets.security.detected-generic-secret
