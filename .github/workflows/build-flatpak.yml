name: Build Flatpak

# Roda depois do Release Linux (não em paralelo na tag) para o tarball já existir.
# workflow_dispatch cobre reexecução manual (ex.: v1.26.0 após o fix).
on:
  workflow_run:
    workflows: ['Release Linux']
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão da release (ex: 1.26.0)'
        required: true

permissions:
  contents: write

jobs:
  decide:
    name: Decide publication
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.decision.outputs.publish }}
      reason: ${{ steps.decision.outputs.reason }}
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Decide publication
        id: decision
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.event.workflow_run.head_branch }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Publicação avaliada para ${TARGET_REF}."
          script="$(mktemp).mjs"
          gh api "repos/${GITHUB_REPOSITORY}/contents/scripts/release-publish-decision.mjs?ref=${WORKFLOW_SHA}" --jq .content \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{let t=s.trim();if(t.startsWith(String.fromCharCode(34)))t=JSON.parse(t);process.stdout.write(Buffer.from(String(t).replace(/\s/g,""),"base64"))})' \
            > "$script"
          node "$script" --fetch --repo "$GITHUB_REPOSITORY" --ref "$TARGET_REF"

      - name: Omit publication
        if: steps.decision.outputs.publish != 'true'
        run: |
          echo "Publicação omitida (${{ steps.decision.outputs.reason }})."
          echo "Nenhum Flatpak foi enviado à GitHub Release."

  flatpak:
    needs: decide
    # Só empacota se a decisão autorizar publicação e o Linux tiver concluído numa tag, ou no disparo manual.
    if: >-
      needs.decide.result == 'success' &&
      needs.decide.outputs.publish == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        startsWith(github.event.workflow_run.head_branch, 'v')))
    runs-on: ubuntu-24.04
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-46
      options: --privileged
    steps:
      - name: Resolve version + checkout tag
        id: meta
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${INPUT_VERSION#v}"
          else
            VERSION="${RUN_BRANCH#v}"
          fi
          [ -n "$VERSION" ] || { echo "no version"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=v$VERSION"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}

      # Baixa o tarball pela API (Accept: application/octet-stream + token).
      # /releases/download com Bearer quebra o redirect S3; sem token em repo
      # privado devolve 404 — daí o loop de 45 min na v1.26.0.
      - name: Update manifest version + sha256
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          ASSET="LouvorJA-PIANO-${VERSION}-x64.tar.gz"
          API_RELEASE="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/v${VERSION}"
          SHA=""

          for attempt in $(seq 1 10); do
            ASSET_ID="$(
              curl -fsSL \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "$API_RELEASE" \
              | ASSET_NAME="$ASSET" python3 -c '
          import json, os, sys
          name = os.environ["ASSET_NAME"]
          data = json.load(sys.stdin)
          for asset in data.get("assets", []):
              if asset.get("name") == name:
                  print(asset["id"])
                  break
          ' || true
            )"

            if [ -n "${ASSET_ID}" ]; then
              if curl -fsSL \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/octet-stream" \
                -o /tmp/src.tar.gz \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}"; then
                SHA="$(sha256sum /tmp/src.tar.gz | awk '{print $1}')"
                break
              fi
            fi
            echo "Aguardando ${ASSET} na release v${VERSION} (tentativa ${attempt}/10)..."
            sleep 30
          done

          [ -n "$SHA" ] || { echo "Asset não encontrado via API: ${ASSET}"; exit 1; }
          echo "version=$VERSION sha256=$SHA"
          MANIFEST=packaging/flatpak/com.pianolouvorja.piano.yaml
          sed -i "s|url: .*/releases/download/.*|url: https://github.com/pianolouvorja/app/releases/download/v$VERSION/${ASSET}|" "$MANIFEST"
          sed -i "s|sha256: [a-f0-9]\{64\}|sha256: $SHA|" "$MANIFEST"
          grep -E 'url:|sha256:' "$MANIFEST"

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: louvorja-piano.flatpak
          manifest-path: packaging/flatpak/com.pianolouvorja.piano.yaml
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          RELEASE_ID="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/v${VERSION}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
          # Remove asset antigo se reexecução
          EXISTING_ID="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" \
            | python3 -c '
          import json,sys
          for a in json.load(sys.stdin):
            if a.get("name") == "louvorja-piano.flatpak":
              print(a["id"]); break
          ' || true)"
          if [ -n "${EXISTING_ID}" ]; then
            curl -fsSL -X DELETE \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${EXISTING_ID}" \
              || true
          fi
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Content-Type: application/octet-stream" \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=louvorja-piano.flatpak" \
            --data-binary @louvorja-piano.flatpak
