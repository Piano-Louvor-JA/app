name: Snap Store Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag ou versão existente'
        required: true
permissions:
  contents: read
concurrency:
  group: snap-${{ github.event.release.tag_name || inputs.version }}
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.decision.outputs.publish }}
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Resolve exact tag
        id: tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG:-$INPUT_VERSION}"
          TAG="v${TAG#v}"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Tag inválida'; exit 1; }
          echo "value=$TAG" >> "$GITHUB_OUTPUT"
      - name: Decide publication
        id: decision
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REF: ${{ steps.tag.outputs.value }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          script="$(mktemp --suffix=.mjs)"
          gh api "repos/${GITHUB_REPOSITORY}/contents/scripts/release-publish-decision.mjs?ref=${WORKFLOW_SHA}" -H 'Accept: application/vnd.github.raw' > "$script"
          node "$script" --fetch --repo "$GITHUB_REPOSITORY" --ref "$TARGET_REF"
          rm -f "$script"
  snap:
    needs: decide
    if: needs.decide.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.decide.outputs.tag }}
      - name: Check Snap Store credentials
        id: store
        env:
          STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          if [ -n "$STORE_CREDENTIALS" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'Credenciais ausentes; pacote será preservado sem publicação na Snap Store.'
          fi

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Perfil de ambiente API (SPEC piano-api-env-guard): o Snap recompila o app
      # e vai direto para a loja, então só sai com a API de produção, sob o gate
      # do build guard (PIANO_RELEASE_AUTHORIZED + GITHUB_REF_TYPE=tag). Fora de
      # tag o perfil seria homologation (STG): falha antes de empacotar.
      - name: Resolve API build profile (release sob gate)
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "PIANO_BUILD_PROFILE=release" >> "$GITHUB_ENV"
            echo "PIANO_RELEASE_AUTHORIZED=true" >> "$GITHUB_ENV"
            echo "Perfil: release (${{ github.event_name }} em tag)"
          else
            echo "::error::Snap Store só publica build de produção. Dispare o workflow a partir da tag (Use workflow from → tag); ref atual: ${{ github.ref }}."
            exit 1
          fi

      - name: Build app (linux-unpacked)
        run: |
          npm ci
          npm run build
          npx electron-builder --linux dir --x64 --publish never

      - name: Sync snap version with tag
        env:
          RELEASE_TAG: ${{ needs.decide.outputs.tag }}
        run: |
          TAG="${RELEASE_TAG#v}"
          sed -i "s/^version:.*/version: \"$TAG\"/" snap/snapcraft.yaml
          grep '^version:' snap/snapcraft.yaml

      # Em --destructive-mode o snapcraft instala no host os build-snaps da
      # extensão gnome (gnome-46-2404-sdk, gtk-common-themes). Como usuário
      # comum (como fazia a action oficial de build) essa instalação falha; por isso roda
      # como root, num host Ubuntu 24.04 igual à base core24.
      - name: Build snap
        id: snapcraft
        run: |
          set -euo pipefail
          sudo snap install snapcraft --classic
          sudo snapcraft pack --destructive-mode
          snap_file="$(ls -1 ./*.snap | head -n 1)"
          sudo chown "$(id -u):$(id -g)" "$snap_file"
          echo "snap=$snap_file" >> "$GITHUB_OUTPUT"

      - name: Upload snap artifact
        uses: actions/upload-artifact@v7
        with:
          name: snap-package
          path: ${{ steps.snapcraft.outputs.snap }}

      - name: Attach snap to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.decide.outputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" "${{ steps.snapcraft.outputs.snap }}" --clobber

      - name: Publish to Snap Store (beta)
        if: steps.store.outputs.enabled == 'true'
        uses: snapcore/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40 # v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.snapcraft.outputs.snap }}
          release: beta
