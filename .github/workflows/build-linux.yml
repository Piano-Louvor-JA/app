# Build Linux AppImage (backup / dispatch manual).
# Em tags v*, o publisher canônico é "Release Linux" (release.yml): ele gera
# AppImage + latest-linux*.yml na mesma build. Este workflow NÃO deve usar
# --publish always em tags — senão sobe um YAML com sha de OUTRA build e o
# Release Linux sobrescreve só o AppImage → auto-update falha no checksum.
name: Build Linux

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux AppImage x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Manual/dispatch => homologation/STG (SPEC piano-api-env-guard): build
      # de teste NUNCA fala com produção, mesmo se .env local vazar env.
      - name: Resolve API build profile
        run: echo "PIANO_BUILD_PROFILE=homologation" >> "$GITHUB_ENV"

      - name: Build Vite + Electron AppImage (x64)
        run: npm run electron:build -- --linux AppImage --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fix P0 auth Google: Firebase client config no bundle.
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Zip portátil linux-unpacked
        run: |
          cd dist-electron/linux-unpacked
          zip -qr ../LouvorJA-PIANO-Linux-x64-portable.zip .
          cd ..
          sha256sum LouvorJA-PIANO-Linux-x64-portable.zip

      - name: Upload AppImage + portable + updater metadata (artifact backup)
        uses: actions/upload-artifact@v7
        with:
          name: LouvorJA-PIANO-Linux-x64
          path: |
            dist-electron/*.AppImage
            dist-electron/*.AppImage.blockmap
            dist-electron/LouvorJA-PIANO-Linux-x64-portable.zip
            dist-electron/latest*.yml
          if-no-files-found: warn
          retention-days: 30
