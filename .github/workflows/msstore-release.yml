# Microsoft Store — publica o .appx da GitHub Release via MSStore Developer CLI.
# Pré-requisitos (ver skill electron-app-store-publishing):
#   - Secrets: AZURE_AD_TENANT_ID, AZURE_AD_APPLICATION_CLIENT_ID,
#     AZURE_AD_APPLICATION_SECRET, SELLER_ID, MS_STORE_PRODUCT_ID
#   - App Entra com papel Manager no Partner Center (Gerenciamento de usuários)
#   - App já publicado/live na Store (submissões de atualização só funcionam após a primeira certificação)
# Documentação: https://learn.microsoft.com/windows/apps/publish/msstore-dev-cli/github-actions
name: MS Store Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão da release (ex: 1.29.1)'
        required: true

permissions:
  contents: read

concurrency:
  group: msstore-${{ github.event.release.tag_name || inputs.version }}
  cancel-in-progress: false

jobs:
  decide:
    runs-on: windows-latest
    outputs:
      publish: ${{ steps.decision.outputs.publish }}
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Resolve exact tag
        id: tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG:-$INPUT_VERSION}"
          TAG="v${TAG#v}"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Tag inválida'; exit 1; }
          echo "value=$TAG" >> "$GITHUB_OUTPUT"
      - name: Decide publication
        id: decision
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REF: ${{ steps.tag.outputs.value }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          script="$(mktemp --suffix=.mjs)"
          gh api "repos/${GITHUB_REPOSITORY}/contents/scripts/release-publish-decision.mjs?ref=${WORKFLOW_SHA}" -H 'Accept: application/vnd.github.raw' > "$script"
          node "$script" --fetch --repo "$GITHUB_REPOSITORY" --ref "$TARGET_REF"
          rm -f "$script"
  # O Build Windows envia o .appx e dispara este workflow enquanto a release ainda
  # é rascunho; ela só é publicada quando o Release Linux termina.
  release-ready:
    needs: decide
    if: needs.decide.outputs.publish == 'true'
    name: Wait for published release with .appx
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Wait for published release with .appx
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.decide.outputs.tag }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 140); do
            if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$TAG" \
              --jq '.assets[].name' 2>/dev/null | grep -q '\.appx$'; then
              echo "Release $TAG publicada com .appx."
              exit 0
            fi
            echo "Release $TAG ainda não publicada com .appx (tentativa $attempt)."
            sleep 30
          done
          echo "Release $TAG não foi publicada com .appx a tempo." >&2
          exit 1
  msstore:
    needs: [decide, release-ready]
    if: needs.decide.outputs.publish == 'true'
    name: Publish .appx to Partner Center
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.decide.outputs.tag }}
      - name: Check MS Store secrets
        id: store
        shell: bash
        env:
          TENANT: ${{ secrets.AZURE_AD_TENANT_ID }}
          CLIENT: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          SELLER: ${{ secrets.SELLER_ID }}
          PRODUCT: ${{ secrets.MS_STORE_PRODUCT_ID }}
        run: |
          if [ -n "$TENANT" ] && [ -n "$CLIENT" ] && [ -n "$SECRET" ] && [ -n "$SELLER" ] && [ -n "$PRODUCT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Secrets MS Store ausentes — publicação na Store pulada."
          fi

      - name: Resolve version
        if: steps.store.outputs.enabled == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.decide.outputs.tag }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          V="${RELEASE_TAG#v}"
          [ -n "$V" ] || { echo "Sem versão (tag v* ou input version obrigatório)."; exit 1; }
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Download .appx from release
        if: steps.store.outputs.enabled == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ env.VERSION }}
        run: |
          set -euo pipefail
          mkdir -p msstore
          gh release download "v${VERSION}" --pattern '*.appx' --dir msstore --clobber
          APPX="$(find msstore -name '*.appx' | head -1)"
          [ -n "$APPX" ] || { echo "Nenhum .appx na release v${VERSION}."; exit 1; }
          echo "APPX=$APPX" >> "$GITHUB_ENV"
          echo "Pacote: $APPX"

      - uses: microsoft/microsoft-store-apppublisher@15abd1c50fcc164b19cb240fb04ef3c49bf715a2 # v1.1
        if: steps.store.outputs.enabled == 'true'

      - name: Configure MSStore CLI
        if: steps.store.outputs.enabled == 'true'
        shell: bash
        env:
          TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
        run: |
          msstore reconfigure \
            --tenantId "$TENANT_ID" \
            --sellerId "$SELLER_ID" \
            --clientId "$CLIENT_ID" \
            --clientSecret "$CLIENT_SECRET"

      - name: Publish package to Store
        if: steps.store.outputs.enabled == 'true'
        shell: bash
        env:
          PRODUCT_ID: ${{ secrets.MS_STORE_PRODUCT_ID }}
        run: msstore publish "$APPX" -id "$PRODUCT_ID"
