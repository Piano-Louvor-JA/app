name: PR Quality Gate

on:
  pull_request:
    branches: [staging, main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:

concurrency:
  group: pr-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    # Nome distinto do "Quality Gate" existente em ci.yml.
    name: PR Pre-review
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      # Biome ainda não está declarado no package.json nem configurado.
      # Adicionar check aqui quando houver uma configuração local validada.
      - name: TypeScript / Vue type check
        run: npm run type-check

      - name: Unit tests
        run: npm run test

      # O script atual também executa testes, type-check e build internamente.
      # Seu baseline é gerado no checkout atual; a comparação com a branch
      # base continua sendo responsabilidade do workflow ci.yml existente.
      - name: Regression tests
        run: npm run test:regression

      - name: Production build
        run: npm run build-only
