# AI Review — pr-agent da Qodo (MIT, self-hosted via GitHub Action)
# Primeira passada de review em TODO PR: resumo do diff, riscos, line comments.
# Usa o LLM que a org já paga (z.ai) via secret AI_REVIEW_API_KEY.
# O humano (Ezequias) é a SEGUNDA camada — chega com o trabalho de leitura reduzido.
name: AI Review

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: AI Review (pr-agent)
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: Codium-ai/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.AI_REVIEW_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.AI_REVIEW_BASE_URL || 'https://api.z.ai/api/coding/paas/v4' }}
          CONFIG.REVIEW_MAX_FILES: '40'
          PR_REVIEWER.EXTRA_INSTRUCTIONS: >-
            Projeto PIANO (hinos ao piano, Electron+Vue). Foque em:
            (1) offline-first — dado do usuário nunca pode se perder com reload/background/update;
            (2) erros engolidos (catch vazio, promise sem reject tratado);
            (3) segredos/PII no diff;
            (4) breaking change de API ou de store compartilhada.
            Responda em PT-BR. Seja específico: arquivo, linha, por quê.
          PR_DESCRIPTION.PUBLISH: 'true'
          PR_REVIEWER.REQUIRE_TESTS_REVIEW: 'true'
