# Build Windows — instalador NSIS + ZIP portátil (x64).
# Portable: pasta win-unpacked zipada — descompacta e roda, sem instalar.
# (Electron 44+ não publica mais win32-ia32 — ver docs/DEPLOY.md)
# Roda manualmente (workflow_dispatch) ou em push de tags v*
name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows NSIS + Portable x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vite + Electron NSIS (x64) + portable zip + publish
        shell: bash
        run: |
          set -euo pipefail
          npm run electron:build -- --win --x64 --publish always
          # Zip portátil a partir do win-unpacked (mesma build do instalador)
          cd dist-electron/win-unpacked
          7z a -tzip ../LouvorJA-PIANO-Windows-x64-portable.zip . > /dev/null
          cd ..
          sha256sum LouvorJA-PIANO-Windows-x64-portable.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SHA256SUMS and upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd dist-electron
          find . -maxdepth 1 -type f -name '*.exe' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS-win-x64
          sha256sum LouvorJA-PIANO-Windows-x64-portable.zip >> SHA256SUMS-win-x64
          cat SHA256SUMS-win-x64
          if [ -n "$TAG" ]; then
            gh release upload "$TAG" SHA256SUMS-win-x64 "LouvorJA-PIANO-Windows-x64-portable.zip" --clobber
          fi

      - name: Upload x64 installer + portable (artifact backup)
        uses: actions/upload-artifact@v4
        with:
          name: LouvorJA-PIANO-Windows-x64
          path: |
            dist-electron/*Setup*.exe
            dist-electron/*.exe
            dist-electron/LouvorJA-PIANO-Windows-x64-portable.zip
            dist-electron/SHA256SUMS-win-x64
          if-no-files-found: warn
          retention-days: 30
