# Auto-merge condicional — aprovações que fluem sem humano.
# PR com label "auto-merge" + todos os gates verdes + sem changes requested = merge em staging.
# PR com label "human-review" SEMPRE exige approve do reviewer designado (CODEOWNERS/Ezequias).
name: Auto Merge

on:
  pull_request_target:
    types: [labeled, unlabeled]
  check_suite:
    types: [completed]
  workflow_run:
    workflows: ["CI", "AI Review"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.event.pull_request.number || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  auto-merge:
    name: Auto-merge (label-gated)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_run' || github.event_name == 'check_suite' || github.event_name == 'pull_request_target'
    steps:
      - name: Avaliar elegibilidade e mergear
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request || context.payload.workflow_run?.pull_requests?.[0];
            if (!pr) { core.info('Sem PR no contexto — skip'); return; }
            const full = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number
            });
            const { data: pull } = full;
            if (pull.state !== 'open' || pull.draft) { core.info('Draft/fechada — skip'); return; }
            if (pull.base.ref !== 'staging') { core.info(`Base ${pull.base.ref} != staging — auto-merge só em staging`); return; }

            const labels = pull.labels.map(l => l.name);
            if (!labels.includes('auto-merge')) { core.info('Sem label auto-merge — skip'); return; }
            if (labels.includes('human-review')) { core.info('Label human-review presente — exige humano'); return; }

            // todos os checks concluídos e verdes?
            const checks = await github.rest.checks.listForRef({
              owner: context.repo.owner, repo: context.repo.repo, ref: pull.head.sha
            });
            const runs = checks.data.check_runs;
            if (runs.some(c => c.status !== 'completed')) { core.info('Checks ainda rodando — aguarda'); return; }
            const failed = runs.filter(c => c.conclusion === 'failure');
            if (failed.length) {
              core.info(`Checks falhando: ${failed.map(f=>f.name).join(', ')} — não mergea`);
              return;
            }

            // reviews: algum changes requested?
            const reviews = await github.rest.pulls.listReviews({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number
            });
            const latest = {};
            for (const r of reviews.data) latest[r.user.login] = r.state;
            if (Object.values(latest).includes('CHANGES_REQUESTED')) {
              core.info('Changes requested — não mergea'); return;
            }

            // merge!
            try {
              await github.rest.pulls.merge({
                owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number,
                merge_method: 'squash', commit_title: `merge: ${pull.title} (#${pr.number})`
              });
              core.info(`✓ PR #${pr.number} auto-mergeada em staging`);
            } catch (e) {
              core.warning(`Merge falhou: ${e.message}`);
            }
