<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <title>LouvorJA - PIANO</title>
    <link rel="icon" href="./ico/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="./favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="./ico/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
      // Projeção (#/popup): sem splash. O preload cobre o começo da música.
      ;(function () {
        var href = String(location.href || '')
        var path = String(location.pathname || '')
        var isProjection =
          href.indexOf('#/popup') !== -1 ||
          path.indexOf('/popup') !== -1 ||
          href.indexOf('/popup?') !== -1
        if (isProjection) document.documentElement.classList.add('projection-boot')
      })()
    </script>
    <style>
      :root {
        --boot-bg: #12121c;
        --boot-accent: #fcce02;
        --boot-ring: rgba(252, 206, 2, 0.15);
      }
      html, body {
        height: 100%;
        margin: 0;
        background: var(--boot-bg);
        color: #f2f2f5;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: var(--boot-bg);
        user-select: none;
        -webkit-user-select: none;
      }
      #boot-splash[hidden],
      html.projection-boot #boot-splash {
        display: none !important;
      }
      html.projection-boot,
      html.projection-boot body {
        background: #000;
      }
      #boot-splash .boot-logo {
        width: 96px;
        height: 96px;
        animation: boot-pulse 1.8s ease-in-out infinite;
      }
      #boot-splash .boot-title {
        margin: 0;
        color: var(--boot-accent);
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.5px;
      }
      #boot-splash .boot-message {
        margin: 0;
        max-width: 18rem;
        color: rgba(242, 242, 245, 0.75);
        font-size: 0.875rem;
        font-weight: 400;
        line-height: 1.45;
        text-align: center;
      }
      #boot-splash .boot-spinner {
        width: 28px;
        height: 28px;
        border: 3px solid var(--boot-ring);
        border-top-color: var(--boot-accent);
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes boot-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.85; transform: scale(0.96); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .boot-logo,
        #boot-splash .boot-spinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-live="polite" aria-busy="true" aria-label="LouvorJA - PIANO">
      <img class="boot-logo" src="./ico/favicon.svg" width="96" height="96" alt="">
      <p class="boot-title">LouvorJA - PIANO</p>
      <p id="boot-message" class="boot-message">Estamos configurando e preparando tudo para você.</p>
      <div class="boot-spinner" aria-hidden="true"></div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
