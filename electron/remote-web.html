<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer">
<title>Louange — Controle do culto</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101214;color:#f4f1eb}*{box-sizing:border-box}body{margin:0}main{max-width:48rem;margin:auto;padding:1.25rem}header{display:flex;align-items:center;justify-content:space-between;gap:1rem}h1{font-size:1.5rem;margin:.5rem 0}h2{font-size:1.1rem;margin:0 0 1rem}p{color:#bfc3c8;line-height:1.5}section{background:#1b1e22;border:1px solid #34383d;border-radius:1rem;padding:1.1rem;margin-top:1rem}label{display:grid;gap:.5rem;font-size:.85rem}input,select,button{font:inherit;border-radius:.65rem;border:1px solid #484d54;padding:.8rem;background:#252a30;color:inherit;min-height:2.8rem}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}.primary{background:#f0a16c;border-color:transparent;color:#23170f}#status{padding:.75rem 0;margin:0;min-height:3rem}#status[data-connected=true]{color:#82d4a4}.row{display:flex;gap:.65rem;flex-wrap:wrap;align-items:end}.row label{flex:1}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:.65rem}#items{list-style:none;padding:0;margin:0;display:grid;gap:.65rem}#items button{width:100%;text-align:left;display:flex;align-items:center;gap:.75rem}#items button[aria-current=true]{border-color:#f0a16c;background:#3a2c22}#items small{display:block;color:#bfc3c8;margin-top:.3rem}.item-done{text-decoration:line-through;opacity:.65}.group{color:#f0a16c;font-weight:700;padding:.5rem 0}#title{font-weight:600;color:#f4f1eb}.volume-field{margin-top:1rem}input[type=range]{width:100%;padding:0}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #f0a16c;outline-offset:3px}footer{margin-top:1.5rem;color:#bfc3c8;font-size:.8rem}@media(max-width:380px){main{padding:.75rem}.actions{grid-template-columns:1fr 1fr}}
</style>
</head>
<body><main>
<header><h1 data-i18n="title">Controle do culto</h1><select id="language" aria-label="Idioma"><option value="pt-BR">Português</option><option value="fr">Français</option><option value="es">Español</option></select></header>
<p data-i18n="hint">Conecte o celular à mesma rede do computador e use o código exibido em Configurações → Controle remoto.</p>
<section><form id="connect-form" class="row"><label><span data-i18n="code">Código de pareamento</span><input id="token" type="password" autocomplete="off" required maxlength="64"></label><button id="connect" class="primary" data-i18n="connect">Conectar</button><button id="disconnect" type="button" hidden data-i18n="disconnect">Desconectar</button></form><p id="status" role="status" aria-live="polite"></p></section>
<section><h2 data-i18n="player">Reprodução</h2><p id="title">—</p><div class="actions"><button data-action="liturgy.previous" data-i18n="previous" disabled>Anterior</button><button data-action="player.toggle" data-i18n="playPause" disabled>Reproduzir / pausar</button><button data-action="liturgy.next" data-i18n="next" disabled>Próximo</button><button data-action="player.stop" data-i18n="stop" disabled>Parar</button><button data-action="liturgy.toggleDone" data-i18n="done" disabled>Concluir momento</button><button data-action="liturgy.state" data-i18n="refresh" disabled>Atualizar</button></div><label class="volume-field"><span data-i18n="volume">Volume</span><input id="volume" type="range" min="0" max="100" value="80" disabled></label></section>
<section><h2 data-i18n="plan">Programa do culto</h2><p id="empty" data-i18n="waiting">Aguardando conexão…</p><ol id="items"></ol></section>
<section><h2 data-i18n="tools">Projeção e tempo</h2><div class="actions"><button data-action="bible.clearSelection" data-i18n="clearBible" disabled>Limpar Bíblia</button><button data-action="timer.start" data-i18n="timerStart" disabled>Iniciar cronômetro</button><button data-action="timer.pause" data-i18n="timerPause" disabled>Pausar cronômetro</button><button data-action="countdown.start" data-i18n="countdownStart" disabled>Iniciar contagem</button><button data-action="countdown.pause" data-i18n="countdownPause" disabled>Pausar contagem</button></div></section>
<footer data-i18n="footer">O computador precisa permanecer aberto. Use o programa preparado pelo operador.</footer>
</main>
<script src="/control.js"></script>
</body></html>
