<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Controles de documento</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        color: #f1f5f9;
        font: 600 12px/1.2 system-ui, sans-serif;
        user-select: none;
        overflow: hidden;
      }
      .shell { position: relative; width: 100%; height: 100%; }
      .bar {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 0.65rem;
        align-items: center;
        height: 100%;
        padding: 0 0.75rem;
        background: rgba(12, 12, 14, 0.92);
      }
      .shell.is-panel-open .bar {
        position: absolute;
        inset: auto 0 0;
        height: 48px;
      }
      .panel {
        display: none;
        position: absolute;
        left: 0.5rem;
        bottom: 3.25rem;
        width: min(23rem, calc(100% - 1rem));
        max-height: calc(100% - 3.75rem);
        padding: 0.85rem;
        border: 1px solid rgba(232, 237, 245, 0.12);
        border-radius: 0.65rem;
        background: rgba(26, 30, 40, 0.97);
        box-shadow: 0 14px 36px rgba(0, 0, 0, 0.45);
        overflow: auto;
      }
      .shell.is-panel-open .panel { display: block; }
      .panel__header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
      }
      .panel__title { margin: 0; font-size: 1.08rem; }
      .panel__identify {
        width: auto;
        height: auto;
        padding: 0.35rem 0.55rem;
        border-radius: 0.4rem;
        background: rgba(251, 146, 60, 0.14);
        color: #fb923c;
        font-size: 0.8rem;
      }
      .panel__hint, .panel__empty {
        margin: 0.55rem 0 0.7rem;
        font-weight: 500;
        opacity: 0.65;
      }
      .panel__list {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .panel__option {
        display: flex;
        align-items: flex-start;
        gap: 0.55rem;
        padding: 0.65rem 0.7rem;
        border: 1px solid rgba(232, 237, 245, 0.1);
        border-radius: 0.45rem;
        background: rgba(232, 237, 245, 0.04);
        cursor: pointer;
      }
      .panel__option.is-active {
        border-color: rgba(251, 146, 60, 0.55);
        background: rgba(251, 146, 60, 0.12);
      }
      .panel__option input { margin-top: 0.15rem; accent-color: #fb923c; }
      .panel__option-body {
        display: flex;
        min-width: 0;
        flex-direction: column;
        gap: 0.1rem;
      }
      .panel__option-name { font-size: 0.95rem; }
      .panel__option-meta {
        font-size: 0.75rem;
        font-weight: 500;
        opacity: 0.55;
      }
      .transport {
        display: inline-flex;
        align-items: center;
        gap: 0.2rem;
      }
      .meta {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
      }
      .counter {
        min-width: 4.5rem;
        text-align: center;
        opacity: 0.9;
        font-variant-numeric: tabular-nums;
      }
      .monitor-wrap { position: relative; display: inline-flex; }
      .monitor-badge {
        position: absolute;
        top: -0.15rem;
        right: -0.15rem;
        min-width: 0.9rem;
        height: 0.9rem;
        padding: 0 0.2rem;
        border-radius: 999px;
        background: #fb923c;
        color: #111827;
        font-size: 0.62rem;
        line-height: 0.9rem;
        text-align: center;
        pointer-events: none;
      }
      .monitor-badge.is-empty { display: none; }
      button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: inherit;
        width: 2.35rem;
        height: 2.35rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }
      button:hover:not(:disabled) { background: rgba(255, 255, 255, 0.1); }
      button:disabled { opacity: 0.35; cursor: not-allowed; }
      button:disabled { opacity: 0.35; cursor: default; }
      button.is-active {
        background: rgba(234, 88, 12, 0.28);
        color: #fb923c;
      }
      button svg {
        width: 1.45rem;
        height: 1.45rem;
        fill: currentColor;
      }
      /* Zoom da página: também pela roda do mouse e arrastando no popup. */
      .zoom {
        display: inline-flex;
        align-items: center;
        gap: 0.2rem;
        margin-left: 0.6rem;
        padding-left: 0.6rem;
        border-left: 1px solid rgba(255, 255, 255, 0.14);
      }
      .zoom__value {
        min-width: 3.2rem;
        height: 1.9rem;
        padding: 0 0.3rem;
        font-size: 0.78rem;
        font-variant-numeric: tabular-nums;
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div id="shell" class="shell">
      <div id="monitorPanel" class="panel" role="dialog" aria-label="Selecionar telas">
        <div class="panel__header">
          <p class="panel__title">Conexões Cabeadas</p>
          <button id="identifyMonitors" class="panel__identify" type="button">Detectar telas</button>
        </div>
        <p class="panel__hint">Marque os monitores onde o recurso deve ser projetado.</p>
        <div id="monitorList"><p class="panel__empty">Nenhum monitor estendido encontrado.</p></div>
        <div id="tvList"></div>
        <div id="palcoTvList"></div>
      </div>

      <div class="bar">
        <div class="transport">
          <button id="prev" type="button" title="Página anterior" aria-label="Página anterior">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
          </button>
          <button id="next" type="button" title="Próxima página" aria-label="Próxima página">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6 8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
          </button>
          <button id="project" type="button" title="Projetar nas telas" aria-label="Projetar nas telas" aria-pressed="false">
            <svg id="projectIcon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 17.59 15.59 7H9V5h10v10h-2V8.41L6.41 19 5 17.59z" />
            </svg>
          </button>
          <span class="monitor-wrap">
            <button id="monitorSelect" type="button" title="Selecionar telas" aria-label="Selecionar telas" aria-expanded="false" aria-haspopup="dialog">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M21 16H3V4h18v12zm-10 2h2v2h5v2H6v-2h5v-2zM5 6v8h14V6H5z" />
              </svg>
            </button>
            <span id="monitorBadge" class="monitor-badge is-empty">0</span>
          </span>
          <div class="zoom" role="group" aria-label="Zoom da página">
            <button id="zoomOut" type="button" title="Diminuir zoom" aria-label="Diminuir zoom" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14M7 9h5v1H7z"/></svg>
            </button>
            <button id="zoomReset" class="zoom__value" type="button" title="Página inteira (duplo clique na página também)" aria-label="Voltar à página inteira">100%</button>
            <button id="zoomIn" type="button" title="Aumentar zoom (ou roda do mouse na página)" aria-label="Aumentar zoom">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14m.5-7H9v2H7v1h2v2h1v-2h2V9h-2z"/></svg>
            </button>
          </div>
        </div>
        <div></div>
        <div class="meta">
          <span id="counter" class="counter">1 / 1</span>
        </div>
      </div>
    </div>
    <script src="palco-zoom-sender.js"></script>
    <script src="screen-targets.js"></script>
    <script>
      ;(function () {
        var prevBtn = document.getElementById('prev')
        var nextBtn = document.getElementById('next')
        var projectBtn = document.getElementById('project')
        var projectIcon = document.getElementById('projectIcon')
        var shell = document.getElementById('shell')
        var monitorBtn = document.getElementById('monitorSelect')
        var monitorBadge = document.getElementById('monitorBadge')
        var monitorList = document.getElementById('monitorList')
        var identifyBtn = document.getElementById('identifyMonitors')
        var counterEl = document.getElementById('counter')
        var panelOpen = false
        var selectedIds = []
        var displays = []
        var ARROW_PATH = 'M5 17.59 15.59 7H9V5h10v10h-2V8.41L6.41 19 5 17.59z'
        var STOP_PATH = 'M6 6h12v12H6z'

        function setProjectingUi(projecting) {
          projecting = projecting || networkActive
          var canProject = selectedIds.length > 0 || (tvSlots || []).some(function (slot) { return slot.clients > 0 && tvChecked[slot.id] !== false })
          projectBtn.disabled = !projecting && !canProject
          if (projecting) {
            projectBtn.classList.add('is-active')
            projectBtn.title = 'Retirar projeção'
            projectBtn.setAttribute('aria-pressed', 'true')
            projectIcon.innerHTML = '<path d="' + STOP_PATH + '"/>'
          } else {
            projectBtn.classList.remove('is-active')
            projectBtn.title = canProject
              ? 'Projetar nas telas'
              : 'Nenhuma tela disponível para projeção'
            projectBtn.setAttribute('aria-pressed', 'false')
            projectIcon.innerHTML = '<path d="' + ARROW_PATH + '"/>'
          }
        }

        function setCounter(index, total) {
          var safeTotal = Math.max(0, Number(total) || 0)
          var safeIndex = safeTotal > 0 ? Math.min(safeTotal, (Number(index) || 0) + 1) : 0
          counterEl.textContent = safeIndex + ' / ' + safeTotal
          prevBtn.disabled = safeTotal <= 1
          nextBtn.disabled = safeTotal <= 1
        }

        // Mesmo número do app: monitores + conexões remotas marcadas
        function updateMonitorBadge() {
          var count = selectedIds.length + (window.PianoScreenTargets ? window.PianoScreenTargets.remoteCount(tvSlots, tvChecked) : 0)
          monitorBadge.textContent = String(count)
          monitorBadge.classList.toggle('is-empty', count === 0)
        }

        function renderMonitorList() {
          var extended = displays.filter(function (d) { return !d.isPrimary })
          if (!extended.length) {
            monitorList.innerHTML = '<p class="panel__empty">Nenhum monitor estendido encontrado.</p>'
            return
          }
          var html = '<ul class="panel__list">'
          for (var i = 0; i < extended.length; i++) {
            var display = extended[i]
            var checked = selectedIds.indexOf(display.id) >= 0
            html +=
              '<li><label class="panel__option' +
              (checked ? ' is-active' : '') +
              '"><input type="checkbox" data-id="' +
              display.id +
              '"' +
              (checked ? ' checked' : '') +
              '><span class="panel__option-body"><span class="panel__option-name">' +
              display.label +
              (window.PianoScreenTargets ? window.PianoScreenTargets.returnTagHtml(display.id) : '') +
              '</span><span class="panel__option-meta">' +
              display.resolution +
              '</span></span></label></li>'
          }
          monitorList.innerHTML = html + '</ul>'
          var inputs = monitorList.querySelectorAll('input[type="checkbox"]')
          for (var j = 0; j < inputs.length; j++) {
            inputs[j].addEventListener('change', onToggleMonitor)
          }
        }

        var networkActive = false, syncGeneration = 0, sentTvIds = new Set()
        var tvSlots = []
        var tvChecked = {}
        var tvList = document.getElementById('tvList')
        var palcoTvList = document.getElementById('palcoTvList')

        function renderTvs() {
          var targets = window.PianoScreenTargets
          if (!targets) return
          targets.renderRemotes(tvList, tvSlots, tvChecked, async function (slotId, checked) {
            updateMonitorBadge()
            var state = await window.louvorja.projection.getPlaybackState()
            if (state && state.projecting) networkActive = true
            if (networkActive) {
              if (checked) syncPptWithRetry(0)
              else { sentTvIds.delete(slotId); await window.louvorja.palco.send({ v: 2, type: 'idle' }, slotId) }
            }
            await refresh()
          })
          updateMonitorBadge()
        }
        async function loadTvs() {
          if (!window.louvorja || !window.louvorja.palco) return
          tvSlots = await window.louvorja.palco.slots().catch(function () { return [] })
          // a marca das conexões vem do app (mesma do seletor de telas dele)
          if (window.PianoScreenTargets) {
            await window.PianoScreenTargets.load()
            window.PianoScreenTargets.applyRemoteSelection(tvChecked)
            if (panelOpen) void window.PianoScreenTargets.renderTvs(palcoTvList)
          }
          renderTvs(); await refresh()
        }

        var syncBusy = false, pendingSync = false, lastSyncedIndex = -1
        // Zoom nas TVs/navegador: a página inteira vai uma vez; o zoom vai em
        // mensagens leves na hora (TVs antigas recebem o recorte ao parar).
        var palcoZoom = window.PianoPalcoZoom ? window.PianoPalcoZoom.create({
          send: function (message, slotId) { return window.louvorja.palco.send(message, slotId) },
          targets: function () { return Array.from(sentTvIds).filter(function (id) { return tvChecked[id] !== false }) },
          captureLegacy: async function () {
            var png = await window.louvorja.projection.captureSourceFrame()
            return png ? 'data:image/png;base64,' + png : null
          },
          active: function () { return networkActive },
        }) : null
        async function syncPptToTvs() {
          if (!networkActive) return false
          var generation = syncGeneration
          if (!window.louvorja || !window.louvorja.palco || !window.louvorja.projection || !window.louvorja.projection.captureSourceFrame) return false
          if (syncBusy) { pendingSync = true; return false }
          syncBusy = true
          try {
            var slide = window.louvorja.projection.getPptSlideState ? await window.louvorja.projection.getPptSlideState() : null
            var slideView = slide && slide.view ? slide.view : { zoom: 1, x: 0, y: 0 }
            // página inteira: as TVs novas aplicam o zoom (view) sozinhas
            var png = await window.louvorja.projection.captureSourceFrame({ full: true })
            if (!png || !networkActive || generation !== syncGeneration) return false
            tvSlots = await window.louvorja.palco.slots().catch(function () { return [] })
            renderTvs()
            var served = false
            for (var i = 0; i < tvSlots.length; i++) {
              var slot = tvSlots[i]
              if (slot.clients > 0 && tvChecked[slot.id] !== false) {
                // data:image is the established full-page protocol, including receivers
                // opened before frameSlide support. HTTP backgrounds default to cover.
                var url = 'data:image/png;base64,' + png
                if (url && networkActive && generation === syncGeneration && tvChecked[slot.id] !== false) {
                  await window.louvorja.palco.send({ v: 2, type: 'projection', frameSlide: true, background: url, text: '', footerRef: '', view: { zoom: slideView.zoom, x: slideView.x, y: slideView.y } }, slot.id)
                  sentTvIds.add(slot.id)
                  served = true
                }
              }
            }
            if (served && slide) lastSyncedIndex = slide.index
            if (served && palcoZoom) palcoZoom.frameSent(slideView)
            return served
          } finally {
            syncBusy = false
            if (pendingSync && networkActive) { pendingSync = false; syncPptWithRetry(0) }
          }
        }

        // Canvas PDF.js pode demorar além dos syncs do boot (PDF grande,
        // LibreOffice). Retenta com backoff até a captura sair — sem isso a
        // TV ficava com o frame cinza de loading pra sempre (13/10).
        function syncPptWithRetry(attempt) {
          if (!networkActive) return
          var generation = syncGeneration
          void syncPptToTvs().then(function (served) {
            if (served || attempt >= 8 || !networkActive || generation !== syncGeneration) return
            setTimeout(function () { if (networkActive && generation === syncGeneration) syncPptWithRetry(attempt + 1) }, Math.min(500 * Math.pow(1.6, attempt), 5000))
          })
        }

        async function loadMonitors() {
          if (!window.louvorja) return
          var list =
            window.louvorja.displays && window.louvorja.displays.list
              ? (await window.louvorja.displays.list()) || []
              : []
          displays = list.map(function (display, index) {
            return {
              id: display.id,
              label: 'Monitor ' + (index + 1),
              resolution: display.bounds
                ? display.bounds.width + ' × ' + display.bounds.height
                : '',
              isPrimary: Boolean(display.isPrimary),
            }
          })
          if (window.louvorja.projection && window.louvorja.projection.getVideoTargetMonitors) {
            selectedIds = (await window.louvorja.projection.getVideoTargetMonitors()) || []
          }
          updateMonitorBadge()
          renderMonitorList()
          await refresh()
        }

        async function setPanelOpen(open) {
          panelOpen = Boolean(open)
          shell.classList.toggle('is-panel-open', panelOpen)
          monitorBtn.setAttribute('aria-expanded', panelOpen ? 'true' : 'false')
          if (window.louvorja && window.louvorja.projection && window.louvorja.projection.setSiteControlPanelOpen) {
            await window.louvorja.projection.setSiteControlPanelOpen(panelOpen)
          }
          if (panelOpen) { await loadTvs(); await loadMonitors() }
        }

        async function onToggleMonitor(event) {
          var input = event.target
          var id = Number(input.getAttribute('data-id'))
          if (!Number.isFinite(id)) return
          if (input.checked) {
            if (selectedIds.indexOf(id) < 0) selectedIds.push(id)
          } else {
            selectedIds = selectedIds.filter(function (item) { return item !== id })
          }
          updateMonitorBadge()
          renderMonitorList()
          if (window.louvorja && window.louvorja.projection && window.louvorja.projection.setVideoTargetMonitors) {
            await window.louvorja.projection.setVideoTargetMonitors(selectedIds.slice())
            if (networkActive && selectedIds.length > 0) {
              var state = await window.louvorja.projection.getPlaybackState()
              if (state && !state.projecting) await window.louvorja.projection.toggleVideoScreens()
            }
          }
          await refresh()
        }

        async function refresh() {
          if (!window.louvorja || !window.louvorja.projection) return
          var state = window.louvorja.projection.getPptSlideState
            ? await window.louvorja.projection.getPptSlideState()
            : null
          if (state) {
            setCounter(state.index, state.total)
            // zoom feito pela roda do mouse no popup: a barra acompanha
            if (state.view && Date.now() > zoomLocalUntil) renderZoom(state.view)
            if (networkActive && state.index !== lastSyncedIndex && !syncBusy) syncPptWithRetry(0)
          }
          if (state && typeof state.projecting === 'boolean') {
            setProjectingUi(Boolean(state.projecting))
            return
          }
          var playback = window.louvorja.projection.getPlaybackState
            ? await window.louvorja.projection.getPlaybackState()
            : null
          if (playback) setProjectingUi(Boolean(playback.projecting))
        }

        prevBtn.addEventListener('click', async function () {
          if (window.louvorja && window.louvorja.projection && window.louvorja.projection.remotePptPrev) {
            await window.louvorja.projection.remotePptPrev()
            await syncPptToTvs()
            await refresh()
          }
        })
        nextBtn.addEventListener('click', async function () {
          if (window.louvorja && window.louvorja.projection && window.louvorja.projection.remotePptNext) {
            await window.louvorja.projection.remotePptNext()
            await syncPptToTvs()
            await refresh()
          }
        })

        async function stepPage(direction) {
          if (!window.louvorja || !window.louvorja.projection) return
          if (direction === 'next' && window.louvorja.projection.remotePptNext) {
            await window.louvorja.projection.remotePptNext()
          } else if (direction === 'prev' && window.louvorja.projection.remotePptPrev) {
            await window.louvorja.projection.remotePptPrev()
          } else {
            return
          }
          await syncPptToTvs()
          await refresh()
        }

        // Expõe para o main (setas no canvas do PDF) atualizar TVs/contador.
        window.__pdfBarAfterPageChange = async function () {
          await syncPptToTvs()
          await refresh()
        }

        window.addEventListener('keydown', function (event) {
          if (event.defaultPrevented) return
          if (event.altKey || event.ctrlKey || event.metaKey) return
          if (event.key === 'ArrowRight' || event.key === 'ArrowDown' || event.key === 'Right' || event.key === 'Down') {
            event.preventDefault()
            void stepPage('next')
            return
          }
          if (event.key === 'ArrowLeft' || event.key === 'ArrowUp' || event.key === 'Left' || event.key === 'Up') {
            event.preventDefault()
            void stepPage('prev')
          }
        })

        projectBtn.addEventListener('click', async function () {
          if (projectBtn.disabled) return
          if (window.louvorja && window.louvorja.projection && window.louvorja.projection.toggleVideoScreens) {
            var state = await window.louvorja.projection.getPlaybackState()
            var stopping = Boolean((state && state.projecting) || networkActive)
            if ((stopping && state && state.projecting) || (!stopping && selectedIds.length > 0)) await window.louvorja.projection.toggleVideoScreens()
            networkActive = !stopping; syncGeneration++; lastSyncedIndex = -1
            if (stopping && palcoZoom) palcoZoom.stop()
            if (stopping) {
              await Promise.all(Array.from(sentTvIds).map(function (id) { return window.louvorja.palco.send({ v: 2, type: 'idle' }, id) }))
              sentTvIds.clear()
            } else { await loadTvs(); syncPptWithRetry(0) }
            await refresh()
          }
        })
        if (window.PianoScreenTargets) {
          window.PianoScreenTargets.closeOnOutside({
            panel: document.getElementById('monitorPanel'),
            trigger: monitorBtn,
            close: function () { return setPanelOpen(false) },
          })
        }
        monitorBtn.addEventListener('click', function () {
          void setPanelOpen(!panelOpen)
        })
        identifyBtn.addEventListener('click', async function () {
          if (window.louvorja && window.louvorja.displays && window.louvorja.displays.identify) {
            await window.louvorja.displays.identify()
          }
        })

        void loadMonitors()
        // PDF.js renderiza de forma assíncrona; primeira captura pode pegar
        // canvas vazio/loading. Retry com backoff cobre PDF grande (LibreOffice)
        // e re-sincroniza quando a TV conecta depois do boot (13/10).
        // ── Zoom da página (botões); a roda do mouse e o arrastar ficam no popup ──
        var ZOOM_MIN = 1, ZOOM_MAX = 5, ZOOM_STEP = 1.25
        var ZOOM_ANIM_MS = 180 // botões: o passo anima em vez de saltar
        var zoomView = { zoom: 1, x: 0, y: 0 }
        var zoomLocalUntil = 0
        var zoomOutBtn = document.getElementById('zoomOut')
        var zoomInBtn = document.getElementById('zoomIn')
        var zoomResetBtn = document.getElementById('zoomReset')

        function renderZoom(view) {
          var z = Number(view && view.zoom)
          zoomView = { zoom: Number.isFinite(z) ? z : 1, x: Number(view && view.x) || 0, y: Number(view && view.y) || 0 }
          zoomResetBtn.textContent = Math.round(zoomView.zoom * 100) + '%'
          zoomOutBtn.disabled = zoomView.zoom <= ZOOM_MIN + 0.001
          zoomInBtn.disabled = zoomView.zoom >= ZOOM_MAX - 0.001
          zoomResetBtn.disabled = zoomView.zoom <= ZOOM_MIN + 0.001 && !zoomView.x && !zoomView.y
        }

        async function applyZoom(next) {
          if (!window.louvorja || !window.louvorja.projection || !window.louvorja.projection.setImageView) return
          zoomLocalUntil = Date.now() + 800
          renderZoom(next)
          var result = await window.louvorja.projection.setImageView(next)
          if (result && typeof result.zoom === 'number') renderZoom(result)
        }

        function zoomBy(factor) {
          var target = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, zoomView.zoom * factor))
          var ratio = target / zoomView.zoom
          void applyZoom({ zoom: target, x: zoomView.x * ratio, y: zoomView.y * ratio, anim: ZOOM_ANIM_MS })
        }

        zoomInBtn.addEventListener('click', function () { zoomBy(ZOOM_STEP) })
        zoomOutBtn.addEventListener('click', function () { zoomBy(1 / ZOOM_STEP) })
        zoomResetBtn.addEventListener('click', function () { void applyZoom({ zoom: 1, x: 0, y: 0, anim: ZOOM_ANIM_MS }) })
        renderZoom(zoomView)

        // Zoom novo (mouse no popup ou botões): barra e TVs acompanham na hora.
        if (window.louvorja && window.louvorja.projection && window.louvorja.projection.onImageView) {
          window.louvorja.projection.onImageView(function (view) {
            if (!view) return
            if (Date.now() > zoomLocalUntil) renderZoom(view)
            if (palcoZoom) palcoZoom.onView(view)
          })
        }

        void loadTvs()
        if (window.louvorja && window.louvorja.palco && window.louvorja.palco.onReceiverConnected) {
          window.louvorja.palco.onReceiverConnected(function () { void loadTvs(); if (networkActive) syncPptWithRetry(0) })
        }
        void refresh()
        setInterval(function () { void refresh() }, 500)
      })()
    </script>
    <script src="../palco/network-mirror.js"></script>
    <script src="independent-panel.js"></script>
    <script>
      window.PianoIndependentPanel && window.PianoIndependentPanel.mount()
    </script>
  </body>
</html>
