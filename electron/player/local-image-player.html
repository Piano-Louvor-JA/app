<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Imagens — LouvorJA - PIANO</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #stage {
        position: relative;
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        background: #000;
      }
      /* Preso à área da tela: numa linha de grid "auto" a altura 100% virava a
         altura natural da foto e imagem em pé saía cortada embaixo. Assim o
         contain sempre mostra a imagem inteira, em pé ou deitada. */
      #frame {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: center;
        background: #000;
        transform-origin: center center;
        will-change: transform;
        user-select: none;
        -webkit-user-drag: none;
      }
      body.is-zoomed #stage { cursor: grab; }
      body.is-panning #stage { cursor: grabbing; }
      #error {
        display: none;
        color: #f8fafc;
        font: 500 0.95rem/1.4 system-ui, sans-serif;
        text-align: center;
        padding: 1rem;
      }
      #error.is-visible { display: block; }
    </style>
  </head>
  <body>
    <div id="stage">
      <img id="frame" alt="" />
      <p id="error">Não foi possível carregar as imagens.</p>
    </div>
    <script src="zoom-pan.js"></script>
    <script src="screen-transitions.js"></script>
    <script>
      ;(() => {
        const params = new URLSearchParams(window.location.search)
        const raw = params.get('srcs') || '[]'
        const LOCAL_APP_PREFIX = 'local://app/'
        function isLocalAppUrl(value) {
          try {
            const url = new URL(value)
            return url.protocol === 'local:' && url.host === 'app' && value.startsWith(LOCAL_APP_PREFIX)
          } catch {
            return false
          }
        }
        /** Endereço montado sempre a partir do prefixo fixo do app. */
        function localAppSrc(value) {
          return LOCAL_APP_PREFIX + value.slice(LOCAL_APP_PREFIX.length)
        }
        let sources = []
        try {
          const parsed = JSON.parse(raw)
          // Só arquivos servidos pelo próprio app (local://app/...): qualquer
          // outro endereço vindo da URL é ignorado (sem página externa nem script).
          sources = Array.isArray(parsed)
            ? parsed.map((entry) => String(entry)).filter(isLocalAppUrl)
            : []
        } catch {
          sources = []
        }

        const stage = document.getElementById('stage')
        const frame = document.getElementById('frame')
        const error = document.getElementById('error')
        let index = -1

        // Zoom pela roda do mouse, arrastar e duplo clique: zoom-pan.js (compartilhado com o PDF)
        const zoom = window.PianoZoomPan.create({
          stage,
          target: frame,
          enabled: () => sources.length > 0,
        })
        window.addEventListener('resize', () => zoom.render())

        function show(nextIndex) {
          if (!sources.length || !frame) {
            error?.classList.add('is-visible')
            if (frame) frame.style.display = 'none'
            return { index: 0, total: 0 }
          }
          const target = ((nextIndex % sources.length) + sources.length) % sources.length
          // outra imagem começa inteira; reaplicar a mesma não perde o zoom
          if (target !== index) zoom.reset()
          index = target
          frame.style.display = 'block'
          error?.classList.remove('is-visible')
          const src = localAppSrc(sources[index])
          if (frame.getAttribute('src') !== src) {
            // Animação escolhida na barra: a imagem antiga sai e a nova entra já carregada.
            const hadImage = Boolean(frame.getAttribute('src'))
            const swap = hadImage && window.PianoScreenTransition
              ? window.PianoScreenTransition.begin(frame)
              : null
            frame.src = src
            if (swap) {
              const play = () => swap.play()
              if (typeof frame.decode === 'function') frame.decode().then(play, play)
              else play()
            }
          }
          return { index, total: sources.length }
        }

        frame?.addEventListener('error', () => {
          error?.classList.add('is-visible')
        })

        window.__liturgyGallery = {
          getState() {
            return { index: Math.max(0, index), total: sources.length, view: zoom.getView() }
          },
          getView() {
            return zoom.getView()
          },
          setView(next) {
            return zoom.setView(next)
          },
          /**
           * Parte visível da imagem atual, em pixels do arquivo original
           * (recorte para TVs antigas). Null sem zoom ou sem imagem carregada.
           */
          getCropRegion() {
            const view = zoom.getView()
            const nw = frame ? frame.naturalWidth : 0
            const nh = frame ? frame.naturalHeight : 0
            if (view.zoom <= 1 || !nw || !nh || !stage) return null
            const rect = stage.getBoundingClientRect()
            if (!rect.width || !rect.height) return null
            const fit = Math.min(rect.width / nw, rect.height / nh)
            const region = window.PianoZoomPan.visibleRegion(view, {
              stageWidth: rect.width,
              stageHeight: rect.height,
              contentWidth: nw * fit,
              contentHeight: nh * fit,
            })
            const x = Math.max(0, Math.floor(region.left / fit))
            const y = Math.max(0, Math.floor(region.top / fit))
            return {
              x,
              y,
              width: Math.max(1, Math.min(nw - x, Math.round((region.right - region.left) / fit))),
              height: Math.max(1, Math.min(nh - y, Math.round((region.bottom - region.top) / fit))),
            }
          },
          next() {
            return show(index + 1)
          },
          prev() {
            return show(index - 1)
          },
          goTo(i) {
            return show(Number(i) || 0)
          },
        }

        show(0)
      })()
    </script>
  </body>
</html>
