<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Navegação</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        color: #e8edf5;
        font: 600 12px/1.2 system-ui, sans-serif;
        user-select: none;
        overflow: hidden;
      }
      .shell {
        position: relative;
        width: 100%;
        height: 100%;
      }
      .panel {
        display: none;
        position: absolute;
        left: 0.5rem;
        bottom: 68px;
        width: min(23rem, calc(100% - 1rem));
        max-height: calc(100% - 80px);
        padding: 0.85rem;
        border-radius: 0.65rem;
        border: 1px solid rgba(232, 237, 245, 0.12);
        background: rgba(26, 30, 40, 0.97);
        box-shadow: 0 14px 36px rgba(0, 0, 0, 0.45);
        overflow: auto;
      }
      .shell.is-panel-open .panel {
        display: block;
      }
      .panel__header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 0.5rem;
      }
      .panel__title {
        margin: 0;
        font-size: 1.08rem;
        font-weight: 700;
      }
      .panel__identify {
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        padding: 0.3rem 0.5rem;
        border: 0;
        border-radius: 0.4rem;
        background: rgba(224, 137, 90, 0.18);
        color: #E0895A;
        font-size: 0.86rem;
        font-weight: 700;
        cursor: pointer;
        white-space: nowrap;
        width: auto;
        height: auto;
      }
      .panel__identify:hover:not(:disabled) {
        background: rgba(224, 137, 90, 0.28);
      }
      .panel__hint {
        margin: 0.6rem 0 0.75rem;
        font-size: 0.86rem;
        line-height: 1.4;
        font-weight: 500;
        opacity: 0.62;
      }
      .panel__list {
        margin: 0;
        padding: 0;
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
      }
      .panel__option {
        display: flex;
        align-items: flex-start;
        gap: 0.55rem;
        padding: 0.65rem 0.7rem;
        border-radius: 0.45rem;
        border: 1px solid rgba(232, 237, 245, 0.1);
        background: rgba(232, 237, 245, 0.04);
        cursor: pointer;
      }
      .panel__option:hover {
        border-color: rgba(224, 137, 90, 0.4);
        background: rgba(224, 137, 90, 0.1);
      }
      .panel__option.is-active {
        border-color: rgba(224, 137, 90, 0.55);
        background: rgba(224, 137, 90, 0.14);
      }
      .panel__option input {
        margin: 0.15rem 0 0;
        accent-color: #E0895A;
        cursor: pointer;
      }
      .panel__option-body {
        display: flex;
        flex-direction: column;
        gap: 0.1rem;
        min-width: 0;
      }
      .panel__option-name {
        font-size: 0.98rem;
        font-weight: 650;
      }
      .panel__option-meta {
        font-size: 0.84rem;
        font-weight: 500;
        opacity: 0.55;
      }
      .panel__empty {
        margin: 0;
        padding: 0.7rem 0.75rem;
        border-radius: 0.45rem;
        background: rgba(232, 237, 245, 0.06);
        opacity: 0.7;
        font-size: 0.88rem;
        font-weight: 500;
        line-height: 1.4;
      }
      .bar {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        display: flex;
        align-items: center;
        gap: 0.65rem;
        flex-shrink: 0;
        height: 64px;
        padding: 0 0.75rem;
        background: rgba(12, 12, 14, 0.92);
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 0.45rem;
        background: transparent;
        color: inherit;
        width: 2.35rem;
        height: 2.35rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 1rem;
      }
      button:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.1);
      }
      button:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }
      button:disabled {
        opacity: 0.35;
        cursor: default;
      }
      .label {
        margin-left: 0.35rem;
        opacity: 0.72;
        font-weight: 500;
        letter-spacing: 0.02em;
        white-space: nowrap;
      }
      /* Mesmo visual do botão de projetar da liturgia */
      #projectScreens {
        margin-left: 0.25rem;
        width: 2.05rem;
        height: 2.05rem;
        border-radius: 0.4rem;
        background: #E0895A;
        color: #000;
        box-shadow: 0 0 14px color-mix(in srgb, #E0895A 38%, transparent);
      }
      #projectScreens:hover {
        background: #E9A782;
      }
      #projectScreens.is-active {
        background: #E0895A;
        color: #111827;
        box-shadow: 0 0 14px rgba(252, 165, 165, 0.5);
      }
      #projectScreens.is-active:hover {
        background: #E9A782;
        color: #111827;
      }
      #projectScreens svg {
        display: block;
      }
      /* Clone do MonitorTargetSelect dense */
      .monitor-wrap {
        position: relative;
        display: inline-flex;
        flex-shrink: 0;
        margin-left: 0.15rem;
      }
      #monitorSelect {
        position: relative;
        width: 2.05rem;
        height: 2.05rem;
        padding: 0;
        border-radius: 0.4rem;
        background: #E0895A;
        color: #24160F;
        box-shadow: 0 0 14px color-mix(in srgb, #E0895A 36%, transparent);
      }
      #monitorSelect:hover {
        background: color-mix(in srgb, #E0895A 90%, white);
      }
      .shell.is-panel-open #monitorSelect {
        outline: 2px solid color-mix(in srgb, #E0895A 55%, transparent);
        outline-offset: 1px;
      }
      #monitorSelect svg {
        display: block;
      }
      .monitor-badge {
        position: absolute;
        top: -0.25rem;
        right: -0.25rem;
        min-width: 1.1rem;
        height: 1.1rem;
        padding: 0 0.28rem;
        border-radius: 999px;
        background: #44291D;
        color: #E0895A;
        font-size: 0.65rem;
        font-weight: 700;
        line-height: 1.1rem;
        text-align: center;
        pointer-events: none;
      }
      .monitor-badge.is-empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="shell" id="shell">
      <div
        class="panel"
        id="monitorPanel"
        role="dialog"
        aria-label="Selecionar telas"
      >
        <div class="panel__header">
          <p class="panel__title">Selecionar telas</p>
          <button
            id="identifyMonitors"
            class="panel__identify"
            type="button"
            title="Detectar telas"
            aria-label="Detectar telas"
          >
            Detectar telas
          </button>
        </div>
        <p class="panel__hint">
          Marque os monitores onde o recurso deve ser projetado.
        </p>
        <div id="monitorList"></div>
        <p id="tvSectionHint" class="panel__hint">Conexões ativas</p>
        <div id="tvList"></div>
      </div>

      <div class="bar">
        <button
          id="back"
          type="button"
          title="Voltar"
          aria-label="Voltar"
        >
          ←
        </button>
        <button
          id="forward"
          type="button"
          title="Avançar"
          aria-label="Avançar"
        >
          →
        </button>
        <button
          id="reload"
          type="button"
          title="Recarregar"
          aria-label="Recarregar"
        >
          ↻
        </button>
        <span class="label">Controle do site</span>
        <select id="audioOutput" title="Destino do áudio" aria-label="Destino do áudio" style="max-width:120px;background:#222;color:#eee;border:1px solid #555;border-radius:6px;padding:4px;font-size:11px">
          <option value="player">Som: só player</option><option value="connections">Som: só conexões</option><option value="both">Som: ambos</option>
        </select>
        <button
          id="projectScreens"
          type="button"
          title="Projetar site nas telas estendidas"
          aria-label="Projetar site nas telas estendidas"
          aria-pressed="false"
        >
          <svg
            id="projectIcon"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="currentColor"
            aria-hidden="true"
          >
            <path d="M5 19V5h2v12h12v2H5zm4.7-3.3 1.4-1.4L8.85 12H19v-2H8.85l2.25-2.25-1.4-1.4L5 11l4.7 4.7z" />
          </svg>
        </button>
        <div class="monitor-wrap">
          <button
            id="monitorSelect"
            type="button"
            title="Selecionar telas"
            aria-label="Selecionar telas"
            aria-expanded="false"
            aria-haspopup="dialog"
          >
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="currentColor"
              aria-hidden="true"
            >
              <path
                d="M21 16H3V4h18v12zm-10 2h2v2h5v2H6v-2h5v-2zM5 6v8h14V6H5z"
              />
            </svg>
          </button>
          <span id="monitorBadge" class="monitor-badge is-empty">0</span>
        </div>
      </div>
    </div>
    <script src="../palco/network-mirror.js"></script>
    <script>
      ;(function () {
        var shell = document.getElementById('shell')
        var backBtn = document.getElementById('back')
        var forwardBtn = document.getElementById('forward')
        var reloadBtn = document.getElementById('reload')
        var projectBtn = document.getElementById('projectScreens')
        var projectIcon = document.getElementById('projectIcon')
        var monitorBtn = document.getElementById('monitorSelect')
        var monitorBadge = document.getElementById('monitorBadge')
        var monitorList = document.getElementById('monitorList')
        var identifyBtn = document.getElementById('identifyMonitors')

        var ARROW_PATH = 'M5 17.59 15.59 7H9V5h10v10h-2V8.41L6.41 19 5 17.59z'
        var STOP_PATH = 'M6 6h12v12H6z'

        var panelOpen = false
        /** @type {number[]} */
        var selectedIds = []
        /** @type {Array<{id:number,label:string,resolution:string,isPrimary:boolean}>} */
        var displays = []

        var networkActive = false, tvSlots = [], tvChecked = {}, audioOutputMode = 'player'
        var tvHint = document.getElementById('tvSectionHint'), tvList = document.getElementById('tvList')
        var audioOutput = document.getElementById('audioOutput'), changingAudioOutput = false
        audioOutput.addEventListener('change', async function () {
          changingAudioOutput = true
          try {
            var saved = await window.louvorja.projection.setAudioOutput(audioOutput.value)
            if (saved) {
              audioOutputMode = saved
              if (networkActive) await Promise.all(tvSlots.filter(function (slot) { return slot.clients > 0 && tvChecked[slot.id] !== false }).map(function (slot) {
                return window.louvorja.palco.send({ v: 2, type: 'audioOutput', mode: saved }, slot.id)
              }))
            }
          } finally { audioOutput.value = audioOutputMode; changingAudioOutput = false }
        })
        function renderConnections() {
          tvList.replaceChildren()
          tvSlots.filter(function (slot) { return slot.clients > 0 }).forEach(function (slot) {
            var label = document.createElement('label'); label.className = 'panel__option'
            var input = document.createElement('input'); input.type = 'checkbox'; input.checked = tvChecked[slot.id] !== false
            input.setAttribute('data-tv', slot.id)
            input.addEventListener('change', async function () {
              tvChecked[slot.id] = input.checked
              try {
                var state = await window.louvorja.projection.getNavigationState()
                if (state && state.projecting) networkActive = true
                if (networkActive) {
                  if (input.checked) await startConnection(slot.id)
                  else if (networkMirrorSender) await networkMirrorSender.remove(slot.id)
                }
              } catch (error) { tvHint.textContent = error.message }
              await refreshNav()
            })
            var text = document.createElement('span'); text.textContent = slot.label
            label.append(input, text); tvList.appendChild(label)
          })
        }
        async function loadConnections() {
          if (!window.louvorja || !window.louvorja.palco) return
          tvSlots = await window.louvorja.palco.slots().catch(function () { return [] })
          renderConnections(); await refreshNav()
        }
        async function startConnection(slotId) {
          try {
            await getNetworkMirrorSender().prepare()
            await prepareSiteReceiver(slotId)
            if (networkActive && tvChecked[slotId] !== false) await getNetworkMirrorSender().start(slotId)
          } catch (error) { tvHint.textContent = 'Transmissão: ' + error.message }
        }
        async function startConnections() {
          await loadConnections()
          await Promise.all(tvSlots.filter(function (slot) { return slot.clients > 0 && tvChecked[slot.id] !== false }).map(function (slot) { return startConnection(slot.id) }))
        }
        var networkMirrorSender = null
        function getNetworkMirrorSender() {
          if (networkMirrorSender) return networkMirrorSender
          networkMirrorSender = PianoNetworkMirror.createSender({
            capture: async function () {
              try {
                return await navigator.mediaDevices.getDisplayMedia({ video: { width: { max: 960 }, height: { max: 540 }, frameRate: { max: 30 } }, audio: true })
              } catch (displayError) { /* Older Chromium fallback below. */ }
              var sourceId = await window.louvorja.projection.getSourceMediaId()
              if (!sourceId) throw new Error('Fonte do player indisponível.')
              function constraints(kind, audio) {
                return { audio: audio ? { mandatory: { chromeMediaSource: kind, chromeMediaSourceId: sourceId } } : false,
                  video: { mandatory: { chromeMediaSource: kind, chromeMediaSourceId: sourceId, maxWidth: 960, maxHeight: 540, maxFrameRate: 30 } } }
              }
              try { return await navigator.mediaDevices.getUserMedia(constraints('tab', true)) }
              catch (audioError) {
                sourceId = await window.louvorja.projection.getSourceMediaId()
                var stream
                try { stream = await navigator.mediaDevices.getUserMedia(constraints('tab', false)) }
                catch (tabError) { stream = await navigator.mediaDevices.getUserMedia(constraints('desktop', false)) }
                tvHint.style.display = ''
                tvHint.textContent = 'Imagem conectada. O sistema não disponibilizou a captura de áudio deste player.'
                return stream
              }
            },
            connectionsMuted: function () { return audioOutputMode === 'player' },
            send: function (message, slotId) { return window.louvorja.palco.send(message, slotId) },
          })
          return networkMirrorSender
        }
        if (window.louvorja && window.louvorja.palco && window.louvorja.palco.onEvent) {
          window.louvorja.palco.onEvent(function (message) {
            if (!networkMirrorSender || !networkActive) return
            networkMirrorSender.handle(message).catch(function (error) {
              tvHint.style.display = ''; tvHint.textContent = 'Transmissão: ' + error.message
            })
          })
        }
        window.addEventListener('beforeunload', function () { if (networkMirrorSender) void networkMirrorSender.stop() })
        var siteReceiverReady = {}
        function prepareSiteReceiver(slotId) {
          if (siteReceiverReady[slotId]) return siteReceiverReady[slotId]
          var requestId = 'site-' + slotId + '-' + Date.now() + '-' + Math.random().toString(36).slice(2)
          var pending = new Promise(function (resolve, reject) {
            var off = null
            var timer = null
            var settled = false
            function finish(error) {
              if (settled) return
              settled = true
              clearTimeout(timer)
              if (typeof off === 'function') off()
              if (error) reject(error); else resolve(true)
            }
            off = window.louvorja.palco.onEvent(function (event) {
              if (event && event.type === 'receiver-ready' && event.requestId === requestId && event.cleanMirror === true) finish()
            })
            timer = setTimeout(function () { finish(new Error('A conexão não confirmou a atualização do player.')) }, 10000)
            window.louvorja.palco.send({ v: 2, type: 'obsControl', action: 'reload', requestId: requestId }, slotId)
              .then(function (sent) { if (!sent) finish(new Error('Não foi possível atualizar a conexão.')) })
              .catch(finish)
          })
          siteReceiverReady[slotId] = pending.catch(function (error) {
            delete siteReceiverReady[slotId]
            throw error
          })
          return siteReceiverReady[slotId]
        }

        function setProjectingUi(projecting) {
          projecting = projecting || networkActive
          var canProject = selectedIds.length > 0 || tvSlots.some(function (slot) { return slot.clients > 0 && tvChecked[slot.id] !== false })
          projectBtn.disabled = !projecting && !canProject
          if (projecting) {
            projectBtn.classList.add('is-active')
            projectBtn.title = 'Parar projeção do site'
            projectBtn.setAttribute('aria-label', 'Parar projeção do site')
            projectBtn.setAttribute('aria-pressed', 'true')
            projectIcon.innerHTML = '<path d="' + STOP_PATH + '" />'
          } else {
            projectBtn.classList.remove('is-active')
            var label = canProject
              ? 'Projetar site nas telas estendidas'
              : 'Nenhuma tela disponível para projeção'
            projectBtn.title = label
            projectBtn.setAttribute('aria-label', label)
            projectBtn.setAttribute('aria-pressed', 'false')
            projectIcon.innerHTML = '<path d="' + ARROW_PATH + '" />'
          }
        }

        function updateBadge() {
          var count = selectedIds.length
          monitorBadge.textContent = String(count)
          if (count > 0) monitorBadge.classList.remove('is-empty')
          else monitorBadge.classList.add('is-empty')
        }

        function renderList() {
          var extended = displays.filter(function (d) {
            return !d.isPrimary
          })
          if (!extended.length) {
            monitorList.innerHTML =
              '<p class="panel__empty">Nenhum monitor estendido encontrado.</p>'
            return
          }

          var html = '<ul class="panel__list" role="group" aria-label="Selecionar telas">'
          for (var i = 0; i < extended.length; i++) {
            var item = extended[i]
            var checked = selectedIds.indexOf(item.id) >= 0
            html +=
              '<li><label class="panel__option' +
              (checked ? ' is-active' : '') +
              '">' +
              '<input type="checkbox" data-id="' +
              item.id +
              '"' +
              (checked ? ' checked' : '') +
              ' />' +
              '<span class="panel__option-body">' +
              '<span class="panel__option-name">' +
              item.label +
              '</span>' +
              '<span class="panel__option-meta">' +
              item.resolution +
              '</span>' +
              '</span></label></li>'
          }
          html += '</ul>'
          monitorList.innerHTML = html

          var inputs = monitorList.querySelectorAll('input[type="checkbox"]')
          for (var j = 0; j < inputs.length; j++) {
            inputs[j].addEventListener('change', onToggleMonitor)
          }
        }

        async function loadMonitors() {
          if (!window.louvorja) return
          var list = []
          if (window.louvorja.displays && window.louvorja.displays.list) {
            list = (await window.louvorja.displays.list()) || []
          }
          displays = list.map(function (d, index) {
            return {
              id: d.id,
              label: 'Monitor ' + (index + 1),
              resolution: d.bounds
                ? d.bounds.width + ' × ' + d.bounds.height
                : '',
              isPrimary: Boolean(d.isPrimary),
            }
          })

          var ids = []
          if (
            window.louvorja.projection &&
            window.louvorja.projection.getSiteTargetMonitors
          ) {
            ids = (await window.louvorja.projection.getSiteTargetMonitors()) || []
          }
          var allowed = {}
          for (var i = 0; i < displays.length; i++) {
            if (!displays[i].isPrimary) allowed[displays[i].id] = true
          }
          selectedIds = ids.filter(function (id) {
            return allowed[id]
          })
          updateBadge()
          renderList()
          await refreshNav()
        }

        async function setPanelOpen(open) {
          panelOpen = Boolean(open)
          shell.classList.toggle('is-panel-open', panelOpen)
          monitorBtn.setAttribute('aria-expanded', panelOpen ? 'true' : 'false')
          if (
            window.louvorja &&
            window.louvorja.projection &&
            window.louvorja.projection.setSiteControlPanelOpen
          ) {
            await window.louvorja.projection.setSiteControlPanelOpen(panelOpen)
          }
          if (panelOpen) { await loadMonitors(); await loadConnections() }
        }

        async function onToggleMonitor(event) {
          var input = event.target
          var id = Number(input.getAttribute('data-id'))
          if (!Number.isFinite(id)) return
          if (input.checked) {
            if (selectedIds.indexOf(id) < 0) selectedIds.push(id)
          } else {
            selectedIds = selectedIds.filter(function (item) {
              return item !== id
            })
          }
          updateBadge()
          renderList()
          if (
            window.louvorja &&
            window.louvorja.projection &&
            window.louvorja.projection.setSiteTargetMonitors
          ) {
            await window.louvorja.projection.setSiteTargetMonitors(selectedIds.slice())
            if (networkActive && selectedIds.length > 0) {
              var state = await window.louvorja.projection.getNavigationState()
              if (state && !state.projecting) await window.louvorja.projection.toggleSiteScreens()
            }
          }
          await refreshNav()
        }

        async function refreshNav() {
          if (!window.louvorja || !window.louvorja.projection) return
          var state = await window.louvorja.projection.getNavigationState()
          if (!state) return
          if (!changingAudioOutput && state.audioOutput) { audioOutputMode = state.audioOutput; audioOutput.value = audioOutputMode }
          backBtn.disabled = !state.canGoBack
          forwardBtn.disabled = !state.canGoForward
          setProjectingUi(Boolean(state.projecting))
        }

        backBtn.addEventListener('click', async function () {
          if (!window.louvorja || !window.louvorja.projection) return
          await window.louvorja.projection.remoteGoBack()
          refreshNav()
        })

        forwardBtn.addEventListener('click', async function () {
          if (!window.louvorja || !window.louvorja.projection) return
          await window.louvorja.projection.remoteGoForward()
          refreshNav()
        })

        reloadBtn.addEventListener('click', async function () {
          if (!window.louvorja || !window.louvorja.projection) return
          await window.louvorja.projection.remoteReload()
          refreshNav()
        })

        projectBtn.addEventListener('click', async function () {
          if (projectBtn.disabled) return
          if (!window.louvorja || !window.louvorja.projection) return
          var state = await window.louvorja.projection.getNavigationState()
          var stopping = Boolean((state && state.projecting) || networkActive)
          if ((stopping && state && state.projecting) || (!stopping && selectedIds.length > 0)) await window.louvorja.projection.toggleSiteScreens()
          if (stopping) {
            networkActive = false
            if (networkMirrorSender) await networkMirrorSender.stop()
          } else {
            networkActive = true
            await startConnections()
          }
          refreshNav()
        })

        monitorBtn.addEventListener('click', async function () {
          await setPanelOpen(!panelOpen)
        })

        identifyBtn.addEventListener('click', async function () {
          if (!window.louvorja || !window.louvorja.displays) return
          identifyBtn.disabled = true
          try {
            await window.louvorja.displays.identify()
            await loadMonitors()
          } finally {
            identifyBtn.disabled = false
          }
        })

        document.addEventListener(
          'pointerdown',
          function (event) {
            if (!panelOpen) return
            var target = event.target
            if (!(target instanceof Node)) return
            if (monitorBtn.contains(target)) return
            if (document.getElementById('monitorPanel').contains(target)) return
            setPanelOpen(false)
          },
          true,
        )

        if (
          window.louvorja &&
          window.louvorja.projection &&
          window.louvorja.projection.onSiteTargetsChanged
        ) {
          window.louvorja.projection.onSiteTargetsChanged(function (ids) {
            selectedIds = Array.isArray(ids) ? ids.slice() : []
            updateBadge()
            if (panelOpen) renderList()
          })
        }

        setInterval(refreshNav, 400)
        refreshNav()
        loadMonitors()
        loadConnections()
      })()
    </script>
  </body>
</html>
