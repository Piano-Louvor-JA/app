<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Controles</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        color: #f1f5f9;
        font: 600 12px/1.2 system-ui, sans-serif;
        user-select: none;
        overflow: hidden;
      }
      body.audio-only #audioOutput, body.audio-only #project, body.audio-only .monitor-wrap, body.audio-only #monitorPanel, body.audio-only #captions { display: none !important; }
      button[hidden] { display: none !important; }
      .shell {
        position: relative;
        width: 100%;
        height: 100%;
      }
      .bar {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 0.65rem;
        align-items: center;
        height: 100%;
        padding: 0 0.75rem;
        background: rgba(12, 12, 14, 0.92);
      }
      .shell.is-panel-open .bar {
        position: absolute;
        inset: auto 0 0;
        height: 64px;
      }
      .panel {
        display: none;
        position: absolute;
        left: 0.5rem;
        bottom: 68px;
        width: min(23rem, calc(100% - 1rem));
        max-height: calc(100% - 80px);
        padding: 0.85rem;
        border: 1px solid rgba(232, 237, 245, 0.12);
        border-radius: 0.65rem;
        background: rgba(26, 30, 40, 0.97);
        box-shadow: 0 14px 36px rgba(0, 0, 0, 0.45);
        overflow: auto;
      }
      .shell.is-panel-open .panel {
        display: block;
      }
      .panel__header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
      }
      .panel__title {
        margin: 0;
        font-size: 1.08rem;
      }
      .panel__identify {
        width: auto;
        height: auto;
        padding: 0.35rem 0.55rem;
        border-radius: 0.4rem;
        background: rgba(251, 146, 60, 0.14);
        color: #fb923c;
        font-size: 0.8rem;
      }
      .panel__hint,
      .panel__empty {
        margin: 0.55rem 0 0.7rem;
        font-weight: 500;
        opacity: 0.65;
      }
      .panel__list {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .panel__option {
        display: flex;
        align-items: flex-start;
        gap: 0.55rem;
        padding: 0.65rem 0.7rem;
        border: 1px solid rgba(232, 237, 245, 0.1);
        border-radius: 0.45rem;
        background: rgba(232, 237, 245, 0.04);
        cursor: pointer;
      }
      .panel__option.is-active {
        border-color: rgba(251, 146, 60, 0.55);
        background: rgba(251, 146, 60, 0.12);
      }
      .panel__option input {
        margin-top: 0.15rem;
        accent-color: #fb923c;
      }
      .panel__option-body {
        display: flex;
        min-width: 0;
        flex-direction: column;
        gap: 0.1rem;
      }
      .panel__option-name {
        font-size: 0.95rem;
      }
      .panel__option-meta {
        font-size: 0.75rem;
        font-weight: 500;
        opacity: 0.55;
      }
      .transport {
        display: inline-flex;
        align-items: center;
        gap: 0.2rem;
      }
      .meta {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
      }
      .monitor-wrap {
        position: relative;
        display: inline-flex;
      }
      .monitor-badge {
        position: absolute;
        top: -0.15rem;
        right: -0.15rem;
        min-width: 0.9rem;
        height: 0.9rem;
        padding: 0 0.2rem;
        border-radius: 999px;
        background: #fb923c;
        color: #111827;
        font-size: 0.62rem;
        line-height: 0.9rem;
        text-align: center;
        pointer-events: none;
      }
      .monitor-badge.is-empty {
        display: none;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: inherit;
        width: 2.35rem;
        height: 2.35rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.1);
      }
      button:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }
      button.is-active {
        background: rgba(234, 88, 12, 0.28);
        color: #fb923c;
      }
      button i {
        font-style: normal;
        font-size: 1.4rem;
        line-height: 1;
      }
      button svg {
        width: 1.45rem;
        height: 1.45rem;
        fill: currentColor;
      }
      .volume {
        width: 4.5rem;
        accent-color: #E0895A;
        cursor: pointer;
      }
      .seek {
        width: 100%;
        accent-color: #E0895A;
        cursor: pointer;
      }
      .time {
        min-width: 5.5rem;
        text-align: right;
        opacity: 0.85;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <div
      id="shell"
      class="shell"
    >
      <div
        id="monitorPanel"
        class="panel"
        role="dialog"
        aria-label="Selecionar telas"
      >
        <div class="panel__header">
          <p class="panel__title">Selecionar telas</p>
          <button
            id="identifyMonitors"
            class="panel__identify"
            type="button"
          >
            Detectar telas
          </button>
        </div>
        <p class="panel__hint">
          Marque os monitores onde o vídeo deve ser projetado.
        </p>
        <div id="monitorList"></div>
        <p class="panel__hint" id="tvSectionHint" style="display:none">
          TVs conectadas pelo Palco (cast).
        </p>
        <div id="tvList"></div>
      </div>
      <div class="bar">
      <div class="transport">
        <button
          id="play"
          type="button"
          title="Play / Pause"
          aria-label="Play / Pause"
        >
          <i id="playIcon">▶</i>
        </button>
        <button
          id="mute"
          type="button"
          title="Áudio"
          aria-label="Ativar ou desativar áudio"
          aria-pressed="false"
        >
          <i id="muteIcon">🔊</i>
        </button>
        <input
          id="volume"
          class="volume"
          type="range"
          min="0"
          max="100"
          value="100"
          step="1"
          title="Volume"
          aria-label="Volume"
        />
        <select id="audioOutput" aria-label="Destino do áudio" title="Destino do áudio"
          style="max-width:120px;background:#222;color:#eee;border:1px solid #555;border-radius:6px;padding:5px;font-size:11px">
          <option value="player">Som: só player</option>
          <option value="connections">Som: só conexões</option>
          <option value="both">Som: ambos</option>
        </select>
        <button
          id="project"
          type="button"
          title="Projetar nas telas"
          aria-label="Projetar nas telas"
          aria-pressed="false"
        >
          <svg
            id="projectIcon"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path d="M5 17.59 15.59 7H9V5h10v10h-2V8.41L6.41 19 5 17.59z" />
          </svg>
        </button>
        <span class="monitor-wrap">
          <button
            id="monitorSelect"
            type="button"
            title="Selecionar telas"
            aria-label="Selecionar telas"
            aria-expanded="false"
            aria-haspopup="dialog"
          >
            <svg
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path d="M21 16H3V4h18v12zm-10 2h2v2h5v2H6v-2h5v-2zM5 6v8h14V6H5z" />
            </svg>
          </button>
          <span
            id="monitorBadge"
            class="monitor-badge is-empty"
          >0</span>
        </span>
        <button id="captions" type="button" title="Ocultar legendas" aria-label="Ocultar legendas" aria-pressed="false" hidden>
          <i id="captionsIcon" style="font-size:12px;font-weight:800">CC</i>
        </button>
      </div>
      <input
        id="seek"
        class="seek"
        type="range"
        min="0"
        max="1000"
        value="0"
        step="1"
      />
      <div class="meta">
        <span
          id="time"
          class="time"
          >0:00 / 0:00</span
        >
      </div>
    </div>
    </div>
    <script src="../palco/network-mirror.js"></script>
    <script>
      ;(function () {
        var audioOnly = new URLSearchParams(window.location.search).get('audioOnly') === '1'
        document.body.classList.toggle('audio-only', audioOnly)
        var playBtn = document.getElementById('play')
        var playIcon = document.getElementById('playIcon')
        var muteBtn = document.getElementById('mute')
        var muteIcon = document.getElementById('muteIcon')
        var captionsBtn = document.getElementById('captions')
        var captionsIcon = document.getElementById('captionsIcon')
        var captionsHidden = false
        var audioOutput = document.getElementById('audioOutput')
        var audioOutputMode = 'player'
        var changingAudioOutput = false
        audioOutput.addEventListener('change', function () {
          return applyAudioOutput(audioOutput.value)
        })
        async function applyAudioOutput(mode) {
          changingAudioOutput = true; audioOutput.disabled = true
          try {
            var saved = await window.louvorja.projection.setAudioOutput(mode)
            if (saved) { audioOutputMode = saved; await tvBroadcast('audio-output', { mode: saved }) }
          } finally { audioOutput.value = audioOutputMode; audioOutput.disabled = false; changingAudioOutput = false }
        }
        var volume = document.getElementById('volume')
        var seek = document.getElementById('seek')
        var projectBtn = document.getElementById('project')
        var projectIcon = document.getElementById('projectIcon')
        var shell = document.getElementById('shell')
        var monitorBtn = document.getElementById('monitorSelect')
        var monitorBadge = document.getElementById('monitorBadge')
        var monitorList = document.getElementById('monitorList')
        var monitorPanel = document.getElementById('monitorPanel')
        var identifyBtn = document.getElementById('identifyMonitors')
        var timeEl = document.getElementById('time')
        var seeking = false
        var adjustingVolume = false
        var muted = false
        var lastAudibleVolume = 1
        var panelOpen = false
        var selectedIds = []
        var displays = []

        var ARROW_PATH = 'M5 17.59 15.59 7H9V5h10v10h-2V8.41L6.41 19 5 17.59z'
        var STOP_PATH = 'M6 6h12v12H6z'

        function finiteTime(sec) {
          var value = Number(sec)
          return Number.isFinite(value) && value > 0 ? value : 0
        }

        function fmt(sec) {
          var value = Number(sec)
          if (!Number.isFinite(value) || value < 0) value = 0
          sec = Math.floor(value)
          var m = Math.floor(sec / 60)
          var s = sec % 60
          return m + ':' + String(s).padStart(2, '0')
        }

        function setMuteUi(nextMuted) {
          muted = Boolean(nextMuted)
          muteIcon.textContent = muted ? '🔇' : '🔊'
          muteBtn.setAttribute('aria-pressed', muted ? 'true' : 'false')
          muteBtn.title = muted ? 'Ativar áudio' : 'Deixar mudo'
        }

        function setVolumeUi(nextVolume, nextMuted) {
          var value = Math.min(1, Math.max(0, Number(nextVolume) || 0))
          if (value > 0) lastAudibleVolume = value
          if (!adjustingVolume) {
            volume.value = String(Math.round((nextMuted ? 0 : value) * 100))
          }
          setMuteUi(Boolean(nextMuted) || value <= 0)
        }

        function setProjectingUi(projecting) {
          projecting = projecting || networkProjectionActive
          var canProject = selectedIds.length > 0 || (tvSlots || []).some(function (slot) {
            return slot.clients > 0 && tvChecked[slot.id] !== false
          })
          projectBtn.disabled = !projecting && !canProject
          if (projecting) {
            projectBtn.classList.add('is-active')
            projectBtn.title = 'Retirar projeção'
            projectBtn.setAttribute('aria-label', 'Retirar projeção')
            projectBtn.setAttribute('aria-pressed', 'true')
            projectIcon.innerHTML = '<path d="' + STOP_PATH + '" />'
          } else {
            projectBtn.classList.remove('is-active')
            var label = canProject
              ? 'Projetar nas telas'
              : 'Nenhuma tela disponível para projeção'
            projectBtn.title = label
            projectBtn.setAttribute('aria-label', label)
            projectBtn.setAttribute('aria-pressed', 'false')
            projectIcon.innerHTML = '<path d="' + ARROW_PATH + '" />'
          }
        }

        function updateMonitorBadge() {
          monitorBadge.textContent = String(selectedIds.length)
          monitorBadge.classList.toggle('is-empty', selectedIds.length === 0)
        }

        function renderMonitorList() {
          var extended = displays.filter(function (display) {
            return !display.isPrimary
          })
          if (!extended.length) {
            monitorList.innerHTML =
              '<p class="panel__empty">Nenhum monitor estendido encontrado.</p>'
            return
          }

          var html = '<ul class="panel__list" role="group" aria-label="Selecionar telas">'
          for (var i = 0; i < extended.length; i++) {
            var display = extended[i]
            var checked = selectedIds.indexOf(display.id) >= 0
            html +=
              '<li><label class="panel__option' +
              (checked ? ' is-active' : '') +
              '"><input type="checkbox" data-id="' +
              display.id +
              '"' +
              (checked ? ' checked' : '') +
              '><span class="panel__option-body"><span class="panel__option-name">' +
              display.label +
              '</span><span class="panel__option-meta">' +
              display.resolution +
              '</span></span></label></li>'
          }
          monitorList.innerHTML = html + '</ul>'

          var inputs = monitorList.querySelectorAll('input[type="checkbox"]')
          for (var j = 0; j < inputs.length; j++) {
            inputs[j].addEventListener('change', onToggleMonitor)
          }
        }

        // ===== TVs do Palco (cast): listar slots conectados, marcados por
        // padrão (modo espelhamento). Marcar = servir arquivo + play no slot;
        // desmarcar = stop. Recria funcionalidade perdida com o /tmp (24/08).
        var networkProjectionActive = false
        var tvSlots = []
        var tvChecked = {}
        var tvList = document.getElementById('tvList')
        var tvHint = document.getElementById('tvSectionHint')

        function tvRenderList() {
          var connected = tvSlots.filter(function (slot) {
            return slot.clients > 0
          })
          tvHint.style.display = connected.length ? '' : 'none'
          if (!connected.length) {
            tvList.innerHTML = ''
            return
          }
          var html = '<ul class="panel__list" role="group" aria-label="Selecionar TVs">'
          for (var i = 0; i < connected.length; i++) {
            var slot = connected[i]
            var checked = tvChecked[slot.id] !== false
            html +=
              '<li><label class="panel__option' +
              (checked ? ' is-active' : '') +
              '"><input type="checkbox" data-tv="' +
              slot.id +
              '"' +
              (checked ? ' checked' : '') +
              '><span class="panel__option-body"><span class="panel__option-name">' +
              slot.label +
              '</span><span class="panel__option-meta">TV · Palco</span></span></label></li>'
          }
          tvList.innerHTML = html + '</ul>'
          var inputs = tvList.querySelectorAll('input[type="checkbox"]')
          for (var j = 0; j < inputs.length; j++) {
            inputs[j].addEventListener('change', onToggleTv)
          }
        }

        async function loadTvs() {
          if (audioOnly) return
          if (!window.louvorja || !window.louvorja.palco) return
          try {
            tvSlots = (await window.louvorja.palco.slots()) || []
          } catch (e) {
            tvSlots = []
          }
          tvRenderList()
          await refresh()
          if (!networkProjectionActive) return
          var media =
            window.louvorja.projection && window.louvorja.projection.getSourceMediaInfo
              ? await window.louvorja.projection.getSourceMediaInfo()
              : null
          if (!media || (!media.filePath && !media.youtubeId)) return
          var st =
            window.louvorja.projection &&
            window.louvorja.projection.getPlaybackState
              ? await window.louvorja.projection.getPlaybackState().catch(function () { return null })
              : null
          var posMs = st && st.currentTime > 0 ? Math.round(st.currentTime * 1000) : 0
          for (var i = 0; i < tvSlots.length; i++) {
            var slot = tvSlots[i]
            if (slot.clients > 0 && tvChecked[slot.id] !== false) {
              void tvSendMedia(slot.id, media, posMs, st && st.paused)
            }
          }
        }

        var networkMirrorSender = null
        function getNetworkMirrorSender() {
          if (networkMirrorSender) return networkMirrorSender
          networkMirrorSender = PianoNetworkMirror.createSender({
            capture: async function () {
              try {
                return await navigator.mediaDevices.getDisplayMedia({ video: { width: { max: 960 }, height: { max: 540 }, frameRate: { max: 30 } }, audio: true })
              } catch (displayError) { /* Older Chromium fallback below. */ }
              var sourceId = await window.louvorja.projection.getSourceMediaId()
              if (!sourceId) throw new Error('Fonte do player indisponível.')
              function constraints(kind, audio) {
                return { audio: audio ? { mandatory: { chromeMediaSource: kind, chromeMediaSourceId: sourceId } } : false,
                  video: { mandatory: { chromeMediaSource: kind, chromeMediaSourceId: sourceId, maxWidth: 960, maxHeight: 540, maxFrameRate: 30 } } }
              }
              try { return await navigator.mediaDevices.getUserMedia(constraints('tab', true)) }
              catch (audioError) {
                sourceId = await window.louvorja.projection.getSourceMediaId()
                var stream
                try { stream = await navigator.mediaDevices.getUserMedia(constraints('tab', false)) }
                catch (tabError) { stream = await navigator.mediaDevices.getUserMedia(constraints('desktop', false)) }
                tvHint.style.display = ''
                tvHint.textContent = 'Imagem conectada. O sistema não disponibilizou a captura de áudio deste player.'
                return stream
              }
            },
            connectionsMuted: function () { return audioOutputMode === 'player' },
            send: function (message, slotId) { return window.louvorja.palco.send(message, slotId) },
          })
          return networkMirrorSender
        }
        if (window.louvorja && window.louvorja.palco && window.louvorja.palco.onEvent) {
          window.louvorja.palco.onEvent(function (message) {
            if (!networkMirrorSender || !networkProjectionActive) return
            networkMirrorSender.handle(message).catch(function (error) {
              tvHint.style.display = ''; tvHint.textContent = 'Transmissão: ' + error.message
            })
          })
        }
        window.addEventListener('beforeunload', function () { if (networkMirrorSender) void networkMirrorSender.stop() })
        var youtubeReceiverReady = {}
        function prepareYoutubeReceiver(slotId) {
          if (youtubeReceiverReady[slotId]) return youtubeReceiverReady[slotId]
          var requestId = 'youtube-' + slotId + '-' + Date.now() + '-' + Math.random().toString(36).slice(2)
          var pending = new Promise(function (resolve, reject) {
            var off = null
            var timer = null
            var settled = false
            function finish(error) {
              if (settled) return
              settled = true
              clearTimeout(timer)
              if (typeof off === 'function') off()
              if (error) reject(error); else resolve(true)
            }
            off = window.louvorja.palco.onEvent(function (event) {
              if (event && event.type === 'receiver-ready' && event.requestId === requestId && event.cleanMirror === true) finish()
            })
            timer = setTimeout(function () { finish(new Error('A conexão não confirmou a atualização do player.')) }, 10000)
            window.louvorja.palco.send({ v: 2, type: 'obsControl', action: 'reload', requestId: requestId }, slotId)
              .then(function (sent) { if (!sent) finish(new Error('Não foi possível atualizar a conexão.')) })
              .catch(finish)
          })
          youtubeReceiverReady[slotId] = pending.catch(function (error) {
            delete youtubeReceiverReady[slotId]
            throw error
          })
          return youtubeReceiverReady[slotId]
        }

        var tvYoutubeRoutes = {}
        var tvUnservableFiles = {}
        // Cópia do YouTube já baixada: a TV toca o arquivo; acima do limite de publicação, espelho.
        function tvYoutubeRoute(media) {
          return media.filePath && !tvUnservableFiles[media.filePath] ? 'file' : 'mirror'
        }

        async function tvSendMedia(slotId, media, positionMs, paused) {
          if (!networkProjectionActive || tvChecked[slotId] === false) return
          if (!media.youtubeId) return tvSendVideo(slotId, media.filePath, media.title, positionMs)
          if (tvYoutubeRoute(media) === 'file') {
            if (await tvSendVideo(slotId, media.filePath, media.title, positionMs)) {
              tvYoutubeRoutes[slotId] = 'file'
              return
            }
            tvUnservableFiles[media.filePath] = true
          }
          if (!networkProjectionActive || tvChecked[slotId] === false) return
          tvYoutubeRoutes[slotId] = 'mirror'
          try {
            await getNetworkMirrorSender().prepare()
            await prepareYoutubeReceiver(slotId)
            if (!networkProjectionActive || tvChecked[slotId] === false) return
            await getNetworkMirrorSender().start(slotId)
          } catch (e) {
            tvHint.style.display = ''
            tvHint.textContent = 'YouTube: ' + (e && e.message ? e.message : 'falha ao preparar a conexão.')
          }
        }

        /** As TVs não desenham a legenda do arquivo: ligar ou desligar a legenda troca entre arquivo e espelho. */
        async function tvRerouteYoutube() {
          if (!networkProjectionActive || !window.louvorja.palco) return
          var media = await window.louvorja.projection.getSourceMediaInfo()
          if (!media || !media.youtubeId) return
          var route = tvYoutubeRoute(media)
          var st = await window.louvorja.projection.getPlaybackState().catch(function () { return null })
          var posMs = st && st.currentTime > 0 ? Math.round(st.currentTime * 1000) : 0
          for (var i = 0; i < tvSlots.length; i++) {
            var slot = tvSlots[i]
            var previous = tvYoutubeRoutes[slot.id]
            if (!(slot.clients > 0) || tvChecked[slot.id] === false || !previous || previous === route) continue
            if (route === 'file' && networkMirrorSender) await networkMirrorSender.remove(slot.id)
            if (route === 'mirror') await window.louvorja.palco.send({ v: 2, type: 'video', action: 'stop' }, slot.id)
            void tvSendMedia(slot.id, media, posMs, st && st.paused)
          }
        }

        async function tvSendVideo(slotId, filePath, title, positionMs) {
          try {
            var url = await window.louvorja.palco.servePath(filePath, slotId)
            if (!url) return false
            if (!networkProjectionActive || tvChecked[slotId] === false) return true
            await window.louvorja.palco.send(
              {
                v: 2,
                type: 'video',
                url: url,
                title: title || '',
                connectionsMuted: audioOutputMode === 'player',
                positionMs: positionMs || 0,
              },
              slotId,
            )
            await window.louvorja.palco.send(
              { v: 2, type: 'video', action: 'play' },
              slotId,
            )
            return true
          } catch (e) {
            /* slot pode ter caído */
            return false
          }
        }

        /** Manda ação (play/pause/seek/stop) p/ todas as TVs marcadas. */
        async function tvBroadcast(action, extra) {
          if (audioOnly) return
          if (!networkProjectionActive) return
          if (!window.louvorja || !window.louvorja.palco) return
          // Receiver pode ter conectado depois do boot do popup — atualiza
          // a lista antes de mandar (pause/play não chegavam a quem entrou tarde).
          try { tvSlots = (await window.louvorja.palco.slots()) || [] } catch (e) { /* segue com a atual */ }
          for (var i = 0; i < tvSlots.length; i++) {
            var slot = tvSlots[i]
            if (slot.clients > 0 && tvChecked[slot.id] !== false) {
              // pause/play/stop valem para QUALQUER mídia tocando na TV
              // (vídeo OU áudio de item de liturgia) — manda nos dois canais.
              void window.louvorja.palco.send(
                Object.assign({ v: 2, type: action === 'audio-output' ? 'audioOutput' : 'video', action: action }, extra || {}),
                slot.id,
              )
              if (action === 'audio-output') continue
              void window.louvorja.palco.send(
                Object.assign({ v: 2, type: 'audio', action: action }, extra || {}),
                slot.id,
              )
            }
          }
        }

        /** Sync periódico do currentTime → TVs (corrige drift; não recarrega). */
        var lastTvSyncMs = 0
        var lastTvPos = 0
        var lastTvSeekMs = 0
        async function tvSyncPosition() {
          if (audioOnly) return
          if (!window.louvorja || !window.louvorja.projection) return
          var now = Date.now()
          // Spec multi-telas F4: 1s (era 3s) — drift corrigido antes de
          // ser perceptível (~150ms); receiver faz correção suave.
          if (now - lastTvSyncMs < 1000) return
          lastTvSyncMs = now
          var state = await window.louvorja.projection.getPlaybackState()
          if (!state || state.paused || !(state.currentTime > 0)) return
          // Só corrige desvio REAL (>1.5s). Seek a cada 1s sem drift causava
          // stutter no MP3 da TV (receiver re-posicionava sem parar).
          if (Math.abs(state.currentTime - (lastTvPos || 0)) < 1.5 && Date.now() - lastTvSeekMs < 5000) return
          lastTvPos = state.currentTime
          lastTvSeekMs = Date.now()
          tvBroadcast('seek', { position: state.currentTime })
        }

        async function onToggleTv(event) {
          await setTvEnabled(event.target.getAttribute('data-tv'), event.target.checked)
        }

        async function setTvEnabled(slotId, enabled) {
          tvChecked[slotId] = enabled
          if (!window.louvorja || !window.louvorja.palco) return
          var state = await window.louvorja.projection.getPlaybackState()
          if (state && state.projecting) networkProjectionActive = true
          if (enabled && networkProjectionActive) {
            var media = await window.louvorja.projection.getSourceMediaInfo()
            if (media && (media.filePath || media.youtubeId)) {
              var st = await window.louvorja.projection.getPlaybackState().catch(function () { return null })
              await tvSendMedia(slotId, media, st ? Math.round(st.currentTime * 1000) : 0, st && st.paused)
            }
          } else if (!enabled && networkProjectionActive) {
            if (networkMirrorSender) await networkMirrorSender.remove(slotId)
            await window.louvorja.palco.send(
              { v: 2, type: 'video', action: 'stop' },
              slotId,
            )
          }
          tvRenderList()
          await refresh()
        }

        async function loadMonitors() {
          if (audioOnly) return
          if (!window.louvorja) return
          var list =
            window.louvorja.displays && window.louvorja.displays.list
              ? (await window.louvorja.displays.list()) || []
              : []
          displays = list.map(function (display, index) {
            return {
              id: display.id,
              label: 'Monitor ' + (index + 1),
              resolution: display.bounds
                ? display.bounds.width + ' × ' + display.bounds.height
                : '',
              isPrimary: Boolean(display.isPrimary),
            }
          })

          if (
            window.louvorja.projection &&
            window.louvorja.projection.getVideoTargetMonitors
          ) {
            selectedIds =
              (await window.louvorja.projection.getVideoTargetMonitors()) || []
          }
          updateMonitorBadge()
          renderMonitorList()
          await refresh()
        }

        async function setPanelOpen(open) {
          panelOpen = Boolean(open)
          shell.classList.toggle('is-panel-open', panelOpen)
          monitorBtn.setAttribute('aria-expanded', panelOpen ? 'true' : 'false')
          if (
            window.louvorja &&
            window.louvorja.projection &&
            window.louvorja.projection.setSiteControlPanelOpen
          ) {
            await window.louvorja.projection.setSiteControlPanelOpen(panelOpen)
          }
          if (panelOpen) await loadMonitors()
          if (panelOpen) loadTvs()
        }

        async function onToggleMonitor(event) {
          var input = event.target
          var id = Number(input.getAttribute('data-id'))
          if (!Number.isFinite(id)) return
          await setMonitorEnabled(id, input.checked)
        }

        async function setMonitorEnabled(id, enabled) {
          if (enabled) {
            if (selectedIds.indexOf(id) < 0) selectedIds.push(id)
          } else {
            selectedIds = selectedIds.filter(function (item) {
              return item !== id
            })
          }
          updateMonitorBadge()
          renderMonitorList()
          if (
            window.louvorja &&
            window.louvorja.projection &&
            window.louvorja.projection.setVideoTargetMonitors
          ) {
            await window.louvorja.projection.setVideoTargetMonitors(
              selectedIds.slice(),
            )
            if (networkProjectionActive && selectedIds.length > 0) {
              var state = await window.louvorja.projection.getPlaybackState()
              if (state && !state.projecting) await window.louvorja.projection.toggleVideoScreens()
            }
          }
          await refresh()
        }

        function setCaptionsUi(hidden) {
          captionsHidden = Boolean(hidden)
          var label = captionsHidden ? 'Mostrar legendas' : 'Ocultar legendas'
          captionsBtn.title = label
          captionsBtn.setAttribute('aria-label', label)
          captionsBtn.setAttribute('aria-pressed', String(captionsHidden))
          captionsIcon.style.textDecoration = captionsHidden ? 'line-through' : 'none'
        }
        captionsBtn.addEventListener('click', toggleCaptions)
        async function toggleCaptions() {
          if (captionsBtn.disabled) return
          captionsBtn.disabled = true
          try {
            var state = await window.louvorja.projection.remoteSetCaptionsHidden(!captionsHidden)
            if (!state) return
            setCaptionsUi(state.captionsHidden)
            await tvBroadcast('captions', { captionsHidden: captionsHidden })
            await tvRerouteYoutube().catch(function () { /* TV fora do ar segue como estava */ })
          } finally { captionsBtn.disabled = false }
        }

        async function refresh() {
          if (!window.louvorja || !window.louvorja.projection) return
          var state = await window.louvorja.projection.getPlaybackState()
          if (!state) return
          if (!changingAudioOutput && state.audioOutput) { audioOutputMode = state.audioOutput; audioOutput.value = state.audioOutput }
          captionsBtn.hidden = !state.canControlCaptions
          if (state.canControlCaptions) setCaptionsUi(state.captionsHidden)
          playIcon.textContent = state.paused ? '▶' : '❚❚'
          if (typeof state.volume === 'number' || typeof state.muted === 'boolean') {
            setVolumeUi(
              typeof state.volume === 'number' ? state.volume : lastAudibleVolume,
              state.muted,
            )
          }
          if (typeof state.projecting === 'boolean') {
            setProjectingUi(state.projecting)
          }
          var duration = finiteTime(state.duration)
          if (!seeking && duration > 0) {
            seek.value = String(Math.round((state.currentTime / duration) * 1000))
          }
          timeEl.textContent = fmt(state.currentTime) + ' / ' + fmt(duration)
        }

        playBtn.addEventListener('click', async function () {
          if (!window.louvorja || !window.louvorja.projection) return
          var state = await window.louvorja.projection.getPlaybackState()
          if (state && !state.paused) {
            await window.louvorja.projection.remotePause()
            await tvBroadcast('pause')
          } else {
            await window.louvorja.projection.remotePlay()
            await tvBroadcast('play')
          }
          refresh()
        })

        muteBtn.addEventListener('click', async function () {
          if (!window.louvorja || !window.louvorja.projection) return
          if (typeof window.louvorja.projection.remoteToggleMute !== 'function') {
            return
          }
          var result = await window.louvorja.projection.remoteToggleMute()
          if (result) {
            setVolumeUi(
              typeof result.volume === 'number' ? result.volume : lastAudibleVolume,
              result.muted,
            )
          } else {
            refresh()
          }
        })

        projectBtn.addEventListener('click', toggleProjection)
        async function toggleProjection() {
          if (projectBtn.disabled) return
          if (!window.louvorja || !window.louvorja.projection) return
          if (typeof window.louvorja.projection.toggleVideoScreens !== 'function') {
            return
          }
          var state = await window.louvorja.projection.getPlaybackState()
          var stopping = Boolean((state && state.projecting) || networkProjectionActive)
          if ((stopping && state && state.projecting) || (!stopping && selectedIds.length > 0)) {
            await window.louvorja.projection.toggleVideoScreens()
          }
          if (stopping) {
            await tvBroadcast('stop')
            if (networkMirrorSender) await networkMirrorSender.stop()
            networkProjectionActive = false
          } else {
            networkProjectionActive = true
            await loadTvs()
          }
          refresh()
        }

        monitorBtn.addEventListener('click', async function () {
          await setPanelOpen(!panelOpen)
        })

        identifyBtn.addEventListener('click', async function () {
          if (!window.louvorja || !window.louvorja.displays) return
          identifyBtn.disabled = true
          try {
            await window.louvorja.displays.identify()
            await loadMonitors()
          } finally {
            identifyBtn.disabled = false
          }
        })

        document.addEventListener(
          'pointerdown',
          function (event) {
            if (!panelOpen) return
            var target = event.target
            if (!(target instanceof Node)) return
            if (monitorBtn.contains(target) || monitorPanel.contains(target)) return
            setPanelOpen(false)
          },
          true,
        )

        if (
          window.louvorja &&
          window.louvorja.projection &&
          window.louvorja.projection.onVideoTargetsChanged
        ) {
          window.louvorja.projection.onVideoTargetsChanged(function (ids) {
            selectedIds = Array.isArray(ids) ? ids.slice() : []
            updateMonitorBadge()
            if (panelOpen) renderMonitorList()
          })
        }

        /* remote-controls:start */
        // Controle remoto: mesmo caminho do clique, para valerem as regras de
        // cada botão e o aviso às TVs do Palco.
        window.__videoControlSnapshot = async function () {
          if (audioOnly) return null
          var projection = window.louvorja.projection
          var state = await projection.getPlaybackState()
          if (!state) return null
          var list = (await window.louvorja.displays.list()) || []
          var selected = (await projection.getVideoTargetMonitors()) || []
          var slots = window.louvorja.palco ? (await window.louvorja.palco.slots()) || [] : []
          var monitors = []
          list.forEach(function (display, index) {
            if (display.isPrimary) return
            monitors.push({
              id: 'monitor:' + display.id,
              label: 'Monitor ' + (index + 1),
              detail: display.bounds ? display.bounds.width + ' × ' + display.bounds.height : '',
              selected: selected.indexOf(display.id) >= 0,
            })
          })
          var tvs = slots
            .filter(function (slot) { return slot.clients > 0 })
            .map(function (slot) {
              return { id: 'tv:' + slot.id, label: slot.label, selected: tvChecked[slot.id] !== false }
            })
          return {
            audioOutput: state.audioOutput,
            canProject: !projectBtn.disabled,
            projecting: Boolean(state.projecting || networkProjectionActive),
            canControlCaptions: Boolean(state.canControlCaptions),
            captionsHidden: Boolean(state.captionsHidden),
            monitors: monitors,
            tvs: tvs,
            independent: window.__independentControl
              ? await window.__independentControl.snapshot()
              : null,
          }
        }

        window.__videoControlCommand = async function (command) {
          switch (command.type) {
            case 'audio-output':
              if (['player', 'connections', 'both'].indexOf(command.mode) < 0) return false
              await applyAudioOutput(command.mode)
              return true
            case 'project':
              if (projectBtn.disabled) return false
              // Clique real: a projeção independente escuta o botão na captura.
              projectBtn.click()
              await new Promise(function (resolve) { setTimeout(resolve, 400) })
              return true
            case 'independent-mode':
              return window.__independentControl
                ? window.__independentControl.setMode(command.mode)
                : false
            case 'independent-target':
              return window.__independentControl
                ? window.__independentControl.setTarget(command.targetId, command.enabled === true)
                : false
            case 'captions':
              if (captionsBtn.hidden) return false
              await toggleCaptions()
              return true
            case 'target': {
              var parts = String(command.targetId).split(':')
              if (parts[0] === 'monitor') {
                var monitorId = Number(parts[1])
                if (!Number.isFinite(monitorId)) return false
                await loadMonitors()
                await setMonitorEnabled(monitorId, command.enabled === true)
                return true
              }
              if (parts[0] === 'tv' && parts[1]) {
                await setTvEnabled(parts[1], command.enabled === true)
                return true
              }
              return false
            }
            default:
              return false
          }
        }
        /* remote-controls:end */

        async function applyVolume() {
          if (!window.louvorja || !window.louvorja.projection) return
          if (typeof window.louvorja.projection.remoteSetVolume !== 'function') {
            return
          }
          var value = Number(volume.value) / 100
          var result = await window.louvorja.projection.remoteSetVolume(value)
          if (result) {
            setVolumeUi(result.volume, result.muted)
          }
        }

        volume.addEventListener('pointerdown', function () {
          adjustingVolume = true
        })
        volume.addEventListener('pointerup', async function () {
          adjustingVolume = false
          await applyVolume()
        })
        volume.addEventListener('input', function () {
          var value = Number(volume.value) / 100
          setMuteUi(value <= 0)
          if (value > 0) lastAudibleVolume = value
        })
        volume.addEventListener('change', async function () {
          adjustingVolume = false
          await applyVolume()
        })

        seek.addEventListener('pointerdown', function () {
          seeking = true
        })
        async function applySeek() {
          seeking = false
          if (!window.louvorja || !window.louvorja.projection) return
          var state = await window.louvorja.projection.getPlaybackState()
          var duration = finiteTime(state && state.duration)
          if (!duration) return
          var t = (Number(seek.value) / 1000) * duration
          await window.louvorja.projection.remoteSeek(t)
          await tvBroadcast('seek', { position: t })
          refresh()
        }
        seek.addEventListener('pointerup', applySeek)
        seek.addEventListener('change', function () { if (!seeking) void applySeek() })

        setInterval(function () { refresh(); tvSyncPosition() }, 400)
        loadMonitors()
        loadTvs()
        refresh()
      })()
    </script>
    <script src="independent-panel.js"></script>
    <script>
      window.PianoIndependentPanel && window.PianoIndependentPanel.mount()
    </script>
  </body>
</html>
