<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vídeo local — LouvorJA - PIANO</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0a0c;
      }
      #stage {
        position: relative;
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        background: #0a0a0c;
      }
      video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center center;
        background: #000;
      }
      video.is-audio {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
      }
      #viz {
        display: none;
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #viz.is-visible {
        display: block;
      }
      #track {
        display: none;
        position: absolute;
        left: 1.25rem;
        right: 1.25rem;
        top: 1.1rem;
        color: #f8fafc;
        font: 600 0.95rem/1.35 system-ui, sans-serif;
        text-align: center;
        letter-spacing: 0.01em;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.65);
        pointer-events: none;
      }
      #track.is-visible {
        display: block;
      }
      #error {
        display: none;
        max-width: 28rem;
        padding: 1rem 1.25rem;
        color: #f8fafc;
        font: 500 0.95rem/1.4 system-ui, sans-serif;
        text-align: center;
      }
      #error.is-visible {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="viz"></canvas>
      <p id="track"></p>
      <video
        id="player"
        playsinline
        autoplay
        preload="auto"
      ></video>
      <p id="error">Não foi possível carregar o vídeo local.</p>
    </div>
    <script>
      ;(() => {
        const params = new URLSearchParams(window.location.search)
        const src = params.get('src') || ''
        const title = (params.get('title') || '').trim()
        const forceAudio = params.get('audio') === '1'
        const video = document.getElementById('player')
        const error = document.getElementById('error')
        const canvas = document.getElementById('viz')
        const track = document.getElementById('track')
        const ctx = canvas?.getContext('2d')

        const WHITE_KEYS = 21
        const WHITE_SEMIS = [0, 2, 4, 5, 7, 9, 11]
        let audioCtx = null
        let analyser = null
        let freqData = null
        let raf = 0
        let audioMode = forceAudio

        if (!src || !video) {
          if (error) error.classList.add('is-visible')
          if (video) video.style.display = 'none'
          return
        }

        function fileNameFromSrc(url) {
          try {
            const name = decodeURIComponent(new URL(url, location.href).pathname)
              .split('/')
              .pop()
            return name || ''
          } catch {
            return ''
          }
        }

        function showAudioStage() {
          audioMode = true
          video.classList.add('is-audio')
          canvas?.classList.add('is-visible')
          const label = title || fileNameFromSrc(src)
          if (track && label) {
            track.textContent = label
            track.classList.add('is-visible')
          }
          resizeCanvas()
          startViz()
        }

        function resizeCanvas() {
          if (!canvas) return
          const dpr = Math.max(1, window.devicePixelRatio || 1)
          const width = canvas.clientWidth || window.innerWidth
          const height = canvas.clientHeight || window.innerHeight
          canvas.width = Math.floor(width * dpr)
          canvas.height = Math.floor(height * dpr)
          ctx?.setTransform(dpr, 0, 0, dpr, 0, 0)
        }

        function ensureAnalyser() {
          if (analyser || !audioMode) return
          const AC = window.AudioContext || window.webkitAudioContext
          if (!AC) return
          try {
            audioCtx = new AC()
            const source = audioCtx.createMediaElementSource(video)
            analyser = audioCtx.createAnalyser()
            analyser.fftSize = 256
            analyser.smoothingTimeConstant = 0.82
            source.connect(analyser)
            analyser.connect(audioCtx.destination)
            freqData = new Uint8Array(analyser.frequencyBinCount)
          } catch {
            analyser = null
          }
        }

        function fillRoundRect(x, y, w, h, r) {
          ctx.beginPath()
          if (typeof ctx.roundRect === 'function') ctx.roundRect(x, y, w, h, r)
          else ctx.rect(x, y, w, h)
          ctx.fill()
        }

        function keyEnergy(index, count) {
          if (analyser && freqData && !video.paused) {
            analyser.getByteFrequencyData(freqData)
            const min = 2
            const max = Math.max(min + 1, Math.floor(freqData.length * 0.7))
            const t = index / Math.max(1, count - 1)
            const bin = Math.min(max, Math.floor(min * Math.pow(max / min, t)))
            const next = freqData[Math.min(freqData.length - 1, bin + 1)] || 0
            return ((freqData[bin] || 0) * 0.72 + next * 0.28) / 255
          }
          const wave = Date.now() / 380
          return 0.1 + 0.12 * (0.5 + 0.5 * Math.sin(wave + index * 0.45))
        }

        function drawPiano(width, height) {
          const keyboardH = Math.min(168, height * 0.38)
          const keyboardW = Math.min(width * 0.88, 860)
          const left = (width - keyboardW) / 2
          const top = height - keyboardH - height * 0.07
          const whiteW = keyboardW / WHITE_KEYS
          const blackW = whiteW * 0.56
          const blackH = keyboardH * 0.58
          const front = 11
          const press = 4

          ctx.fillStyle = '#0e0c10'
          fillRoundRect(left - 18, top - 28, keyboardW + 36, keyboardH + 42, 16)
          const wood = ctx.createLinearGradient(left, top - 28, left, top + 4)
          wood.addColorStop(0, '#3a2a1c')
          wood.addColorStop(0.55, '#241810')
          wood.addColorStop(1, '#1a120c')
          ctx.fillStyle = wood
          fillRoundRect(left - 12, top - 22, keyboardW + 24, 26, 8)
          ctx.fillStyle = 'rgba(255, 210, 0, 0.16)'
          ctx.font = `600 ${Math.max(11, Math.round(keyboardH * 0.11))}px system-ui, sans-serif`
          ctx.textAlign = 'center'
          ctx.fillText('PIANO', width / 2, top - 7)

          for (let i = 0; i < WHITE_KEYS; i += 1) {
            const energy = Math.max(0.03, Math.min(1, keyEnergy(i, WHITE_KEYS)))
            const down = energy > 0.48 ? press * Math.min(1, (energy - 0.48) / 0.35) : 0
            const x = left + i * whiteW
            const y = top + down
            const h = keyboardH - down
            const bodyH = h - front

            const shade = ctx.createLinearGradient(x, y, x, y + bodyH)
            shade.addColorStop(0, '#fffcf6')
            shade.addColorStop(0.7, '#efe6d8')
            shade.addColorStop(1, '#d9cfc0')
            ctx.fillStyle = shade
            fillRoundRect(x + 1.2, y, whiteW - 2.4, bodyH, [3, 3, 0, 0])

            ctx.fillStyle = energy > 0.45
              ? `rgba(251, 146, 60, ${0.12 + (energy - 0.45) * 0.55})`
              : 'rgba(0, 0, 0, 0)'
            fillRoundRect(x + 1.2, y, whiteW - 2.4, bodyH, [3, 3, 0, 0])

            ctx.fillStyle = '#c4b8a6'
            fillRoundRect(x + 1.2, y + bodyH - 1, whiteW - 2.4, front + 1, [0, 0, 3, 3])
            ctx.fillStyle = 'rgba(255, 255, 255, 0.28)'
            ctx.fillRect(x + 3, y + 3, whiteW - 6, 2)
          }

          for (let i = 0; i < WHITE_KEYS - 1; i += 1) {
            const degree = i % 7
            if (WHITE_SEMIS[degree + 1] - WHITE_SEMIS[degree] !== 2) continue
            const energy = Math.max(0.03, Math.min(1, keyEnergy(i + 0.45, WHITE_KEYS)))
            const down = energy > 0.46 ? press * 0.65 : 0
            const x = left + (i + 1) * whiteW - blackW / 2
            const y = top + down
            const h = blackH - down
            const gloss = ctx.createLinearGradient(x, y, x + blackW, y + h)
            gloss.addColorStop(0, energy > 0.42 ? '#5a3a18' : '#2a2a30')
            gloss.addColorStop(0.35, energy > 0.42 ? '#fb923c' : '#141218')
            gloss.addColorStop(1, '#0a0a0c')
            ctx.fillStyle = gloss
            fillRoundRect(x, y, blackW, h, [2, 2, 3, 3])
            ctx.fillStyle = 'rgba(255, 255, 255, 0.14)'
            ctx.fillRect(x + 3, y + 3, blackW - 6, 2)
          }
        }

        function draw() {
          if (!ctx || !canvas) return
          const width = canvas.clientWidth || window.innerWidth
          const height = canvas.clientHeight || window.innerHeight
          ctx.clearRect(0, 0, width, height)

          let energy = 0
          for (let i = 0; i < WHITE_KEYS; i += 1) energy += keyEnergy(i, WHITE_KEYS)
          const pulse = energy / WHITE_KEYS

          const glow = ctx.createRadialGradient(
            width / 2,
            height * 0.42,
            20,
            width / 2,
            height * 0.42,
            height * (0.28 + pulse * 0.2),
          )
          glow.addColorStop(0, `rgba(251, 146, 60, ${0.1 + pulse * 0.16})`)
          glow.addColorStop(1, 'rgba(251, 146, 60, 0)')
          ctx.fillStyle = glow
          ctx.fillRect(0, 0, width, height)

          drawPiano(width, height)

          raf = requestAnimationFrame(draw)
        }

        function startViz() {
          if (raf) return
          draw()
        }

        video.src = src
        video.addEventListener('error', () => {
          error?.classList.add('is-visible')
          video.style.display = 'none'
          canvas?.classList.remove('is-visible')
        })

        video.addEventListener('loadedmetadata', () => {
          const hasPicture = video.videoWidth > 0 && video.videoHeight > 0
          if (!hasPicture) showAudioStage()
        })

        if (forceAudio) showAudioStage()

        video.addEventListener('ended', () => {
          try {
            window.louvorja?.projection?.notifyVideoEnded?.()
          } catch (e) {
            // sem preload: janela fecha só na mão
          }
        })

        video.addEventListener('play', () => {
          if (!audioMode) return
          ensureAnalyser()
          void audioCtx?.resume?.()
        })

        function disposeMedia() {
          cancelAnimationFrame(raf)
          video.pause()
          video.removeAttribute('src')
          video.load()
          if (audioCtx && audioCtx.state !== 'closed') void audioCtx.close().catch(function () {})
        }
        window.addEventListener('pagehide', disposeMedia, { once: true })
        window.addEventListener('beforeunload', disposeMedia, { once: true })
        window.addEventListener('resize', resizeCanvas)

        const play = () => {
          void video.play().catch(() => {})
        }
        if (video.readyState >= 2) play()
        else video.addEventListener('loadeddata', play, { once: true })
      })()
    </script>
  </body>
</html>
