<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PDF — LouvorJA - PIANO</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #stage {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        background: #000;
      }
      #frame {
        background: #000;
        user-select: none;
        will-change: transform;
      }
      body.is-zoomed #stage { cursor: grab; }
      body.is-panning #stage { cursor: grabbing; }
      #error {
        display: none;
        color: #f8fafc;
        font: 500 0.95rem/1.4 system-ui, sans-serif;
        text-align: center;
        padding: 1rem;
      }
      #error.is-visible { display: block; }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="frame" aria-hidden="true"></canvas>
      <p id="error">Não foi possível carregar o PDF.</p>
    </div>
    <script src="zoom-pan.js"></script>
    <script type="module">
      import * as pdfjsLib from './vendor/pdfjs/pdf.min.mjs'

      pdfjsLib.GlobalWorkerOptions.workerSrc = new URL(
        './vendor/pdfjs/pdf.worker.min.mjs',
        import.meta.url,
      ).href

      const params = new URLSearchParams(window.location.search)
      const src = (params.get('src') || '').trim()
      const canvas = document.getElementById('frame')
      const error = document.getElementById('error')
      const context = canvas?.getContext('2d', { alpha: false })

      let pdfDoc = null
      let pageIndex = 0
      let renderToken = 0
      let activeRenderTask = null
      let renderedToken = -1
      let exportCache = null
      const thumbnailCache = new Map()

      const stage = document.getElementById('stage')

      // Zoom (zoom-pan.js): com zoom a página é redesenhada em resolução maior,
      // para o texto continuar nítido; o encaixe na tela não muda.
      const MAX_CANVAS_SIDE = 8192
      let renderedQuality = 1
      let lastFit = 1
      let renderedStageSize = ''
      let qualityTimer = 0
      function qualityFor(view) {
        return Math.min(4, Math.max(1, Math.ceil(view.zoom * 2) / 2))
      }
      const zoom = window.PianoZoomPan.create({
        stage,
        target: canvas,
        enabled: () => Boolean(pdfDoc),
        onChange: (view) => {
          if (qualityFor(view) === renderedQuality) return
          clearTimeout(qualityTimer)
          qualityTimer = setTimeout(() => { if (pdfDoc) void renderPage(pageIndex) }, 150)
        },
      })

      function state() {
        return {
          index: pageIndex,
          total: pdfDoc ? pdfDoc.numPages : 0,
          view: zoom.getView(),
        }
      }

      function showError(visible) {
        error?.classList.toggle('is-visible', Boolean(visible))
        if (canvas) canvas.style.display = visible ? 'none' : 'block'
      }

      async function renderPage(nextIndex) {
        if (!pdfDoc || !canvas || !context) {
          showError(true)
          return state()
        }

        const total = pdfDoc.numPages
        // Fim da apresentação: avançar no ÚLTIMO slide encerra a projeção
        // (autoclose — TVs voltam ao idle). Prev segue cíclico (1 → último).
        if (nextIndex >= total) {
          try { window.louvorja?.projection?.notifyVideoEnded?.() } catch (e) { /* sem preload */ }
          return state()
        }
        if (nextIndex < 0) nextIndex = total - 1
        // outra página começa inteira; redesenhar a mesma não perde o zoom
        if (nextIndex !== pageIndex) zoom.reset()
        pageIndex = nextIndex
        const token = ++renderToken
        const page = await pdfDoc.getPage(pageIndex + 1)
        if (token !== renderToken) return state()

        // O PDF.js só permite uma renderização ativa por página/canvas: a
        // anterior (ex.: zoom mudou de novo) é cancelada antes desta começar.
        if (activeRenderTask) {
          const previous = activeRenderTask
          previous.cancel()
          try { await previous.promise } catch (error) {
            if (error?.name !== 'RenderingCancelledException') throw error
          }
        }
        if (token !== renderToken) return state()

        const maxWidth = Math.max(1, stage?.clientWidth || window.innerWidth || 1)
        const maxHeight = Math.max(1, stage?.clientHeight || window.innerHeight || 1)
        const stageSizeChanged = maxWidth + 'x' + maxHeight !== renderedStageSize
        renderedStageSize = maxWidth + 'x' + maxHeight
        const base = page.getViewport({ scale: 1 })
        const fit = Math.max(0.1, Math.min(maxWidth / base.width, maxHeight / base.height))
        const wanted = qualityFor(zoom.getView())
        const longSide = Math.max(base.width, base.height) * fit
        const quality = Math.max(1, Math.min(wanted, MAX_CANVAS_SIDE / Math.max(1, longSide)))
        const viewport = page.getViewport({ scale: fit * quality })

        // Desenha fora da tela e troca de uma vez: mexer no tamanho do canvas
        // visível o apaga, e a página "piscava" a cada redesenho do zoom.
        const buffer = document.createElement('canvas')
        buffer.width = Math.floor(viewport.width)
        buffer.height = Math.floor(viewport.height)
        const bufferContext = buffer.getContext('2d', { alpha: false })
        if (!bufferContext) return state()
        const task = page.render({ canvasContext: bufferContext, viewport })
        activeRenderTask = task
        try {
          await task.promise
        } catch (error) {
          if (error?.name !== 'RenderingCancelledException') throw error
          return state()
        } finally {
          if (activeRenderTask === task) activeRenderTask = null
        }
        if (token !== renderToken) return state()

        canvas.width = buffer.width
        canvas.height = buffer.height
        // o tamanho na tela é sempre o encaixe; a qualidade extra só nos pixels
        canvas.style.width = Math.floor(base.width * fit) + 'px'
        canvas.style.height = Math.floor(base.height * fit) + 'px'
        context.drawImage(buffer, 0, 0)
        // tela mudou de tamanho: reposiciona o zoom (sem animar a troca)
        if (stageSizeChanged) zoom.render()
        renderedQuality = wanted
        lastFit = fit
        showError(false)
        renderedToken = token

        return state()
      }

      async function ensureReady() {
        if (pdfDoc) return true
        if (!src) {
          showError(true)
          return false
        }
        try {
          pdfDoc = await pdfjsLib.getDocument(src).promise
          return true
        } catch {
          showError(true)
          pdfDoc = null
          return false
        }
      }

      window.__liturgyPdf = {
        getState() {
          return state()
        },
        // Export from the PDF itself, never enlarge the operator preview.
        // A 3840px long edge preserves fine text on high-resolution outputs.
        /**
         * PNG da página para o Palco. `{ full: true }`: página inteira (TVs
         * novas aplicam o zoom sozinhas); sem opção: só o recorte visível com
         * o zoom atual (TVs antigas, que não entendem a mensagem de zoom).
         */
        async capturePng(options) {
          if (!pdfDoc || renderedToken !== renderToken) return null
          const token = renderToken
          const view = options && options.full === true ? { zoom: 1, x: 0, y: 0 } : zoom.getView()
          const viewKey = view.zoom + ':' + view.x + ':' + view.y
          if (exportCache?.token === token && exportCache.viewKey === viewKey) return exportCache.promise
          const index = pageIndex
          const fit = lastFit
          const stageWidth = Math.max(1, stage?.clientWidth || 1)
          const stageHeight = Math.max(1, stage?.clientHeight || 1)
          const promise = (async () => {
            const page = await pdfDoc.getPage(index + 1)
            if (token !== renderToken) return null
            const base = page.getViewport({ scale: 1 })
            const crop = window.PianoZoomPan.visibleRegion(view, {
              stageWidth,
              stageHeight,
              contentWidth: base.width * fit,
              contentHeight: base.height * fit,
            })
            const cropWidth = (crop.right - crop.left) / fit
            const cropHeight = (crop.bottom - crop.top) / fit
            const scale = 3840 / Math.max(cropWidth, cropHeight)
            const viewport = page.getViewport({
              scale,
              offsetX: -(crop.left / fit) * scale,
              offsetY: -(crop.top / fit) * scale,
            })
            const flat = document.createElement('canvas')
            flat.width = Math.ceil(cropWidth * scale)
            flat.height = Math.ceil(cropHeight * scale)
            const flatCtx = flat.getContext('2d', { alpha: false })
            if (!flatCtx) return null
            flatCtx.fillStyle = '#ffffff'
            flatCtx.fillRect(0, 0, flat.width, flat.height)
            await page.render({ canvasContext: flatCtx, viewport, background: '#ffffff' }).promise
            if (token !== renderToken) return null
            return flat.toDataURL('image/png').split(',')[1] || null
          })().then(value => {
            if (!value && exportCache?.token === token) exportCache = null
            return value
          }).catch(() => {
            if (exportCache?.token === token) exportCache = null
            return null
          })
          exportCache = { token, viewKey, promise }
          return promise
        },
        // Renderiza em canvases separados: nunca muda a página projetada.
        async captureGalleryPreviews(maxWidth = 480) {
          if (!pdfDoc) return null
          const index = pageIndex
          const doc = pdfDoc
          const width = Math.max(64, Math.min(960, Number(maxWidth) || 480))
          const previews = Array(doc.numPages).fill('')
          for (const i of [index - 1, index, index + 1]) {
            if (i < 0 || i >= doc.numPages) continue
            const key = i + ':' + width
            if (!thumbnailCache.has(key)) {
              const promise = (async () => {
                const page = await doc.getPage(i + 1)
                const base = page.getViewport({ scale: 1 })
                const viewport = page.getViewport({ scale: width / base.width })
                const flat = document.createElement('canvas')
                flat.width = Math.ceil(viewport.width)
                flat.height = Math.ceil(viewport.height)
                const ctx = flat.getContext('2d', { alpha: false })
                if (!ctx) return ''
                await page.render({ canvasContext: ctx, viewport, background: '#ffffff' }).promise
                return flat.toDataURL('image/jpeg', 0.7).split(',')[1] || ''
              })().catch(() => { thumbnailCache.delete(key); return '' })
              thumbnailCache.set(key, promise)
              if (thumbnailCache.size > 12) thumbnailCache.delete(thumbnailCache.keys().next().value)
            }
            previews[i] = await thumbnailCache.get(key)
          }
          return { key: src + ':' + index + ':' + width, previews }
        },
        async next() {
          if (!(await ensureReady())) return state()
          return renderPage(pageIndex + 1)
        },
        async prev() {
          if (!(await ensureReady())) return state()
          return renderPage(pageIndex - 1)
        },
        async goTo(i) {
          if (!(await ensureReady())) return state()
          return renderPage(Number(i) || 0)
        },
        getView() {
          return zoom.getView()
        },
        setView(next) {
          return zoom.setView(next)
        },
      }

      // A área muda com a janela e quando o popup reserva a faixa da barra.
      let lastStageSize = ''
      function onStageResize() {
        const size = (stage?.clientWidth || 0) + 'x' + (stage?.clientHeight || 0)
        if (size === lastStageSize) return
        lastStageSize = size
        if (pdfDoc) void renderPage(pageIndex)
      }
      if (typeof ResizeObserver === 'function' && stage) new ResizeObserver(onStageResize).observe(stage)
      window.addEventListener('resize', onStageResize)

      ;(async () => {
        if (await ensureReady()) await renderPage(0)
      })()
    </script>
  </body>
</html>
