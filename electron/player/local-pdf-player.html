<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PDF — LouvorJA - PIANO</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #stage {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        background: #000;
      }
      #frame {
        max-width: 100%;
        max-height: 100%;
        background: #000;
      }
      #error {
        display: none;
        color: #f8fafc;
        font: 500 0.95rem/1.4 system-ui, sans-serif;
        text-align: center;
        padding: 1rem;
      }
      #error.is-visible { display: block; }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="frame" aria-hidden="true"></canvas>
      <p id="error">Não foi possível carregar o PDF.</p>
    </div>
    <script type="module">
      import * as pdfjsLib from './vendor/pdfjs/pdf.min.mjs'

      pdfjsLib.GlobalWorkerOptions.workerSrc = new URL(
        './vendor/pdfjs/pdf.worker.min.mjs',
        import.meta.url,
      ).href

      const params = new URLSearchParams(window.location.search)
      const src = (params.get('src') || '').trim()
      const canvas = document.getElementById('frame')
      const error = document.getElementById('error')
      const context = canvas?.getContext('2d', { alpha: false })

      let pdfDoc = null
      let pageIndex = 0
      let renderToken = 0
      let renderedToken = -1
      let exportCache = null
      const thumbnailCache = new Map()

      function state() {
        return {
          index: pageIndex,
          total: pdfDoc ? pdfDoc.numPages : 0,
        }
      }

      function showError(visible) {
        error?.classList.toggle('is-visible', Boolean(visible))
        if (canvas) canvas.style.display = visible ? 'none' : 'block'
      }

      async function renderPage(nextIndex) {
        if (!pdfDoc || !canvas || !context) {
          showError(true)
          return state()
        }

        const total = pdfDoc.numPages
        // Fim da apresentação: avançar no ÚLTIMO slide encerra a projeção
        // (autoclose — TVs voltam ao idle). Prev segue cíclico (1 → último).
        if (nextIndex >= total) {
          try { window.louvorja?.projection?.notifyVideoEnded?.() } catch (e) { /* sem preload */ }
          return state()
        }
        if (nextIndex < 0) nextIndex = total - 1
        pageIndex = nextIndex
        const token = ++renderToken
        const page = await pdfDoc.getPage(pageIndex + 1)
        if (token !== renderToken) return state()

        const stage = document.getElementById('stage')
        const maxWidth = Math.max(1, stage?.clientWidth || window.innerWidth || 1)
        const maxHeight = Math.max(1, stage?.clientHeight || window.innerHeight || 1)
        const base = page.getViewport({ scale: 1 })
        const scale = Math.min(maxWidth / base.width, maxHeight / base.height)
        const viewport = page.getViewport({ scale: Math.max(0.1, scale) })

        canvas.width = Math.floor(viewport.width)
        canvas.height = Math.floor(viewport.height)
        showError(false)

        await page.render({
          canvasContext: context,
          viewport,
        }).promise
        if (token === renderToken) renderedToken = token

        return state()
      }

      async function ensureReady() {
        if (pdfDoc) return true
        if (!src) {
          showError(true)
          return false
        }
        try {
          pdfDoc = await pdfjsLib.getDocument(src).promise
          return true
        } catch {
          showError(true)
          pdfDoc = null
          return false
        }
      }

      window.__liturgyPdf = {
        getState() {
          return state()
        },
        // Export from the PDF itself, never enlarge the operator preview.
        // A 3840px long edge preserves fine text on high-resolution outputs.
        async capturePng() {
          if (!pdfDoc || renderedToken !== renderToken) return null
          const token = renderToken
          if (exportCache?.token === token) return exportCache.promise
          const index = pageIndex
          const promise = (async () => {
            const page = await pdfDoc.getPage(index + 1)
            if (token !== renderToken) return null
            const base = page.getViewport({ scale: 1 })
            const viewport = page.getViewport({ scale: 3840 / Math.max(base.width, base.height) })
            const flat = document.createElement('canvas')
            flat.width = Math.ceil(viewport.width)
            flat.height = Math.ceil(viewport.height)
            const flatCtx = flat.getContext('2d', { alpha: false })
            if (!flatCtx) return null
            flatCtx.fillStyle = '#ffffff'
            flatCtx.fillRect(0, 0, flat.width, flat.height)
            await page.render({ canvasContext: flatCtx, viewport, background: '#ffffff' }).promise
            if (token !== renderToken) return null
            return flat.toDataURL('image/png').split(',')[1] || null
          })().then(value => {
            if (!value && exportCache?.token === token) exportCache = null
            return value
          }).catch(() => {
            if (exportCache?.token === token) exportCache = null
            return null
          })
          exportCache = { token, promise }
          return promise
        },
        // Renderiza em canvases separados: nunca muda a página projetada.
        async captureGalleryPreviews(maxWidth = 480) {
          if (!pdfDoc) return null
          const index = pageIndex
          const doc = pdfDoc
          const width = Math.max(64, Math.min(960, Number(maxWidth) || 480))
          const previews = Array(doc.numPages).fill('')
          for (const i of [index - 1, index, index + 1]) {
            if (i < 0 || i >= doc.numPages) continue
            const key = i + ':' + width
            if (!thumbnailCache.has(key)) {
              const promise = (async () => {
                const page = await doc.getPage(i + 1)
                const base = page.getViewport({ scale: 1 })
                const viewport = page.getViewport({ scale: width / base.width })
                const flat = document.createElement('canvas')
                flat.width = Math.ceil(viewport.width)
                flat.height = Math.ceil(viewport.height)
                const ctx = flat.getContext('2d', { alpha: false })
                if (!ctx) return ''
                await page.render({ canvasContext: ctx, viewport, background: '#ffffff' }).promise
                return flat.toDataURL('image/jpeg', 0.7).split(',')[1] || ''
              })().catch(() => { thumbnailCache.delete(key); return '' })
              thumbnailCache.set(key, promise)
              if (thumbnailCache.size > 12) thumbnailCache.delete(thumbnailCache.keys().next().value)
            }
            previews[i] = await thumbnailCache.get(key)
          }
          return { key: src + ':' + index + ':' + width, previews }
        },
        async next() {
          if (!(await ensureReady())) return state()
          return renderPage(pageIndex + 1)
        },
        async prev() {
          if (!(await ensureReady())) return state()
          return renderPage(pageIndex - 1)
        },
        async goTo(i) {
          if (!(await ensureReady())) return state()
          return renderPage(Number(i) || 0)
        },
      }

      window.addEventListener('resize', () => {
        if (pdfDoc) void renderPage(pageIndex)
      })

      ;(async () => {
        if (await ensureReady()) await renderPage(0)
      })()
    </script>
  </body>
</html>
