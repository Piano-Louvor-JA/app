<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>LouvorJA Palco</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0A0E1A;
    font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#fff}
  #bg{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;
    filter:brightness(.55);transition:opacity .8s}
  #bg[src=""]{opacity:0}
  #bgPalco{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover}
  #veil{position:fixed;inset:0;background:rgba(0,0,0,.45)}
  #content{position:fixed;top:0;left:0;right:0;bottom:0;padding:3vh 4vw;
    box-sizing:border-box}
  #text{position:absolute;top:50%;left:50%;
    /* Caixa encolhe até o texto como via cabo. display:table = shrink-to-fit
       compatível com Chromium antigo (webOS/Tizen) — fit-content em
       position:absolute colapsava no simulador (26/08). margin auto centra. */
    display:table;max-width:92vw;max-height:76vh;transform:translate(-50%,-50%);
    overflow-wrap:break-word;
    text-align:center;font-size:3.65vw;font-weight:700;line-height:1.25;
    letter-spacing:.03em;text-transform:uppercase;
    text-shadow:0 2px 12px rgba(0,0,0,.8)}
  /* F3.3m: estilos dinâmicos da letra (sombra/caixinha) */
  #text.shadow-on{text-shadow:var(--ts,0 3px 18px rgba(0,0,0,.8))}
  /* Caixinha no PADRÃO da projeção (StagePreview): canto folha
     1.4cqw 0 1.4cqw 0 (16:9 → ~2.7vh 0), borda fina 1px, padding
     justo ao texto (2cqw ≈ 3.8vh lateral, 2vh vertical). */
  #text.box-on{background:rgba(0,0,0,var(--box-bg,.45));
    /* Player: radius folha clamp(14px,2.4vmin,32px) 0, borda 0.2vmin e
       sombra suave. Padding apertado — caixa abraça o texto (vmin);
       WT-5f: menor ainda (Rafael 02/09) p/ versículo curto caber em linha. */
    padding:.9vmin 1.2vmin;
    border-radius:2.4vmin 0 2.4vmin 0;
    border:var(--box-border,.2vmin solid rgba(255,255,255,.25));
    box-shadow:0 10px 30px rgba(0,0,0,.4)}
  #text.shadow-off{text-shadow:none}
  /* Capa da música (isCover): título destaque amarelo, sem caixinha/borda —
     paridade com media-projection__title--cover via cabo. */
  #text.cover-on{text-transform:uppercase;font-weight:900;letter-spacing:.03em;
    color:#f6c32a;background:none;padding:0;border:none;box-shadow:none;
    border-radius:0;line-height:1.1}
  #text.box-off{background:none;padding:0;border:none;box-shadow:none}

  #footer{position:fixed;bottom:4vh;left:0;right:0;text-align:center;
    font-size:2.6vh;font-weight:300;opacity:1;letter-spacing:.02em}
  /* F3.3m: referência da passagem destacada + versão ao lado.
     WT-5f paridade popup: MAIÚSCULAS + letter-spacing + sem opacidade. */
  #footer .ref{font-weight:var(--ref-weight,600);color:var(--ref-color,#FCCE02);
    text-transform:uppercase;letter-spacing:.02em}
  #footer .ver{font-weight:300;opacity:.65;margin-left:1.2vh;font-size:.85em;
    text-transform:none;letter-spacing:0}
  #idle{position:fixed;top:0;left:0;right:0;bottom:0;z-index:10;
    text-align:center;transition:opacity .5s}
  #idleCenter{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    text-align:center;width:60vw}
  #idle.hidden{opacity:0;pointer-events:none}
  #idleLogos img,#idleLogos svg{display:block;margin:0 auto}
  #idleLogo{height:14vh;max-width:50vw;margin:0 auto 4vh auto}#idleLogo svg{width:100%;height:100%;display:block}
  /* F3.3n: wordmark "Louvor JA" — identidade fixa, não personalizável. */
  #idleWordmark{font-size:3.6vh;font-weight:300;letter-spacing:.8vh;
    color:#fff;opacity:.92;margin:0 0 3vh 0;text-transform:none}
  #idleCodenameWrap{height:6vh;max-width:44vw;margin:0 auto}
  #idleCodenameWrap svg{width:100%;height:100%;color:#fff;opacity:.9;display:block}
  #bars{margin:4vh auto 0 auto}
  #bars div{width:5vh;height:1.2vh;display:inline-block;margin:0 .5vh}
  #idle p{font-size:2.5vh;opacity:.6;margin:3vh 0 0 0}
  /* Diagnóstico só via ?debug=1; nunca poluir o telão em produção. */
  #status{display:none;position:fixed;top:2vh;right:2vw;font-size:2vh;opacity:.65;z-index:20}
  body.debug #status{display:block}
  #status.err{color:#ff6766}
          #np{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    text-align:center;width:80vw}
  #npCover{width:22vh;height:22vh;object-fit:cover;border-radius:2vh;
    margin:0 auto 3vh auto;display:block;box-shadow:0 4px 24px rgba(0,0,0,.6)}
  #npTitle{font-size:4.5vh;font-weight:600;text-shadow:0 2px 12px rgba(0,0,0,.8)}
  #npSub{font-size:2.5vh;font-weight:300;opacity:.7;margin-top:1vh}
  #npEq{display:inline-block;margin-top:2.5vh}
  #npEq span{display:inline-block;width:1vh;background:#00C1E6;margin:0 .3vh;
    animation:eq 1s ease-in-out infinite}
  #npEq span:nth-child(2){animation-delay:.2s}
  #npEq span:nth-child(3){animation-delay:.4s}
  @keyframes eq{0%,100%{height:1vh}50%{height:3vh}}
  #timer{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    text-align:center;width:84vw;font-size:16vh;font-weight:700;
    font-variant-numeric:tabular-nums;text-shadow:0 2px 12px rgba(0,0,0,.8)}
  #timer small{display:block;font-size:2.8vh;font-weight:300;opacity:.7;margin-top:2vh}
  /* Vídeo acima do idle (z=20) — idle nunca pode cobrir reprodução. */
  #video{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:contain;
    background:#000;z-index:20}
</style>
</head>

<!-- F3.3j: splash screen — some no WS OPEN ou 2.5s -->
<div id="splash" style="position:fixed;inset:0;z-index:200;background:#0A0E1A;
  display:flex;align-items:center;justify-content:center;transition:opacity .6s">
  <img src="splash.jpg" alt="Palco Piano LouvorJA" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">
</div>
<script>
(function(){
  var s=document.getElementById('splash');
  function hide(){if(!s)return;s.style.opacity='0';
    setTimeout(function(){s&&s.remove()},700);s=null}
  setTimeout(hide,2500);
  window.__hideSplash=hide;
})();
</script>

    .catch(function(e){setStatus('nuvem: '+e.message,true);cloudRetry()});
}
function cloudOpen(code,token){
  var session=/^[A-Z0-9]{6}$/.exec(String(code||'').toUpperCase());
  if(!session){cloudRetry();return}
  session=session[0];
  setStatus('nuvem: conectando…');
  var cid='';
  try{cid=localStorage.getItem('palcoCloudCid')||''}catch(e){}
  if(!cid){cid='tv-'+Math.random().toString(36).slice(2,10);try{localStorage.setItem('palcoCloudCid',cid)}catch(e){}}
  try{ws=new WebSocket(cloudWsBase()+'/relay/'+encodeURIComponent(session)+'?token='+encodeURIComponent(String(token||''))+'&role=receiver&cid='+encodeURIComponent(cid))}
  catch(e){cloudRetry();return}
  ws.onopen=function(){tries=0;dlog('CLOUD WS OPEN',session);
    setStatus('● nuvem '+session);
    if(window.__hideSplash)window.__hideSplash();
    try{localStorage.setItem('palcoCloudCode',session)}catch(e){}};
  ws.onmessage=function(ev){try{handle(JSON.parse(ev.data))}catch(e){}};
  ws.onclose=function(ev){
    dlog('CLOUD WS CLOSE',ev&&ev.code);
    stopMediaOnServerLoss();showIdle();
    if(ev&&ev.code===4404){setStatus('sessão inválida — tecla vermelha p/ novo código',true);cloudMode=false;return}
    // 4409 = join recusado (ex.: sessão recém-recriada) — reseta backoff pra
    // tentar de novo rápido em vez de esperar 10s crescendo.
    if(ev&&(ev.code===4409||ev.code===4400)){tries=0}
    cloudRetry()};
  ws.onerror=function(){};
}
function cloudRetry(){
  var wait=Math.min(1000*Math.pow(2,tries++),10000);
  setStatus('nuvem: reconectando em '+Math.round(wait/1000)+'s',true);
  cloudTimer=setTimeout(function(){if(cloudMode&&cloudCode)cloudConnect(cloudCode)},wait);
}

// ===== WT-5 fluxo streaming: TV cria a sessão =====
// OK com campo vazio no overlay → POST /v1/palco/sessions → TV conecta como
// receiver e MOSTRA o código + QR no idle. O operador abre o web, informa o
// código (ou escaneia) e projeta. Padrão YouTube/Netflix.
function cloudCreate(){
  cloudMode=true;cloudCode='';
  var base=cloudHttpBase();
  setStatus('nuvem: criando sessão…');
  fetch(base+'/sessions',{method:'POST'})
    .then(function(r){if(!r.ok)throw Error('falha ao criar sessão');return r.json()})
    .then(function(j){
      var created=/^[A-Z0-9]{6}$/.exec(String(j.code||'').toUpperCase());
      if(!created)throw Error('sessão inválida');
      cloudCode=created[0];
      try{localStorage.setItem('palcoCloudCode',cloudCode)}catch(e){}
      showCloudPair(cloudCode);
      cloudOpen(cloudCode,j.token);
    })
    .catch(function(e){setStatus('nuvem: '+e.message,true);cloudMode=false;retry()});
}

    var qr=qrcode(0,'M');           // typeNumber 0 = auto
    qr.addData(url);
    qr.make();
    var count=qr.getModuleCount();
    var px=Math.max(3,Math.floor(200/count));
    var t=document.createElement('canvas');
    t.width=count*px;t.height=count*px;
    var ctx=t.getContext('2d');
    ctx.fillStyle='#fff';ctx.fillRect(0,0,t.width,t.height);
    ctx.fillStyle='#000';
    for(var y=0;y<count;y++)for(var x=0;x<count;x++)if(qr.isDark(y,x))ctx.fillRect(x*px,y*px,px,px);
    t.style.width='22vh';t.style.height='22vh';t.style.borderRadius='1vh';t.style.background='#fff';
    wrap.appendChild(t);
  }catch(e){dlog('QR falhou (código em texto segue):',e&&e.message)}

// ===== F3.3u: entrada de IP manual via controle remoto =====
// Tecla vermelha (403) ou "0" no idle abre overlay pra digitar IP do celular.
var ipEntry=null;
function openIpEntry(){
  if(ipEntry)return;
  ipEntry=document.createElement('div');
  ipEntry.style.cssText='position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.85);'+
    'display:flex;align-items:center;justify-content:center';
  ipEntry.innerHTML='<div style="text-align:center">'+
    '<p style="font-size:2.6vh;opacity:.7;margin:0 0 2vh 0">CÓDIGO (6 letras/números) · IP · IP:PORTA — ou SÓ A PORTA (ex.: 7081) para achar o LouvorJA na rede</p>'+
    '<p id="ipVal" style="font-size:6vh;font-weight:700;letter-spacing:.5vh;margin:0;'+
    'min-height:7vh;border-bottom:.3vh solid #FCCE02;padding:0 4vh"></p>'+
    '<p style="font-size:1.8vh;opacity:.5;margin:2vh 0 0 0">OK conectar · vermelha cancelar · backspace apaga</p></div>';
  document.body.appendChild(ipEntry);
  ipEntry._val='';
  renderIp();
}
function renderIp(){var el=document.getElementById('ipVal');if(el)el.textContent=ipEntry._val||''}
function closeIpEntry(){if(ipEntry){ipEntry.remove();ipEntry=null}}
function submitIp(){
  var v=(ipEntry&&ipEntry._val)||'';
  // WT-5 (fluxo streaming): OK com campo VAZIO = TV CRIA a sessão e vira
  // receiver esperando o operador conectar (padrão YouTube/Netflix — o
  // dispositivo grande mostra o código, o operador informa no web).
  if(!v){
    tries=0;closeIpEntry();
    try{if(ws)ws.close()}catch(e){}
    cloudCreate();
    return;
  }
  // WT-5d: 6 alfanuméricos SEM ponto e SEM só-dígitos-curto = CÓDIGO CLOUD.
  // A TV conecta no relay WS da API (role=receiver) em vez do IP do desktop —
  // mesmo protocolo do receiver browser cloud (browser/index.html).
  if(/^[A-Za-z0-9]{6}$/.test(v)){
    tries=0;closeIpEntry();
    try{if(ws)ws.close()}catch(e){}
    cloudConnect(v.toUpperCase());
    return;
  }
  // Só dígitos (2-5) = PORTA: o sender é achado por scan com essa porta
  // (usuário não decora IP; nova TV na rede de igreja conecta fácil).
  if(/^\d{2,5}$/.test(v)&&!/\./.test(v)){
    port=v;localStorage.setItem('palcoPort',port);tries=0;closeIpEntry();
    try{if(ws)ws.close()}catch(e){}
    host='';localStorage.removeItem('palcoHost');
    setStatus('procurando LouvorJA na porta '+port+'…');
    scanSubnet();
    return;
  }
  // Multi-palco: aceita IP ou IP:PORTA (ex: 192.168.1.50:7083).
  var parts=v.split(':');
  host=parts[0];localStorage.setItem('palcoHost',host);
  if(parts[1]&&parseInt(parts[1],10)>0){
    port=String(parseInt(parts[1],10));localStorage.setItem('palcoPort',port);
  }
  tries=0;
  closeIpEntry();
  try{if(ws)ws.close()}catch(e){}
  // IP manual conecta WS DIRETO — sem probeSender (fetch /status pode ser
  // bloqueado em app empacotado webOS; WS não sofre CORS).
  doConnect();
}
window.addEventListener('keydown',function(e){
  var k=e.keyCode;
  if(ipEntry){
    e.preventDefault();e.stopPropagation();
    if(k===13||k===4063){submitIp()}                       // OK / Enter
    else if(k===461||k===8||k===463){                      // backspace
      ipEntry._val=ipEntry._val.slice(0,-1);renderIp()}
    else if(k>=48&&k<=57){                                  // 0-9
      if(ipEntry._val.length<15){ipEntry._val+=String(k-48);renderIp()}}
    else if(k>=96&&k<=105){                                 // numpad
      if(ipEntry._val.length<15){ipEntry._val+=String(k-96);renderIp()}}
    else if(k===46||k===190||k===110){                      // ponto
      if(ipEntry._val.length<15){ipEntry._val+='.';renderIp()}}
    // WT-5d: letras A-Z — código cloud é 6 alfanuméricos. keyCode 65-90.
    else if(k>=65&&k<=90){
      if(ipEntry._val.length<15){ipEntry._val+=String.fromCharCode(k);renderIp()}}
    else if(k===403||k===27){closeIpEntry()}                // vermelha/ESC
    return;
  }
  // Azul (406): refresh do Palco. Útil quando sender/slot reiniciou ou
  // replay ficou stale — força novo boot, scan e conexão WS sem alterar
  // host/porta persistidos. Vermelho continua reservado a IP/porta manual.
  if(k===406){
    e.preventDefault();
    try{if(ws)ws.close()}catch(e){}
    location.reload();
    return;
  }
  // Verde (404): para qualquer mídia local e volta ao idle. O operador da
  // TV recupera a tela sem depender do sender (ex: mídia presa/congelada).
  if(k===404){
    e.preventDefault();
    {const a=$('audio');a.pause();a.removeAttribute('src');a.load();}
    {const v=$('video');v.pause();v.removeAttribute('src');v.style.display='none';v.load();}
    hideNp();
    showIdle('Aguardando conteúdo…');
    return;
  }
  // tecla vermelha (403) no idle abre entrada de IP
  if(k===403&&document.getElementById('idle')&&!document.getElementById('idle').classList.contains('hidden')){
    e.preventDefault();openIpEntry();
  }
},true);

function isAudioUrl(u){return /\.(mp3|m4a|aac|wav|ogg|flac)(\?|$)/i.test(u||'')}

function handle(m){
  if(m.v!==1&&m.v!==2)return;
  // HARDENING culto: mídia externa (vídeo/pdf/ppt/áudio da liturgia) viva
  // tem prioridade absoluta no slot. Mensagens de texto/projection não podem
  // renderizar por cima (cross-bleed owner — caso real 28/08: random sobre
  // vídeo). Só 'video'/'audio'/'stop-all' passam; o sender retoma quando a
  // mídia encerra.
  if((m.type==='projection'||m.type==='clock')){
    // heartbeat: mídia viva E sinal recente (<25s) → texto não passa.
    // Sem sinal novo, o lock expira (sender morto/stuck não trava o culto).
    const fresh=(Date.now()-(window.__mediaLastSeen||0))<25000;
    const _v=$('video'),_a=$('audio');
    const mediaActive=(_v&&!_v.paused&&_v.style.display!=='none')||(_a&&!_a.paused)||window.__videoAudioActive;
    if(mediaActive&&fresh&&!window.__mediaLock){
      try{dlog('BLOCKED',m.type,'— mídia externa ativa')}catch(e){}
      return;
    }
  }
  if(m.type==='video'||m.type==='audio')window.__mediaLastSeen=Date.now();
  // handshake pós-boot do sender: nada pode estar projetando — zera lock
  // de mídia morta (receiver bloqueava projection p/ sempre após vídeo).
  if(m.type==='idle'||m.type==='bgPalco'){
    window.__mediaLastSeen=0;
    if(window.__videoAudioActive){window.__videoAudioActive=false}
    try{const _v2=$('video'),_a2=$('audio');_v2.pause();_v2.removeAttribute('src');_v2.load();_a2.pause()}catch(e){}
  }
  switch(m.type){
    case 'projection':
      hideIdle();
      hideCloudPair();
      hideNp();
      {const t=$('timer'); if(t.style.display!=='none'){clearInterval(t._iv||0);
        t.style.display='none';$('text').style.display='';}}
      const bgEl=$('bg');
      bgEl.onerror=()=>{bgEl.onerror=null;bgEl.src='bg-fallback.png'};
      if(m.background){var nextBg=proxyUrl(m.background);if(nextBg){bgEl.src=nextBg;bgEl.style.opacity='';document.body.style.background=''}else bgEl.src='bg-fallback.png'}
      // Sem bg na mensagem: usa o BG configurado no app (bgPalco — enviado
      // ao ligar o palco). Só se NÃO houver bg configurado cai no fallback
      // fixo. Vale pra qualquer módulo (26/08 Rafael).
      // WT-5 web: backgroundColor do palco (paridade popup) também conta
      // como bg válido — pinta o body e esconde o img (hino sem capa e sem
      // bg custom usa a cor do palco; fallback é só MP3 sem nada, 01/09).
      else if(m.backgroundColor){var nextColor=projectionColor(m.backgroundColor);if(nextColor){bgEl.removeAttribute('src');document.body.style.backgroundColor=nextColor}else bgEl.src='bg-fallback.png'}
      else if(bgPalco){var nextPalco=proxyUrl(bgPalco);if(nextPalco){bgEl.src=nextPalco;bgEl.style.opacity='';document.body.style.background=''}else bgEl.src='bg-fallback.png'}
      else{bgEl.src='bg-fallback.png'}
      // Slide/PDF/PPT (text vazio) é mídia visual pura: sem véu de leitura,
      // preserva a tonalidade original do canvas do operador.
      $('veil').style.display=m.text?'':'none';
      renderProjectionText($('text'),m.text);
      $('text').classList.toggle('cover-on',m.isCover===true);
      // F3.3o: fontSize/fontWeight dinâmicos (settings do operador).
      {const t=$('text');
        if(typeof m.fontSize==='number')
          t.style.fontSize=(m.fontSize/19.2)+'vw'; // px@1920 → vw: paridade com cqw dos popups (era 10.8 — fonte ~78% maior)
        if(typeof m.fontWeight==='number')
          t.style.fontWeight=m.fontWeight;
        // WT-5 web: cor do texto do operador (paridade popup)
        if(m.textColor){var nextText=projectionColor(m.textColor);if(nextText)t.style.color=nextText}
        // Auto-fit: reduz a fonte até o texto caber na altura útil (76vh) —
        // mesma passagem de linhas do popup (frase em 2 linhas lá, 2 aqui).
        t.style.transform='translate(-50%,-50%)';
        // WT-5f bíblia: alinhamentos do palco (paridade popup). Só o operador
        // manda; sem os campos, mantém o centro padrão (C4).
        // #text é display:table (shrink-to-fit): text-align NÃO tem efeito
        // visual na caixa — o alinhamento é feito REPOSICIONANDO a caixa.
        (function(){
          var h=m.textAlign||'center', v=m.textVerticalAlign||'middle';
          var pad=(typeof m.padding==='number')?m.padding:120;
          // Paridade popup: a CAIXA fica centralizada com largura total (o
          // popup usa width:100% max-width) e só o TEXTO dentro alinha.
          // reset sempre (mensagem nova pode trocar o alinhamento)
          t.style.left='50%'; t.style.right='auto';
          t.style.top='50%'; t.style.bottom='auto';
          // Paridade popup: stage tem padding 6vmin de cada lado.
          // 92vw era ~22px menor em 1920 e mudava a quebra (TV=4, popup=3).
          t.style.maxWidth='calc(100vw - 12vmin)';
          t.style.width='calc(100vw - 12vmin)';
          t.style.textAlign=h;
          // Bíblia no popup: line-height 1.45 e sem letter-spacing. O CSS
          // base do receiver (.03em/1.25) fazia a mesma passagem quebrar
          // diferente. Só aplica quando há referência bíblica.
          if(m.footerRef){t.style.lineHeight='1.45';t.style.letterSpacing='0'}
          else{t.style.lineHeight='';t.style.letterSpacing=''}
          // WT-5f: capitalização do versículo (paridade popup)
          if(m.textTransform){t.style.textTransform=m.textTransform}
          else{t.style.textTransform='none'}
          var padV=(pad/10.8)+'vh';
          // Rodapé (referência) fica em bottom:4vh (~7vh de altura): o texto
          // NUNCA pode descer até ele — quando vAlign=bottom, para ACIMA.
          var minBottom=12;
          if(v==='bottom'){t.style.top='auto'; t.style.bottom=(Math.max(pad/10.8,minBottom))+'vh'; t.style.transform='translate(-50%,0)'}
          else if(v==='top'){t.style.top=padV; t.style.transform='translate(-50%,0)'}
          else{t.style.transform='translate(-50%,-50%)'}
        })();
        requestAnimationFrame(function(){
          // WT-5f paridade popup: auto-fit mede scrollHeight vs área útil
          // (86% do palco) e reduz até caber — MESMO algoritmo do popup
          // (applyFit/fitScale), não só altura total em 76vh.
          var base=parseFloat(getComputedStyle(t).fontSize)||1;
          var maxH=innerHeight*0.86;
          var fit=base, i=0;
          while(i<30 && (t.scrollHeight>maxH) && fit>10){
            fit*=0.94; t.style.fontSize=fit+'px'; i++;
          }
          // WT-5f paridade popup: a referência fica ANCORADA na caixinha do
          // texto (abaixo dela, mesmo alinhamento horizontal), não no rodapé
          // da tela. Gap 1.4vmin como no popup.
          var f=$('footer');
          if(f && m.footerRef && m.textVerticalAlign){
            var r=t.getBoundingClientRect();
            var gap=Math.round(innerHeight*0.014);
            f.style.left=r.left+'px';
            f.style.right='auto';
            f.style.width=r.width+'px';
            f.style.top=Math.min(r.bottom+gap, innerHeight-f.offsetHeight-8)+'px';
            f.style.bottom='auto';
          }
        });
      }
      // F3.3m: estilos da letra — sombra (intensidade) + caixinha (borda)
      {const t=$('text');
        t.classList.remove('shadow-on','shadow-off','box-on','box-off');
        if(m.textShadow===false){t.classList.add('shadow-off')}
        else{t.classList.add('shadow-on');
          if(typeof m.shadowBlur==='number')
            t.style.setProperty('--ts',`0 ${Math.max(1,m.shadowBlur/3)}vh ${m.shadowBlur}vh rgba(0,0,0,${m.shadowIntensity!=null?m.shadowIntensity:0.8})`)}
        if(m.textBox){t.classList.add('box-on');
          if(typeof m.boxOpacity==='number')t.style.setProperty('--box-bg',m.boxOpacity);
          t.style.setProperty('--box-border',
            m.boxBorder?`${m.boxBorder.width||0.4}vh solid ${m.boxBorder.color||'rgba(255,255,255,.25)'}`:'none')}
        else{t.classList.add('box-off')}
      }
      // F3.3m: footer com referência destacada + versão
      {const f=$('footer');
        // WT-5f: footer segue o alinhamento do palco (paridade popup — a
        // referência fica dentro do conteúdo lá, alinhada com o texto).
        // padding 4vw = mesma borda da caixa de texto (92vw centrada).
        if(m.textAlign){f.style.textAlign=m.textAlign;f.style.padding='0 4vw';f.style.boxSizing='border-box'}
        else{f.style.textAlign='center';f.style.padding='0'}
        // Default: rodapé da tela (8vh p/ sair da área do texto). O rAF do
        // auto-fit reposiciona PERTO da caixinha quando há footerRef (abaixo).
        f.style.left='0'; f.style.right='0'; f.style.width='auto';
        f.style.top='auto';
        f.style.bottom=(m.footerRef?'8vh':'4vh');
        if(m.footerRef){
          f.textContent='';
          const ref=document.createElement('span');ref.className='ref';ref.textContent=String(m.footerRef);
          const color=document.createElement('span');color.style.color=String(m.footerColor||'#FCCE02');
          ref.style.setProperty('--ref-color',color.style.color||'#FCCE02');
          const weight=Number(m.footerWeight);
          ref.style.setProperty('--ref-weight',String(Number.isFinite(weight)&&weight>=100&&weight<=900?weight:600));
          f.appendChild(ref);
          if(m.footerVersion){const version=document.createElement('span');version.className='ver';version.textContent=String(m.footerVersion);f.appendChild(version)}
        }else{
          f.textContent=m.footer||'';
        }
      }
      // Label de versão some durante projection com referência (colidia no
      // canto inferior direito — print 02/09 Rafael).
      {const iv=$('idleVer');if(iv)iv.style.display=m.footerRef?'none':''}
      break;
    case 'bgPalco':
      // BG permanente do palco (idle) — personalização, não da música
      bgPalco=m.url||'';
      if(bgPalco){
        $('bgPalco').src=proxyUrl(bgPalco);
      }else{
        $('bgPalco').removeAttribute('src');
      }
      break;
    case 'audio':{
      const a=$('audio');
      if(m.url){
        // F3.3-sync: só recarrega o src se a URL MUDOU — reenvio da mesma
        // faixa com action:play não pode reiniciar o áudio (loop 3s).
        const next=proxyUrl(m.url);
        if(a.src!==next){
          a.src=next;
          if(typeof m.positionMs==='number'&&m.positionMs>0){
            const apply=()=>{try{a.currentTime=m.positionMs/1000}catch(e){}};
            if(a.readyState>=1)apply();else a.addEventListener('loadedmetadata',apply,{once:true});
          }
          a.onended=()=>{hideNp();showIdle('Aguardando conteúdo…')};
          // Áudio "desconhecido" (sem metadados): now-playing padrão do
          // Palco — sem nome de arquivo, com a animação eq indicando que
          // há algo tocando. Mesmo visual do "só áudio" do app.
          if(m.title){
            showNp(m.title, m.subtitle||'', m.cover||'');
          }else{
            showNp('Reproduzindo áudio', m.subtitle||'', m.cover||'');
          }
          $('bg').src=m.background?proxyUrl(m.background):'bg-fallback.png';
        }
      }
      // BG garantido em TODA mensagem de áudio (load, play, pause, seek):
      // sem isso, mensagens action-only podiam deixar tela preta.
      if(!m.background){
        const cur=$('bg');
        if(!cur.src||cur.src.endsWith('/'))cur.src='bg-fallback.png';
      }
      if(m.action==='play'){
        // Now-playing tardio APENAS se não há projeção ativa na TV.
        // Hino da liturgia = projection (letra) + audio juntos: o np não
        // pode cobrir a letra projetada (caso real: hino mostrava
        // 'Reproduzindo áudio' em vez da letra).
        const np=$('np');
        const textEl=$('text');
        const hasProjection=textEl&&textEl.innerHTML&&textEl.innerHTML.trim()!==''&&np.style.display==='none';
        if(np.style.display==='none'&&!hasProjection){
          showNp(m.title||'Reproduzindo áudio', m.subtitle||'', m.cover||'');
          if(!m.background)$('bg').src='bg-fallback.png';
        }
        if(a.paused){dlog('PLAY src='+(a.src||'').slice(0,60));playWithFallback()}
        else dlog('PLAY ignorado — já tocando');
      }
      if(m.action==='pause'&&!a.paused)a.pause();
      if(m.action==='stop'){
        if(!window.__videoAudioActive){
          a.pause();a.currentTime=0;showIdle('Aguardando conteúdo…')}}
      if(m.action==='seek'){
        const target=(m.position||m.positionMs/1000||0);
        // só corrige se o desvio for perceptível — micro-sync causa stutter
        if(Math.abs(a.currentTime-target)>1.0){try{a.currentTime=target}catch(e){}}
        // sender mandou seek enquanto deveria tocar (play inicial pode ter
        // falhado por autoplay) → retoma; playWithFallback cuida do unlock
        if(a.paused&&target>0.2)playWithFallback();
      }
      break}
    case 'video':{
      const v=$('video');
      // MP3/áudio puro no canal video (popup liturgia manda dual): redireciona
      // pro fluxo de áudio — now-playing + EQ + bg (tela preta NUNCA).
      if(m.url&&isAudioUrl(m.url)){
        // Vídeo anterior pode estar fullscreen (z-index alto) e esconder o
        // now-playing. MP3 é áudio: mata a camada de vídeo antes do cartão.
        v.pause();v.removeAttribute('src');v.style.display='none';v.load();
        const av=$('audio');const next=proxyUrl(m.url);
        window.__videoAudioActive=true;
        if(av.src!==next){av.src=next;
          av.onended=()=>{hideNp();showIdle('Aguardando conteúdo…')};
          showNp(m.title||'Reproduzindo áudio', m.subtitle||'', m.cover||'');
          $('bg').src=m.background?proxyUrl(m.background):'bg-fallback.png';}
        if(m.action!=='pause'&&m.action!=='stop'&&av.paused)playWithFallback();
        if(m.action==='pause'&&!av.paused)av.pause();
        if(typeof m.positionMs==='number'&&m.positionMs>0){
          try{av.currentTime=m.positionMs/1000}catch(e){}}
        break;
      }
      hideIdle();hideNp();
      // Vídeo assumindo a TV: qualquer ÁUDIO anterior (hino/MP3) é PARADO
      // e limpo. Sem isso, o 'audio play' do tvBroadcast (que manda nos dois
      // canais) retomava o hino por cima do vídeo (caso real 26/08).
      {const a=$('audio');
        if(a&&a.src&&!(m.action==='stop'&&!m.url)){a.pause();a.removeAttribute('src');a.load()}}
      if(m.action==='stop'){v.pause();v.removeAttribute('src');v.style.display='none';
        v.load();showIdle('Aguardando conteúdo…');
        sendEvent({v:2,type:'ended',media:'video'});break}
      if(m.url){v.src=proxyUrl(m.url);v.style.display='';
        // Sync inicial (padrão F3.3g do áudio): positionMs aplicado antes
        // do play — seguro p/ metadata não carregada (loadedmetadata once).
        if(typeof m.positionMs==='number'&&m.positionMs>0){
          const apply=()=>{try{v.currentTime=m.positionMs/1000}catch(e){}};
          if(v.readyState>=1)apply();else v.addEventListener('loadedmetadata',apply,{once:true});
        }
        v.onended=()=>{v.style.display='none';v.removeAttribute('src');v.load();
          showIdle('Aguardando conteúdo…');
          sendEvent({v:2,type:'ended',media:'video'})}}
      if(m.action==='seek'){
        const target=(m.position||((m.positionMs||0)/1000)||0);
        // Spec multi-telas F4: tolerância 0.12s (era 0.3 — perceptível em
        // lábio/voz). Drift pequeno = correção SUAVE via playbackRate
        // (sem corte); grande (≥0.5s) = salto.
        const drift=target-v.currentTime;
        if(Math.abs(drift)>0.5){try{v.currentTime=target}catch(e){};v.playbackRate=1}
        else if(drift>0.12)v.playbackRate=Math.min(1.05,1+drift*0.5);
        else if(drift<-0.12)v.playbackRate=Math.max(0.95,1+drift*0.5);
        else v.playbackRate=1;
        if(v.paused&&target>0.2)playVideoWithFallback();
      }
      if(m.action==='play'){
        const a=$('audio'); a.pause(); // exclusao mutua com audio
        // Fallback mudo (padrão F3.3h do áudio): browser bloqueia play
        // com som sem gesto — retry mudo toca na hora, badge pede o gesto.
        playVideoWithFallback();
        sendEvent({v:2,type:'unlocked'});
      }
      if(m.action==='pause')v.pause();
      break}
    case 'timer':{
      hideIdle();
      hideCloudPair();
      const t=$('timer');
      if(m.action==='stop'){t.style.display='none';clearInterval(t._iv||0);$('text').style.display='';break}
      // WT-5 cloud: text pronto (clock do web, timer/countdown) tem prioridade —
      // o operador já formata; sem tick local (evita dessincronia e zero inicial).
      if(typeof m.text==='string'&&m.text.trim()){
        clearInterval(t._iv||0);
        t.style.display='';$('text').style.display='none';
        t.textContent=m.text+(m.label?'  ':'');
        if(m.label){const sm=document.createElement('small');sm.textContent=m.label;t.appendChild(sm)}
        break;
      }
      t.style.display='';$('text').style.display='none';
      let rem=(m.duration||0)*1000; // countdown segundos
      const mode=m.mode||'countdown';
      let elapsed=0;
      clearInterval(t._iv||0);
      const fmt=ms=>{const s=Math.max(0,Math.round(ms/1000));
        const hh=Math.floor(s/3600),mm=String(Math.floor(s/60)%60).padStart(2,'0'),
              ss=String(s%60).padStart(2,'0');
        return hh>0?`${hh}:${mm}:${ss}`:`${mm}:${ss}`};
      const render=()=>{
        const val=mode==='chrono'?elapsed:rem;
        t.textContent=fmt(val);
        if(m.label){const label=document.createElement('small');label.textContent=String(m.label);t.appendChild(label)}
      };
      render();
      t._iv=setInterval(()=>{rem-=1000;elapsed+=1000;render();
        if(mode!=='chrono'&&rem<=0){clearInterval(t._iv)}},1000);
      break}
    case 'idle':showIdle(m.msg||'Aguardando conteúdo…');break;
    // F3.3x: sender informa IP DA TV (visto pelo socket) + SLOT onde ela
    // caiu — identificação visível pro operador conferir com o app.
    case 'youare':{
      if(m.ip){
        var who=(m.slotLabel||m.slot||'Palco');
        var isMain=!m.slot||m.slot==='0';
        if(isMain)who='Principal (espelho)';
        var el=document.getElementById('idleConn');
        if(el&&document.getElementById('idle')&&!document.getElementById('idle').classList.contains('hidden'))
          el.textContent=who+' · TV '+m.ip+' · conectado · vermelha = digitar IP';
        try{
          localStorage.setItem('palcoSelfIp',m.ip);
          localStorage.setItem('palcoSlotLabel',who);
        }catch(e){}
      }
      break;
    }
  }
}


// WT-5d: boot — código cloud na query (?code=XXXXXX) ou salvo em localStorage
// tem prioridade; sem código, segue o fluxo local (scan do sender na LAN).
(function(){
  var bootCode=(qs.get('code')||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(!bootCode){try{bootCode=localStorage.getItem('palcoCloudCode')||''}catch(e){}}
  if(bootCode&&bootCode.length===6){cloudConnect(bootCode);return}
  connect();
})();

// ===== F3.3ad: auto-relaunch — o Palco volta ao foreground sozinho =====
// Usado quando alguém sai do Palco sem querer (botão HOME/back) durante o
// culto. O webOS não permite launch REMOTO (401 no second-screen desta
// série), mas o próprio app tem permissão de launch via PalmServiceBridge
// (validado: returnValue:true). Estratégia: se o app perde o foreground
// (visibilitychange → hidden) e o sender estava CONECTADO, agenda o
// relaunch em 3s. Cancelável se voltar antes (usuário só deu uma olhada).
(function(){
  var relaunchTimer=null;
  function selfLaunch(){
    try{
      var b=new PalmServiceBridge();
      b.onservicecallback=function(){};
      b.call('luna://com.webos.applicationManager/launch',
        '{"id":"com.piano.louvorja.palco"}');
      dlog('AUTO-RELAUNCH disparado');
    }catch(e){dlog('AUTO-RELAUNCH erro: '+e.message)}
  }
  document.addEventListener('visibilitychange',function(){
    var wasConnected=ws&&ws.readyState===1;
    if(document.hidden&&wasConnected){
      if(relaunchTimer)clearTimeout(relaunchTimer);
      relaunchTimer=setTimeout(function(){
        if(document.hidden)selfLaunch(); // ainda fora? volta
        relaunchTimer=null;
      },3000);
    }else if(!document.hidden&&relaunchTimer){
      clearTimeout(relaunchTimer);relaunchTimer=null; // voltou sozinho
      dlog('AUTO-RELAUNCH cancelado (voltou ao foreground)');
    }
  });
})();
})();
</script>
