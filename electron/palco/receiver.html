<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>LouvorJA Palco</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;
    font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#fff}
  #bg{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;
    filter:brightness(.55);transition:opacity .8s}
  #bg[src=""]{opacity:0}
  #bgPalco{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover}
  #veil{position:fixed;inset:0;background:rgba(0,0,0,.45)}
  #content{position:fixed;top:0;left:0;right:0;bottom:0;padding:6vh 8vw;
    box-sizing:border-box}
  #text{position:absolute;top:50%;left:50%;
    /* ÁREA ÚTIL do slide: teto 1600px (05/10 Rafael — 100% da área ficou
       DEMAIS). SOLUÇÃO EZEQUIAS (web 3dc37df): pre-line + quebra natural —
       as quebras \n do autor viram linhas e o texto flui até a max-width
       antes de quebrar. SEM fit JS: fonte configurada aplicada direto. */
    display:block;width:min(86vw,1600px);max-height:72vh;transform:translate(-50%,-50%);
    overflow-wrap:break-word;white-space:pre-line;
    text-align:center;font-size:calc(var(--fit-size,3.65vw));font-weight:700;line-height:1.4;
    letter-spacing:.03em;text-transform:uppercase;
    text-shadow:0 2px 12px rgba(0,0,0,.8)}
  /* F3.3m: estilos dinâmicos da letra (sombra/caixinha) */
  #text.shadow-on{text-shadow:var(--ts,0 3px 18px rgba(0,0,0,.8))}
  /* Caixinha no PADRÃO da projeção (StagePreview): canto folha
     1.4cqw 0 1.4cqw 0 (16:9 → ~2.7vh 0), borda fina 1px, padding
     justo ao texto (2cqw ≈ 3.8vh lateral, 2vh vertical). */
  #text.box-on{background:rgba(0,0,0,var(--box-bg,.45));
    /* Player: radius folha clamp(14px,2.4vmin,32px) 0, borda 0.2vmin e
       sombra suave. Padding mínimo — caixa abraça o texto (vmin).
       WIDTH (05/10 Rafael: "coloca ela mais perto do texto"): fit-content
       abraça o texto com padding justo — sem faixa full-bleed; o teto
       continua sendo a área útil (max-width 100% do #content). */
    /* PARIDADE WEB (MediaSlideStage): caixa com respiro — max-width 86%
       e padding 2.5vmin 4vmin, igual MediaSlideStage.vue do web. */
    max-width:86vw;margin-inline:auto;
    padding:2.5vmin 4vmin;
    border-radius:2.4vmin 0 2.4vmin 0;
    border:var(--box-border,.2vmin solid rgba(255,255,255,.25));
    box-shadow:0 10px 30px rgba(0,0,0,.4)}
  #text.shadow-off{text-shadow:none}
  /* Capa da música (isCover): título destaque amarelo, sem caixinha/borda —
     paridade com media-projection__title--cover via cabo. */
  #text.cover-on{text-transform:uppercase;font-weight:900;letter-spacing:.03em;
    color:#f6c32a;background:none;padding:0;border:none;box-shadow:none;
    border-radius:0;line-height:1.1}
  #text.box-off{background:none;padding:0;border:none;box-shadow:none}

  #footer{position:fixed;bottom:4vh;left:0;right:0;text-align:center;
    font-size:2.6vh;font-weight:300;opacity:.7}
  /* F3.3m: referência da passagem destacada + versão ao lado */
  #footer .ref{font-weight:var(--ref-weight,600);color:var(--ref-color,#FCCE02)}
  #footer .ver{font-weight:300;opacity:.65;margin-left:1.2vh;font-size:.85em}
  #idle{position:fixed;top:0;left:0;right:0;bottom:0;z-index:10;
    text-align:center;transition:opacity .5s}
  #idleCenter{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    text-align:center;width:60vw}
  #idle.hidden{opacity:0;pointer-events:none}
  #idleLogos img,#idleLogos svg{display:block;margin:0 auto}
  #idleLogo{height:14vh;max-width:50vw;margin:0 auto 4vh auto}#idleLogo svg{width:100%;height:100%;display:block}
  /* F3.3n: wordmark "Louvor JA" — identidade fixa, não personalizável. */
  #idleWordmark{font-size:3.6vh;font-weight:300;letter-spacing:.8vh;
    color:#fff;opacity:.92;margin:0 0 3vh 0;text-transform:none}
  #idleCodenameWrap{height:6vh;max-width:44vw;margin:0 auto}
  #idleCodenameWrap svg{width:100%;height:100%;color:#fff;opacity:.9;display:block}
  #bars{margin:4vh auto 0 auto}
  #bars div{width:5vh;height:1.2vh;display:inline-block;margin:0 .5vh}
  #idle p{font-size:2.5vh;opacity:.6;margin:3vh 0 0 0}
  /* Diagnóstico só via ?debug=1; nunca poluir o telão em produção. */
  #status{display:none;position:fixed;top:2vh;right:2vw;font-size:2vh;opacity:.65;z-index:20}
  body.debug #status{display:block}
  #status.err{color:#ff6766}
          #np{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    text-align:center;width:80vw}
  #npCover{width:22vh;height:22vh;object-fit:cover;border-radius:2vh;
    margin:0 auto 3vh auto;display:block;box-shadow:0 4px 24px rgba(0,0,0,.6)}
  #npTitle{font-size:4.5vh;font-weight:600;text-shadow:0 2px 12px rgba(0,0,0,.8)}
  #npSub{font-size:2.5vh;font-weight:300;opacity:.7;margin-top:1vh}
  #npEq{display:inline-block;margin-top:2.5vh}
  #npEq span{display:inline-block;width:1vh;background:#00C1E6;margin:0 .3vh;
    animation:eq 1s ease-in-out infinite}
  #npEq span:nth-child(2){animation-delay:.2s}
  #npEq span:nth-child(3){animation-delay:.4s}
  @keyframes eq{0%,100%{height:1vh}50%{height:3vh}}
  #timer{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    text-align:center;width:84vw;font-size:16vh;font-weight:700;
    font-variant-numeric:tabular-nums;text-shadow:0 2px 12px rgba(0,0,0,.8)}
  #timer small{display:block;font-size:2.8vh;font-weight:300;opacity:.7;margin-top:2vh}
  /* Vídeo acima do idle (z=20) — idle nunca pode cobrir reprodução. */
  #video{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:contain;
    background:#000;z-index:20}
</style>
</head>

<script>
function dlog(m1,m2,m3){try{console.log('[P]',m1,m2!==undefined?String(m2):'',m3!==undefined?String(m3):'')}catch(e){}}
// window.onerror → visível no DevTools e reportado ao sender (debug remoto)
window.onerror=function(msg,src,line,col){
  try{sendEvent({v:2,type:'error',code:'receiver_js',message:String(msg).slice(0,200),line:line,col:col})}catch(e){}

};
window.addEventListener('unhandledrejection',function(ev){

});
const $=id=>document.getElementById(id);
const qs=new URLSearchParams(location.search);
// F3.3q: versão no idle (canto inferior direito) — ?v= override ou padrão.
window.__PALCO_APPV__=window.__PALCO_APPV__||'0.1.52';
(function(){var el=$('idleVer');if(!el)return;var qv=qs.get('v')||window.__PALCO_APPV__||'';if(qv){el.textContent='PIANO LouvorJA Palco · receiver v'+qv;return}fetch('appinfo.json').then(function(r){return r.json()}).then(function(j){el.textContent='PIANO LouvorJA Palco · receiver v'+(j.version||'?')}).catch(function(){fetch('config.xml').then(function(r){return r.text()}).then(function(t){var m2=t.match(/version="([^"]+)"/);el.textContent='PIANO LouvorJA Palco · receiver v'+(m2?m2[1]:'?')}).catch(function(){el.textContent='PIANO LouvorJA Palco'})})})()
// webOS: ares-launch -p '{"host":"..."}' chega em PalmSystem.launchParams,
// NÃO na query string. Merge dos dois (query string tem prioridade).
try{
  const lp=JSON.parse((window.PalmSystem&&PalmSystem.launchParams)||'{}');
  for(const k in lp)if(lp[k]!=null&&!qs.has(k))qs.set(k,String(lp[k]));
}catch(e){}
// Status de conexão é diagnóstico, não UI de projeção.
if(qs.get('debug')==='1') document.body.classList.add('debug');
let ws,tries=0;
let unlocked=true;
let bgPalco='';  // BG personalizado do palco (idle) — persiste entre músicas

function proxyUrl(original){
  if(!original)return original;
  // Sender/popup legado pode mandar barra codificada (%2F) — decodifica
  // caminho antes de qualquer comparação/use (404 silencioso caso contrário).
  try{ original=decodeURIComponent(original) }catch(e){}
  // Qualquer porta do MESMO sender é local: 7080 (Principal), 7082 (TV 2),
  // 7084... Antes só aceitava :7080; bg vindo de slot :7082 era proxyado
  // de volta e falhava → receiver caía no bg-12 (caso real 26/08).
  if(original.startsWith('http://'+host+':'))return original;
  if(original.startsWith('http://')||original.startsWith('https://')){
    // Token no /proxy também: <img> não manda header; sem token a TV
    // (LAN) tomava 403 no bg/cover (localhost bypass escondia o bug).
    const tok=qs.get('token');
    return `http://${host}:7080/proxy?url=${encodeURIComponent(original)}${tok?`&token=${encodeURIComponent(tok)}`:''}`;
  }
  return original;
}

function setStatus(t,err){const s=$('status');s.textContent=t;
  const c=$('idleConn');if(c){
    if(t.indexOf('●')===0){
      var lb=localStorage.getItem('palcoSlotLabel');
      c.textContent=(lb?lb+' · ':'')+'conectado a '+t.slice(1).trim()+' · vermelha = IP/porta · azul = atualizar';
    }
    else c.textContent=(localStorage.getItem('palcoSlotLabel')?localStorage.getItem('palcoSlotLabel')+' · ':'')+t+' · tecla vermelha = digitar IP';
  }
  s.className=err?'err':''}


function sendEvent(m){try{if(ws&&ws.readyState===1)ws.send(JSON.stringify(m))}catch(e){}}

// ===== Auto-descoberta (F3.3): acha o sender (APK) na sub-rede =====
// Prioridade: launchParams/query host > último host válido (localStorage)
// > scan da sub-rede via GET :7080/status (resposta JSON identifica sender).
let host=qs.get('host')||localStorage.getItem('palcoHost')||location.hostname||'';
let port=qs.get('port')||localStorage.getItem('palcoPort')||'7081';

function probeHttp(ip,httpPort){
  return new Promise(res=>{
    fetch('http://'+ip+':'+httpPort+'/status')
      .then(function(r){return r.json()})
      .then(function(j){res(j&&('unlocked' in j)?j:null)})
      .catch(function(){res(null)});
  });
}
function probeSender(ip){
  // Porta digitada pode ser WS (7081) OU HTTP do slot (a UI mostra a HTTP,
  // ex.: slot 1 = 7082/7083). Tenta a dupla HTTP/WS em ambos os sentidos:
  // p como HTTP, p-1 (p=WS) e p+1 (p=HTTP→WS=p+1).
  var p=parseInt(port,10)||7081;
  return probeHttp(ip,p).then(function(j){
    if(j)return normalizePort(ip,j,p+1);        // p era HTTP → WS=p+1
    return probeHttp(ip,p-1).then(function(j2){
      if(j2)return normalizePort(ip,j2,p);      // p era WS (HTTP=p-1)
      return probeHttp(ip,p+1).then(function(j3){
        if(j3)return normalizePort(ip,j3,p+1);  // p era HTTP, WS=p+1
        return null;
      });
    });
  });
}
function normalizePort(ip,j,wsPort){
  port=String(wsPort);
  return ip;
}

async function scanSubnet(){
  dlog('scan iniciado');
  // presume /24 da própria TV (rede típica de igreja)
  // file:// (IPK/simulador local): hostname vazio — tenta últimos hosts
  // conhecidos da sub-rede salva antes do default. Cobertura p/ IPK.
  let me=location.hostname;
  if(!me){
    const saved=localStorage.getItem('palcoHost');
    me=saved||'192.168.1.100';
  }
  const prefix=me.split('.').slice(0,3).join('.');
  const base=host?host.split('.').slice(0,3).join('.'):prefix;
  const ips=[];
  for(let i=1;i<255;i++)ips.push(base+'.'+i);
  if(host)ips.unshift(host); // último conhecido primeiro
  const found=[];
  const CONC=42; // F3.3v: 20→42 e timeout 900→450ms — scan ~3x mais rápido
  for(let i=0;i<ips.length;i+=CONC){
    const batch=await Promise.all(ips.slice(i,i+CONC).map(probeSender));
    dlog('batch',i,'-',i+CONC,':',batch.filter(Boolean).join(',')||'-');
    for(const r of batch)if(r&&found.indexOf(r)<0)found.push(r);
    if(found.length)return found[0];
  }
  return null;
}

function connect(){
  dlog('connect() host="'+host+'"');
  if(!host){
    setStatus('procurando LouvorJA na rede…');
    scanSubnet().then(found=>{
      if(found){host=found;localStorage.setItem('palcoHost',host);doConnect()}
      else{setStatus('nenhum sender encontrado — tentando de novo…',true);retry()}
    });
    return;
  }
  // F3.3v: valida o host ANTES do WS — se o sender não responde em /status,
    // o IP é stale (DHCP) → esquece e escaneia JÁ, sem as 3 tentativas de WS
    // com backoff (que levavam ~15s antes de re-escanear).
    // Exceção: fetch bloqueado (app empacotado webOS) não significa host morto —
    // tenta WS direto 1x antes de descartar; WS não sofre CORS.
    probeSender(host).then(ok=>{
      if(ok)doConnect();
      else{
        dlog('probe falhou — tentando WS direto antes de descartar host');
        directTry();
      }
    });
  }
  // Tenta WS direto no host salvo; se falhar 1x sem nunca abrir, host é stale.
  function directTry(){
    var opened=false;
    var t=setTimeout(function(){if(!opened){dlog('WS direto falhou — host stale');localStorage.removeItem('palcoHost');host='';connect()}},3000);
    try{var w=new WebSocket('ws://'+host+':'+port+'/palco'+(qs.get('token')?'?token='+encodeURIComponent(qs.get('token')):''));
      w.onopen=function(){opened=true;clearTimeout(t);try{w.close()}catch(e){};doConnect()};
      w.onerror=function(){};
    }catch(e){clearTimeout(t);localStorage.removeItem('palcoHost');host='';connect()}
  }
// F3.3u: re-scan contínuo enquanto desconectado — nunca desiste.
// (antes: 3 falhas → esquecia host → 1 scan → parava com "não encontrado")
// Watchdog: sender morreu/fechou com mídia tocando → para NA HORA.
// Sem isso o áudio continuava até o fim depois do app cair.
function stopMediaOnServerLoss(){
  try{
    const a=$('audio'); if(a&&!a.paused){a.pause();a.currentTime=0}
    const v=$('video'); if(v&&!v.paused){v.pause();v.removeAttribute('src');v.style.display='none';v.load()}
    hideNp();
  }catch(e){}
}

function doConnect(){
  dlog('doConnect '+host+':'+port);
  setStatus('conectando '+host+':'+port+'…');
  try{ws=new WebSocket('ws://'+host+':'+port+'/palco'+(qs.get('token')?'?token='+encodeURIComponent(qs.get('token')):''))}catch(e){retry();return}
  ws.onopen=()=>{tries=0;dlog('WS OPEN '+host);setStatus('● '+host);
    if(window.__hideSplash)window.__hideSplash(); // F3.3j: splash sai no connect
    localStorage.setItem('palcoHost',host);
    localStorage.setItem('palcoPort',port)};
  ws.onmessage=ev=>{try{handle(JSON.parse(ev.data))}catch(e){}};
  ws.onclose=()=>{dlog('WS CLOSE');stopMediaOnServerLoss();showIdle();
    // host falhou 3x → esquece e re-escaneia (IP mudou)
    if(tries>=3){localStorage.removeItem('palcoHost');host='';tries=0}
    retry()};
  ws.onerror=()=>{};
}
function retry(){
  const wait=Math.min(1000*Math.pow(2,tries++),10000);
  setStatus('reconectando em '+Math.round(wait/1000)+'s',true);
  setTimeout(connect,wait);
}
function showIdle(msg){
  $('idleMsg').textContent=msg;
  $('idle').classList.remove('hidden');
  // volta pro BG do palco (personalizado) — música "saiu de cena"
  $('bg').removeAttribute('src');
  // Now-playing e timer precisam SAIR junto — senão o título residual
  // do áudio e o cronômetro 00:00 sobrepõem o idle (caso real: MP3
  // da liturgia termina após timer espelhado).
  hideNp();
  {const t=$('timer'); if(t.style.display!=='none'){clearInterval(t._iv||0);
    t.style.display='none';}}
  $('text').textContent='';$('footer').textContent='';
  // F3.3ac: remove estilos de projeção (caixa/sombra) — senão a caixa
  // vazia continuava desenhada no idle após "Limpar projeção".
  $('text').classList.remove('box-on','shadow-on','box-off','shadow-off','cover-on');
  $('text').style.removeProperty('--box-bg');
  $('text').style.removeProperty('--box-border');
  $('text').style.removeProperty('--ts');
}
function hideIdle(){$('idle').classList.add('hidden')}


// F3.3e: fallback de cover — sem capa ou capa quebrada = logo da org.
// Cover relativo (images/... ou covers/...) resolve contra / do sender.
function coverUrl(cover){
  if(!cover) return null;
  if(cover.startsWith('http://')||cover.startsWith('https://'))return proxyUrl(cover);
  return proxyUrl('http://'+(host||location.hostname)+':7080/'+cover.replace(/^\/+/,''));
}
function showNp(title,sub,cover){

  {const t=$('timer'); if(t.style.display!=='none'){clearInterval(t._iv||0);
    t.style.display='none';$('text').style.display='none';}}
  const np=$('np');np.style.display='';
  $('npTitle').textContent=title;
  $('npSub').textContent=sub;
  const c=$('npCover');

  else{c.src='logo-piano-louvorja.png';c.style.display='block'}
}
function hideNp(){
  const np=$('np');if(np.style.display==='none')return;
  np.style.display='none';$('text').style.display='';
}

const a0=$('audio');
a0.onended=()=>showIdle('Aguardando conteúdo…');
let pendingPlay=false;
// F3.3h: autoplay-mudo — o browser bloqueia play() COM SOM sem gesto, mas
// permite MUDO. Estratégia Chromecast-like: play com som falha → retry
// mudo → projeção/letra rodam na hora (relógio sincronizado via
// positionMs); primeiro gesto só DESMUTA (áudio já estava rodando, entra
// no ponto certo). Badge discreto, não bloqueia a tela.
let mutedUnlock=false;
function showMuteBadge(){
  if($('muteBadge'))return;

  b.id='muteBadge';

    'font-size:2.4vh;color:#fff;display:flex;align-items:center;gap:1.2vh';
  b.innerHTML='<span style="font-size:3vh">🔇</span> Toque para ativar o som';
  b.addEventListener('click',unmuteNow);

}
function hideMuteBadge(){const b=$('muteBadge');if(b)b.remove()}
function unmuteNow(){
  mutedUnlock=false;hideMuteBadge();
  a0.muted=false;
  const vv=$('video'); if(vv){vv.muted=false; if(vv.paused&&vv.src)vv.play().catch(function(){})}
  a0.play().then(()=>sendEvent({v:1,type:'unlocked'})).catch(()=>{});
  sendEvent({v:1,type:'unlocked'});
}
function playVideoWithFallback(){

function playWithFallback(){

  a0.play().then(()=>{
    dlog('PLAY OK (som)');pendingPlay=false;hideMuteBadge();mutedUnlock=false;
    sendEvent({v:1,type:'unlocked'});
  }).catch(e=>{

    }).catch(e2=>{

window.addEventListener('keydown',function(e){
  if(mutedUnlock||pendingPlay)unmuteNow();
  var k=e.keyCode;
  // F3.3aa: controle do vídeo pelo remote — play/pause/stop/back decidem
  // LOCALMENTE na TV (latência zero); back também notifica o sender.
  var v=$('video');
  var videoActive=v&&v.style.display!=='none'&&v.src;
  if(videoActive){
    if(k===415||k===250||k===10252){ // PLAY (415=webOS,250/10252=media)
      e.preventDefault();v.play().catch(function(){});return;
    }
    if(k===19||k===251||k===10251||k===4063){ // PAUSE (19,251/10251=media, 4063=OK)
      e.preventDefault();
      if(v.paused)v.play().catch(function(){});else v.pause();
      return;
    }
    if(k===413||k===461||k===27||k===4||k===10009||k===13){ // STOP/BACK/ESC/Android-back(4)/Tizen-RETURN(10009)/Enter(13) — interrompe
      e.preventDefault();
      v.pause();v.removeAttribute('src');v.style.display='none';v.load();
      sendEvent({v:2,type:'ended',media:'video'}); // sender sabe que saiu
      return;
    }
  }
  if(k===37||k===39||k===4063){ // setas + OK
    e.preventDefault();
    sendEvent({v:2,type:'remote-key',key:k===37?'prev':'next'});
  }
},true);
// ===== F3.3u: entrada de IP manual via controle remoto =====
// Tecla vermelha (403) ou "0" no idle abre overlay pra digitar IP do celular.
var ipEntry=null;
function openIpEntry(){
  if(ipEntry)return;
  ipEntry=document.createElement('div');
  ipEntry.style.cssText='position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.85);'+
    'display:flex;align-items:center;justify-content:center';
  ipEntry.innerHTML='<div style="text-align:center">'+
    '<p style="font-size:2.6vh;opacity:.7;margin:0 0 2vh 0">Digite o IP — ou SÓ A PORTA (ex.: 7081) para achar o LouvorJA na rede</p>'+
    '<p id="ipVal" style="font-size:6vh;font-weight:700;letter-spacing:.5vh;margin:0;'+
    'min-height:7vh;border-bottom:.3vh solid #FCCE02;padding:0 4vh"></p>'+
    '<p style="font-size:1.8vh;opacity:.5;margin:2vh 0 0 0">OK conectar · vermelha cancelar · backspace apaga</p></div>';
  document.body.appendChild(ipEntry);
  ipEntry._val='';
  renderIp();
}
function renderIp(){var el=document.getElementById('ipVal');if(el)el.textContent=ipEntry._val||''}
function closeIpEntry(){if(ipEntry){ipEntry.remove();ipEntry=null}}
function submitIp(){
  var v=(ipEntry&&ipEntry._val)||'';
  if(!v)return;
  // Só dígitos (2-5) = PORTA: o sender é achado por scan com essa porta
  // (usuário não decora IP; nova TV na rede de igreja conecta fácil).
  if(/^\d{2,5}$/.test(v)&&!/\./.test(v)){
    port=v;localStorage.setItem('palcoPort',port);tries=0;closeIpEntry();
    try{if(ws)ws.close()}catch(e){}
    host='';localStorage.removeItem('palcoHost');
    setStatus('procurando LouvorJA na porta '+port+'…');
    scanSubnet();
    return;
  }
  // Multi-palco: aceita IP ou IP:PORTA (ex: 192.168.1.50:7083).
  var parts=v.split(':');
  host=parts[0];localStorage.setItem('palcoHost',host);
  if(parts[1]&&parseInt(parts[1],10)>0){
    port=String(parseInt(parts[1],10));localStorage.setItem('palcoPort',port);
  }
  tries=0;
  closeIpEntry();
  try{if(ws)ws.close()}catch(e){}
  // IP manual conecta WS DIRETO — sem probeSender (fetch /status pode ser
  // bloqueado em app empacotado webOS; WS não sofre CORS).
  doConnect();
}
window.addEventListener('keydown',function(e){
  var k=e.keyCode;
  if(ipEntry){
    e.preventDefault();e.stopPropagation();
    if(k===13||k===4063){submitIp()}                       // OK / Enter
    else if(k===461||k===8||k===463){                      // backspace
      ipEntry._val=ipEntry._val.slice(0,-1);renderIp()}
    else if(k>=48&&k<=57){                                  // 0-9
      if(ipEntry._val.length<15){ipEntry._val+=String(k-48);renderIp()}}
    else if(k>=96&&k<=105){                                 // numpad
      if(ipEntry._val.length<15){ipEntry._val+=String(k-96);renderIp()}}
    else if(k===46||k===190||k===110){                      // ponto
      if(ipEntry._val.length<15){ipEntry._val+='.';renderIp()}}
    else if(k===403||k===27){closeIpEntry()}                // vermelha/ESC
    return;
  }
  // Azul (406): refresh do Palco. Útil quando sender/slot reiniciou ou
  // replay ficou stale — força novo boot, scan e conexão WS sem alterar
  // host/porta persistidos. Vermelho continua reservado a IP/porta manual.
  if(k===406){
    e.preventDefault();
    try{if(ws)ws.close()}catch(e){}
    location.reload();
    return;
  }
  // Verde (404): para qualquer mídia local e volta ao idle. O operador da
  // TV recupera a tela sem depender do sender (ex: mídia presa/congelada).
  if(k===404){
    e.preventDefault();
    {const a=$('audio');a.pause();a.removeAttribute('src');a.load();}
    {const v=$('video');v.pause();v.removeAttribute('src');v.style.display='none';v.load();}
    hideNp();
    showIdle('Aguardando conteúdo…');
    return;
  }
  // tecla vermelha (403) no idle abre entrada de IP
  if(k===403&&document.getElementById('idle')&&!document.getElementById('idle').classList.contains('hidden')){
    e.preventDefault();openIpEntry();
  }
},true);
document.addEventListener('pointerdown',function(){if(mutedUnlock||pendingPlay)unmuteNow()},true);

function isAudioUrl(u){return /\.(mp3|m4a|aac|wav|ogg|flac)(\?|$)/i.test(u||'')}

function handle(m){
  if(m.v!==1&&m.v!==2)return;
  // HARDENING culto: mídia externa (vídeo/pdf/ppt/áudio da liturgia) viva
  // tem prioridade absoluta no slot. Mensagens de texto/projection não podem
  // renderizar por cima (cross-bleed owner — caso real 28/08: random sobre
  // vídeo). Só 'video'/'audio'/'stop-all' passam; o sender retoma quando a
  // mídia encerra.
  if((m.type==='projection'||m.type==='clock')){
    // heartbeat: mídia viva E sinal recente (<25s) → texto não passa.
    // Sem sinal novo, o lock expira (sender morto/stuck não trava o culto).
    const fresh=(Date.now()-(window.__mediaLastSeen||0))<25000;
    const _v=$('video'),_a=$('audio');
    const mediaActive=(_v&&!_v.paused&&_v.style.display!=='none')||(_a&&!_a.paused)||window.__videoAudioActive;
    if(mediaActive&&fresh&&!window.__mediaLock){
      try{dlog('BLOCKED',m.type,'— mídia externa ativa')}catch(e){}
      return;
    }
  }
  if(m.type==='video'||m.type==='audio')window.__mediaLastSeen=Date.now();
  // handshake pós-boot do sender: nada pode estar projetando — zera lock
  // de mídia morta (receiver bloqueava projection p/ sempre após vídeo).
  if(m.type==='idle'||m.type==='bgPalco'){
    window.__mediaLastSeen=0;
    if(window.__videoAudioActive){window.__videoAudioActive=false}
    try{const _v2=$('video'),_a2=$('audio');_v2.pause();_v2.removeAttribute('src');_v2.load();_a2.pause()}catch(e){}
  }
  switch(m.type){
    case 'projection':
      hideIdle();
      hideNp();
      {const t=$('timer'); if(t.style.display!=='none'){clearInterval(t._iv||0);
        t.style.display='none';$('text').style.display='';}}
      const bgEl=$('bg');
      bgEl.onerror=()=>{bgEl.onerror=null;bgEl.src='bg-fallback.png'};
      if(m.background){bgEl.src=proxyUrl(m.background)}
      // Sem bg na mensagem: usa o BG configurado no app (bgPalco — enviado
      // ao ligar o palco). Só se NÃO houver bg configurado cai no fallback
      // fixo. Vale pra qualquer módulo (26/08 Rafael).
      else if(bgPalco){bgEl.src=proxyUrl(bgPalco)}
      else{bgEl.src='bg-fallback.png'}
      // Slide/PDF/PPT (text vazio) é mídia visual pura: sem véu de leitura,
      // preserva a tonalidade original do canvas do operador.
      $('veil').style.display=m.text?'':'none';
      $('text').innerHTML=(m.text||'').replace(/<br\s*\/?>/gi,'\n');
      $('text').classList.toggle('cover-on',m.isCover===true);
      // F3.3o: fontSize/fontWeight dinâmicos (settings do operador).
      // Estrofes (lyric*) vencem quando presentes; capa (isCover) mantém o
      // estilo do operador — personalização de estrofe não pega na capa.
      {const t=$('text');
        const fs=typeof m.lyricFontSize==='number'?m.lyricFontSize:m.fontSize;
        const fw=typeof m.lyricFontWeight==='number'?m.lyricFontWeight:m.fontWeight;
        if(typeof fs==='number')t.style.setProperty('--fit-size',(fs/10.8)+'vw'); // px@1080p -> vw; font-size consome via calc(var(--fit-size)) — setar font-size inline MATARIA o fit (inline > stylesheet)
        if(typeof fw==='number')t.style.fontWeight=fw;
        // Capa (isCover): o AMARELO do .cover-on (CSS) é o visual do título.
        // inline style.color (no #text OU no <span> interno vindo do sender)
        // venceria a classe — capa remove cor inline de ambos os níveis
        // (05/10: capa nascia branca).
        if(m.isCover===true){
          t.style.removeProperty('color');
          t.querySelectorAll('span[style*="color"]').forEach(function(sp){sp.style.removeProperty('color')});
        }
        else if(typeof m.lyricTextColor==='string'&&m.lyricTextColor)t.style.color=m.lyricTextColor;
        if(m.lyricUpperCase===true)t.style.textTransform='uppercase';
        else if(m.lyricUpperCase===false)t.style.textTransform='none';
        /* SOLUÇÃO EZEQUIAS (web 3dc37df, 05/10): sem fit JS. pre-line quebra
           onde o autor mandou (\n) e flui até a max-width antes de quebrar
           de novo — fonte configurada aplicada direto, sem loop de medição. */
      }
      // F3.3m: estilos da letra — sombra (intensidade) + caixinha (borda)
      {const t=$('text');
        t.classList.remove('shadow-on','shadow-off','box-on','box-off');
        const tsOn=(typeof m.lyricTextShadow==='boolean'?m.lyricTextShadow:m.textShadow!==false);
        if(!tsOn){t.classList.add('shadow-off')}
        else{t.classList.add('shadow-on');
          if(typeof m.shadowBlur==='number')
            t.style.setProperty('--ts',`0 ${Math.max(1,m.shadowBlur/3)}vh ${m.shadowBlur}vh rgba(0,0,0,${m.shadowIntensity!=null?m.shadowIntensity:0.8})`)}
        if(m.textBox){t.classList.add('box-on');
          if(typeof m.boxOpacity==='number')t.style.setProperty('--box-bg',m.boxOpacity);
          t.style.setProperty('--box-border',
            m.boxBorder?`${m.boxBorder.width||0.4}vh solid ${m.boxBorder.color||'rgba(255,255,255,.25)'}`:'none')}
        else{t.classList.add('box-off')}
          // Personalização local refletida: alinhamento H/V e cor de fundo
          {const va=m.textVerticalAlign||'middle',ha=m.textAlign||'center';
            t.style.top=va==='top'?'6vh':va==='bottom'?'':'50%';
            t.style.bottom=va==='bottom'?'10vh':'';
            t.style.transform=va==='middle'?'translate(-50%,-50%)':'translate(-50%,0)';
            t.style.textAlign=ha;
            const vei=$('veil');
            if(typeof m.backgroundColor==='string'&&m.backgroundColor){vei.style.background=m.backgroundColor;vei.style.opacity='1'}
            else{vei.style.background='rgba(0,0,0,.45)';vei.style.opacity=''}}
      }
      // F3.3m: footer com referência destacada + versão
      {const f=$('footer');
        if(m.footerRef){
          f.innerHTML=`<span class="ref" style="--ref-color:${m.footerColor||'#FCCE02'};--ref-weight:${m.footerWeight||600}">${m.footerRef}</span>`+
            (m.footerVersion?`<span class="ver">${m.footerVersion}</span>`:'');
        }else{
          f.textContent=m.footer||'';
        }
      }
      break;
    case 'bgPalco':
      // BG permanente do palco (idle) — personalização, não da música
      bgPalco=m.url||'';
      if(bgPalco){
        $('bgPalco').src=proxyUrl(bgPalco);
      }else{
        $('bgPalco').removeAttribute('src');
      }
      break;
    case 'audio':{
      const a=$('audio');
      if(m.url){
        // F3.3-sync: só recarrega o src se a URL MUDOU — reenvio da mesma
        // faixa com action:play não pode reiniciar o áudio (loop 3s).
        const next=proxyUrl(m.url);
        if(a.src!==next){
          a.src=next;
          if(typeof m.positionMs==='number'&&m.positionMs>0){
            const apply=()=>{try{a.currentTime=m.positionMs/1000}catch(e){}};
            if(a.readyState>=1)apply();else a.addEventListener('loadedmetadata',apply,{once:true});
          }
          a.onended=()=>{hideNp();showIdle('Aguardando conteúdo…')};
          // Áudio "desconhecido" (sem metadados): now-playing padrão do
          // Palco — sem nome de arquivo, com a animação eq indicando que
          // há algo tocando. Mesmo visual do "só áudio" do app.
          if(m.title){
            showNp(m.title, m.subtitle||'', m.cover||'');
          }else{
            showNp('Reproduzindo áudio', m.subtitle||'', m.cover||'');
          }
          $('bg').src=m.background?proxyUrl(m.background):'bg-fallback.png';
        }
      }
      // BG garantido em TODA mensagem de áudio (load, play, pause, seek):
      // sem isso, mensagens action-only podiam deixar tela preta.
      if(!m.background){
        const cur=$('bg');
        if(!cur.src||cur.src.endsWith('/'))cur.src='bg-fallback.png';
      }
      if(m.action==='play'){
        // Now-playing tardio APENAS se não há projeção ativa na TV.
        // Hino da liturgia = projection (letra) + audio juntos: o np não
        // pode cobrir a letra projetada (caso real: hino mostrava
        // 'Reproduzindo áudio' em vez da letra).
        const np=$('np');
        const textEl=$('text');
        const hasProjection=textEl&&textEl.innerHTML&&textEl.innerHTML.trim()!==''&&np.style.display==='none';
        if(np.style.display==='none'&&!hasProjection){
          showNp(m.title||'Reproduzindo áudio', m.subtitle||'', m.cover||'');
          if(!m.background)$('bg').src='bg-fallback.png';
        }
        if(a.paused){dlog('PLAY src='+(a.src||'').slice(0,60));playWithFallback()}
        else dlog('PLAY ignorado — já tocando');
      }
      if(m.action==='pause'&&!a.paused)a.pause();
      if(m.action==='stop'){
        if(!window.__videoAudioActive){
          a.pause();a.currentTime=0;showIdle('Aguardando conteúdo…')}}
      if(m.action==='seek'){
        const target=(m.position||m.positionMs/1000||0);
        // só corrige se o desvio for perceptível — micro-sync causa stutter
        if(Math.abs(a.currentTime-target)>1.0){try{a.currentTime=target}catch(e){}}
        // sender mandou seek enquanto deveria tocar (play inicial pode ter
        // falhado por autoplay) → retoma; playWithFallback cuida do unlock
        if(a.paused&&target>0.2)playWithFallback();
      }
      break}
    case 'video':{
      const v=$('video');
      // MP3/áudio puro no canal video (popup liturgia manda dual): redireciona
      // pro fluxo de áudio — now-playing + EQ + bg (tela preta NUNCA).
      if(m.url&&isAudioUrl(m.url)){
        // Vídeo anterior pode estar fullscreen (z-index alto) e esconder o
        // now-playing. MP3 é áudio: mata a camada de vídeo antes do cartão.
        v.pause();v.removeAttribute('src');v.style.display='none';v.load();
        const av=$('audio');const next=proxyUrl(m.url);
        window.__videoAudioActive=true;
        if(av.src!==next){av.src=next;
          av.onended=()=>{hideNp();showIdle('Aguardando conteúdo…')};
          showNp(m.title||'Reproduzindo áudio', m.subtitle||'', m.cover||'');
          $('bg').src=m.background?proxyUrl(m.background):'bg-fallback.png';}
        if(m.action!=='pause'&&m.action!=='stop'&&av.paused)playWithFallback();
        if(m.action==='pause'&&!av.paused)av.pause();
        if(typeof m.positionMs==='number'&&m.positionMs>0){
          try{av.currentTime=m.positionMs/1000}catch(e){}}
        break;
      }
      hideIdle();hideNp();
      // Vídeo assumindo a TV: qualquer ÁUDIO anterior (hino/MP3) é PARADO
      // e limpo. Sem isso, o 'audio play' do tvBroadcast (que manda nos dois
      // canais) retomava o hino por cima do vídeo (caso real 26/08).
      {const a=$('audio');
        if(a&&a.src&&!(m.action==='stop'&&!m.url)){a.pause();a.removeAttribute('src');a.load()}}
      if(m.action==='stop'){v.pause();v.removeAttribute('src');v.style.display='none';
        v.load();showIdle('Aguardando conteúdo…');
        sendEvent({v:2,type:'ended',media:'video'});break}
      if(m.url){v.src=proxyUrl(m.url);v.style.display='';
        // Sync inicial (padrão F3.3g do áudio): positionMs aplicado antes
        // do play — seguro p/ metadata não carregada (loadedmetadata once).
        if(typeof m.positionMs==='number'&&m.positionMs>0){
          const apply=()=>{try{v.currentTime=m.positionMs/1000}catch(e){}};
          if(v.readyState>=1)apply();else v.addEventListener('loadedmetadata',apply,{once:true});
        }
        v.onended=()=>{v.style.display='none';v.removeAttribute('src');v.load();
          showIdle('Aguardando conteúdo…');
          sendEvent({v:2,type:'ended',media:'video'})}}
      if(m.action==='seek'){
        const target=(m.position||((m.positionMs||0)/1000)||0);
        // Spec multi-telas F4: tolerância 0.12s (era 0.3 — perceptível em
        // lábio/voz). Drift pequeno = correção SUAVE via playbackRate
        // (sem corte); grande (≥0.5s) = salto.
        const drift=target-v.currentTime;
        if(Math.abs(drift)>0.5){try{v.currentTime=target}catch(e){};v.playbackRate=1}
        else if(drift>0.12)v.playbackRate=Math.min(1.05,1+drift*0.5);
        else if(drift<-0.12)v.playbackRate=Math.max(0.95,1+drift*0.5);
        else v.playbackRate=1;
        if(v.paused&&target>0.2)playVideoWithFallback();
      }
      if(m.action==='play'){
        const a=$('audio'); a.pause(); // exclusao mutua com audio
        // Fallback mudo (padrão F3.3h do áudio): browser bloqueia play
        // com som sem gesto — retry mudo toca na hora, badge pede o gesto.
        playVideoWithFallback();
        sendEvent({v:2,type:'unlocked'});
      }
      if(m.action==='pause')v.pause();
      break}
    case 'timer':{
      hideIdle();
      const t=$('timer');
      if(m.action==='stop'){t.style.display='none';clearInterval(t._iv||0);$('text').style.display='';break}
      t.style.display='';$('text').style.display='none';
      let rem=(m.duration||0)*1000; // countdown segundos
      const mode=m.mode||'countdown';
      let elapsed=0;
      clearInterval(t._iv||0);
      const fmt=ms=>{const s=Math.max(0,Math.round(ms/1000));
        const hh=Math.floor(s/3600),mm=String(Math.floor(s/60)%60).padStart(2,'0'),
              ss=String(s%60).padStart(2,'0');
        return hh>0?`${hh}:${mm}:${ss}`:`${mm}:${ss}`};
      const render=()=>{
        const val=mode==='chrono'?elapsed:rem;
        t.innerHTML=fmt(val)+(m.label?`<small>${m.label}</small>`:'');
      };
      render();
      t._iv=setInterval(()=>{rem-=1000;elapsed+=1000;render();
        if(mode!=='chrono'&&rem<=0){clearInterval(t._iv)}},1000);
      break}
    case 'idle':showIdle(m.msg||'Aguardando conteúdo…');break;
    // F3.3x: sender informa IP DA TV (visto pelo socket) + SLOT onde ela
    // caiu — identificação visível pro operador conferir com o app.
    case 'youare':{
      if(m.ip){
        var who=(m.slotLabel||m.slot||'Palco');
        var isMain=!m.slot||m.slot==='0';
        if(isMain)who='Principal (espelho)';
        var el=document.getElementById('idleConn');
        if(el&&document.getElementById('idle')&&!document.getElementById('idle').classList.contains('hidden'))
          el.textContent=who+' · TV '+m.ip+' · conectado · vermelha = digitar IP';
        try{
          localStorage.setItem('palcoSelfIp',m.ip);
          localStorage.setItem('palcoSlotLabel',who);
        }catch(e){}
      }
      break;
    }
  }
}


connect();

// ===== F3.3ad: auto-relaunch — o Palco volta ao foreground sozinho =====
// Usado quando alguém sai do Palco sem querer (botão HOME/back) durante o
// culto. O webOS não permite launch REMOTO (401 no second-screen desta
// série), mas o próprio app tem permissão de launch via PalmServiceBridge
// (validado: returnValue:true). Estratégia: se o app perde o foreground
// (visibilitychange → hidden) e o sender estava CONECTADO, agenda o
// relaunch em 3s. Cancelável se voltar antes (usuário só deu uma olhada).
(function(){
  var relaunchTimer=null;
  function selfLaunch(){
    try{
      var b=new PalmServiceBridge();
      b.onservicecallback=function(){};
      b.call('luna://com.webos.applicationManager/launch',
        '{"id":"com.piano.louvorja.palco"}');
      dlog('AUTO-RELAUNCH disparado');
    }catch(e){dlog('AUTO-RELAUNCH erro: '+e.message)}
  }
  document.addEventListener('visibilitychange',function(){
    var wasConnected=ws&&ws.readyState===1;
    if(document.hidden&&wasConnected){
      if(relaunchTimer)clearTimeout(relaunchTimer);
      relaunchTimer=setTimeout(function(){
        if(document.hidden)selfLaunch(); // ainda fora? volta
        relaunchTimer=null;
      },3000);
    }else if(!document.hidden&&relaunchTimer){
      clearTimeout(relaunchTimer);relaunchTimer=null; // voltou sozinho
      dlog('AUTO-RELAUNCH cancelado (voltou ao foreground)');
    }
  });
})();
</script>
